version: 2

# Dependency updates, grouped.
#
# Ungrouped, this repository would open roughly forty pull requests a week —
# one per Radix package, one per Storybook package, one per TypeScript-adjacent
# tool — and the security update that matters would be lost among them. Grouping
# by ecosystem keeps the count reviewable, which is the only way the reviews
# actually happen.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
    open-pull-requests-limit: 8
    # Not rebased each time main moves: every rebase re-ran CI. Ask with
    # `@dependabot rebase`, or merge it as it is when it is current enough.
    rebase-strategy: disabled
    # The phone apps and Reach Mobile pin what the Expo SDK pins (React
    # 19.2.3, Reanimated, Worklets, FlashList, NativeWind): those move only
    # with an SDK upgrade (`npx expo install --fix`), never one at a time. A
    # bump there failed the mobile Storybook and the native export (#398).
    exclude-paths:
      - 'apps/mobile/**'
      - 'apps/tenant-mobile/**'
      - 'apps/storybook-mobile/**'
      - 'packages/ui-native/**'
    # A release is proposed only once it is a week old. A hijacked package is
    # usually caught and pulled within days; waiting keeps it out of the
    # lockfile. Security updates are exempt and still arrive at once.
    cooldown:
      default-days: 7
    # A dependency change touches the lockfile for the whole workspace, so the
    # commit should say so.
    commit-message:
      prefix: deps
      prefix-development: deps(dev)

    groups:
      # Security fixes travel alone and are never batched with a feature bump,
      # so the diff a reviewer reads is only the fix.
      security:
        applies-to: security-updates
        patterns: ['*']

      radix:
        patterns: ['@radix-ui/*']
      storybook:
        patterns: ['storybook', '@storybook/*']
      typescript:
        patterns: ['typescript', '@typescript/*', 'typescript-eslint', '@typescript-eslint/*']
      linting:
        patterns: ['eslint*', 'oxlint', 'prettier*']
      testing:
        patterns: ['vitest', '@vitest/*', 'playwright', '@playwright/*', '@testing-library/*']
      tiptap:
        patterns: ['@tiptap/*']
      dnd-kit:
        patterns: ['@dnd-kit/*']
      # Every other minor and patch update in one pull request a week, rather
      # than one each: every pull request runs CI. Majors stay separate, since
      # they are the ones that break something. Listed last, so the groups
      # above keep theirs.
      everything-else:
        patterns: ['*']
        update-types: [minor, patch]

    ignore:
      # Held deliberately. `CLAUDE.md` pins two compilers on purpose: TypeScript
      # 7 for the fast local check and TypeScript 6 as the merge gate, because
      # 7.0 ships no programmatic API and typescript-eslint cannot run on it
      # until 7.1. Collapsing to one compiler is a decision, not an upgrade, so
      # Dependabot must not propose it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@typescript/typescript6'
        update-types: [version-update:semver-major]
      # Expo pins these native modules per SDK (`expo/bundledNativeModules.json`):
      # SDK 57 ships react-native 0.86.3 and react-native-webview 13.16.1, and a
      # newer one breaks the build the app runs in. They move with the Expo SDK
      # upgrade, never on their own.
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-webview
        update-types: [version-update:semver-major, version-update:semver-minor]
      # The SDK itself and its modules, wherever they appear: an SDK upgrade
      # is its own piece of work.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      # Babel 8 breaks the mobile Storybook and the native export:
      # react-native-worklets' Babel plugin requires "^7.0.0-0" (#384). Lift
      # this when a worklets release accepts Babel 8.
      - dependency-name: '@babel/core'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
    commit-message:
      prefix: ci
    # A week old before proposed, as for npm.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
