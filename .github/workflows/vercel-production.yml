name: Vercel Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: team_uActP8CY3wkqOpyG5WDKXKkTj
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Vercel credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
      - name: Build Docs
        run: pnpm --filter @reach/docs build
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Deploy Docs production
        id: docs
        env:
          VERCEL_PROJECT_ID: prj_hjiSAIp2hweckjQGdJVT5HAQ3zg9
        run: |
          url="$(npx --yes vercel@latest deploy apps/docs/dist --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Docs production: $url"
      - name: Deploy Storybook production
        id: storybook
        env:
          VERCEL_PROJECT_ID: prj_u605gEWnCNjhTkdr0J7lCBCBGgcO
        run: |
          url="$(npx --yes vercel@latest deploy apps/storybook/storybook-static --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Storybook production: $url"
      - name: Publish production URLs to merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_URL: ${{ steps.docs.outputs.url }}
          STORYBOOK_URL: ${{ steps.storybook.outputs.url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pr_number=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].number')
          body="<!-- vercel-production -->
          ## 🚀 Vercel Production

          Deployed from **main** (`${SHA:0:7}`).

          - **Docs:** ${DOCS_URL}
          - **Storybook:** ${STORYBOOK_URL}
          "
          if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
            existing=$(gh api "repos/${REPO}/issues/${pr_number}/comments" --paginate --jq '.[] | select(.body | contains("<!-- vercel-production -->")) | .id' | head -n 1)
            if [ -n "$existing" ]; then
              gh api "repos/${REPO}/issues/comments/${existing}" --method PATCH -f body="$body"
            else
              gh pr comment "$pr_number" --body "$body"
            fi
          else
            echo "::warning::No pull request found for commit ${SHA}; deployment succeeded but no PR comment was posted."
          fi
