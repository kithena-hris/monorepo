name: vercel-production

# Production deploys, and only after `ci` has gone green on the same commit.
#
# A separate workflow cannot use `needs:`, so the dependency is expressed with
# `workflow_run` plus an explicit conclusion check. On `push` this would deploy
# whatever landed on main regardless of whether the axe pass, the contrast gate
# or the tests failed — publishing the build the gates just rejected, which is
# the one outcome they exist to prevent.
#
# Only what changed ships. The Hobby plan allows 100 deployments a day, and
# eight projects a merge spent that before the day was out. `plan` diffs this
# commit against `deployed/production/<target>`, the tag each target's last
# successful deploy left, and every job below is gated on its target; `mark`
# moves the tags once a run succeeds. docs/environments.md, "What a deploy
# ships".
#
# One job per target, in parallel wherever the order does not matter, and
# chained by `needs:` where it does: schema, then service, then client.
#
#   plan ─┬─ images (one runner per changed image) ───────────────┐
#         ├─ migrate ── identity ── messaging ─┬─ auth            │
#         │                                    ├─ back-office     │
#         │                                    └─ vm ◀────────────┘
#         ├─ people remote: build and sign ──── people remote ◀── vm
#         ├─ time off remote: build and sign ── time off remote ◀── vm
#         │                                       └─ web, after both remotes
#         ├─ docs
#         └─ storybook
#   every job ── rollback (only when one failed) / mark (only when none did)
#
# A job whose target did not change is skipped, and a skipped job does not hold
# up the ones after it (`!failure()`); a failed one does, and the rollback then
# undoes everything this run deployed. Before 2026-10-02 all of this was one
# job, 6.5 minutes for a web change and 14 with the VM.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # For what git cannot see: a secret or a variable changed, or a deploy
  # needs repeating. `gh workflow run vercel-production.yml -f targets=identity,messaging`.
  # Runs on main only, and ships these on top of whatever changed.
  workflow_dispatch:
    inputs:
      targets:
        description: 'Redeploy even if unchanged: all, or a comma list of shell, auth, admin, identity, messaging, docs, storybook, people-remote, timeoff-remote, people, router, slack, audit, timeoff, migrations'
        type: string
        default: ''
  # `deploy-production.yml`, the checkbox form: the same jobs, with `only`
  # deploying exactly the targets it names.
  workflow_call:
    inputs:
      targets:
        type: string
        default: ''
      only:
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

env:
  # The team the projects live under. Not a secret — it names an account, it
  # does not authorise anything. The token that does is a repository secret.
  VERCEL_ORG_ID: team_uActP8CY3wkqOpyG5WDKXkTj
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  # Pinned. This runs with a production token; "@latest" hands whatever
  # was published minutes ago the ability to deploy. Dependabot does not
  # watch an npx invocation, so this is bumped deliberately.
  VERCEL_CLI_VERSION: 59.3.0
  # The commit `ci` tested, or main's tip for a manual run.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: vercel-production
  # Never cancelled halfway: cancelling a deploy leaves whichever half-uploaded
  # build the CDN happened to have.
  cancel-in-progress: false

jobs:
  # Which targets this commit changes since each last shipped here
  # (`tools/scripts/src/affected-targets.ts`). One output per target, plus `vm`
  # (People, the router or a migration: the VM is touched), `any`, and
  # `images`, the VM images to build as a JSON list for the matrix below.
  plan:
    name: what changed
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shell: ${{ steps.plan.outputs.shell }}
      auth: ${{ steps.plan.outputs.auth }}
      admin: ${{ steps.plan.outputs.admin }}
      identity: ${{ steps.plan.outputs.identity }}
      messaging: ${{ steps.plan.outputs.messaging }}
      docs: ${{ steps.plan.outputs.docs }}
      storybook: ${{ steps.plan.outputs.storybook }}
      people-remote: ${{ steps.plan.outputs.people-remote }}
      timeoff-remote: ${{ steps.plan.outputs.timeoff-remote }}
      people: ${{ steps.plan.outputs.people }}
      router: ${{ steps.plan.outputs.router }}
      slack: ${{ steps.plan.outputs.slack }}
      audit: ${{ steps.plan.outputs.audit }}
      timeoff: ${{ steps.plan.outputs.timeoff }}
      migrations: ${{ steps.plan.outputs.migrations }}
      vm: ${{ steps.plan.outputs.vm }}
      any: ${{ steps.plan.outputs.any }}
      images: ${{ steps.images.outputs.images }}
    steps:
      # A missing token should say so in one line, rather than surfacing as a
      # CLI usage error forty lines into the output of the first deploy job.
      - name: check the token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::missing production secret: VERCEL_TOKEN"
            exit 1
          fi
      # Full history: the diff reaches back to each target's last deploy.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile
      # `--force`: the tags move, and a stale local copy would diff against
      # the wrong commit.
      - name: fetch the deploy markers
        run: git fetch --force --quiet origin 'refs/tags/deployed/production/*:refs/tags/deployed/production/*'
      - name: pick affected targets
        id: plan
        env:
          FORCE: ${{ inputs.targets }}
          ONLY: ${{ inputs.only }}
        run: |
          args=(--env production --head "$DEPLOY_SHA" --force "$FORCE")
          [ "$ONLY" = true ] && args+=(--only)
          pnpm exec tsx tools/scripts/src/affected-targets.ts "${args[@]}"
      - name: images to build
        id: images
        env:
          PEOPLE: ${{ steps.plan.outputs.people }}
          ROUTER: ${{ steps.plan.outputs.router }}
          SLACK: ${{ steps.plan.outputs.slack }}
          AUDIT: ${{ steps.plan.outputs.audit }}
          TIMEOFF: ${{ steps.plan.outputs.timeoff }}
        run: |
          list=()
          for name in people router slack audit timeoff; do
            var="${name^^}"
            [ "${!var}" = true ] && list+=("\"$name\"")
          done
          echo "images=[$(IFS=,; echo "${list[*]}")]" | tee -a "$GITHUB_OUTPUT"
      - name: warn about what will not be deployed
        env:
          ROUTER: ${{ vars.ROUTER_URL_PRODUCTION }}
          REMOTE: ${{ vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION }}
          TIMEOFF_REMOTE: ${{ vars.VERCEL_PROJECT_ID_TIMEOFF_REMOTE_PRODUCTION }}
          MESSAGING: ${{ vars.VERCEL_PROJECT_ID_MESSAGING_PRODUCTION }}
          MESSAGING_CHANGED: ${{ steps.plan.outputs.messaging }}
        run: |
          [ -z "$ROUTER" ] && echo "::warning::ROUTER_URL_PRODUCTION is unset: People, Time Off and the router are not deployed"
          [ -z "$REMOTE" ] && echo "::warning::VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION is unset: the People remote is not deployed"
          [ -z "$TIMEOFF_REMOTE" ] && echo "::warning::VERCEL_PROJECT_ID_TIMEOFF_REMOTE_PRODUCTION is unset: the Time Off remote is not deployed"
          if [ "$MESSAGING_CHANGED" = true ] && [ -z "$MESSAGING" ]; then
            echo "::warning::VERCEL_PROJECT_ID_MESSAGING_PRODUCTION is unset, so the messaging service is not deployed. Invitations will not be emailed; enrolment links are still returned to the back-office."
          fi
          true

  # People's, the router's, Slack's, audit's and Time Off's images, one runner each,
  # built natively for the VM's platform (`VM_PLATFORM`, `docs/environments.md`
  # "Hosting") and proven before they are pushed: the router image must pass a
  # persisted operation, refuse an unknown hash and refuse a request without a
  # token (`apps/gateway/scripts/smoke.ts`), and the others must boot and
  # answer `/health`. Nothing is pushed otherwise.
  #
  # The supergraph routes to `http://people:4001`, People's name on the VM's
  # Compose network in every environment, so one router image per commit
  # serves either. Skipped while `ROUTER_URL_PRODUCTION` is unset, and each
  # image only when its target changed.
  #
  # No layer cache. The only layer that survives a commit is People's
  # `pnpm fetch` of the whole workspace, and the repository's 10 GB Actions
  # cache is already full of pnpm stores; a gigabyte of Docker layers there
  # would evict the stores every CI job restores from. Parallel runners are
  # where the time was: four builds in series took 3.7-5 minutes.
  images:
    name: image (${{ matrix.image }})
    needs: plan
    if: >
      vars.ROUTER_URL_PRODUCTION != '' &&
      needs.plan.outputs.images != '' && needs.plan.outputs.images != '[]'
    # A native runner for the VM's architecture, both free for a public
    # repository. Under QEMU the People build takes an order of magnitude
    # longer, so there is no cross-build: `--platform` below only makes a
    # mismatch fail loudly.
    runs-on: ${{ vars.VM_PLATFORM == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      SOURCE: https://github.com/${{ github.repository }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      # The name the VM job pulls: lower case, because GHCR refuses anything else.
      - name: name
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.image }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/kithena-$NAME:$DEPLOY_SHA" >> "$GITHUB_ENV"
      # Only the router needs the workspace here: `wgc` composes its supergraph
      # and the smoke test runs under tsx. The others build inside Docker.
      - name: pnpm
        if: matrix.image == 'router'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        if: matrix.image == 'router'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        if: matrix.image == 'router'
        run: pnpm install --frozen-lockfile

      - name: platform
        env:
          PLATFORM: ${{ vars.VM_PLATFORM || 'linux/amd64' }}
        run: |
          case "$PLATFORM" in
            linux/amd64 | linux/arm64) echo "DOCKER_DEFAULT_PLATFORM=$PLATFORM" >> "$GITHUB_ENV" ;;
            *) echo "::error::VM_PLATFORM must be linux/amd64 or linux/arm64, not $PLATFORM"; exit 1 ;;
          esac

      - name: build and test the router image
        if: matrix.image == 'router'
        working-directory: apps/gateway
        run: |
          cat > graph.deploy.yaml <<'EOF'
          version: 1
          subgraphs:
            - name: people
              routing_url: http://people:4001/graphql
              schema:
                file: ../../services/people/schemas/people.graphql
            - name: timeoff
              routing_url: http://timeoff:4002/graphql
              schema:
                file: ../../services/timeoff/schemas/timeoff.graphql
            - name: audit
              routing_url: http://audit:4103/graphql
              schema:
                file: ../../platform/audit/schemas/audit.graphql
          EOF
          pnpm exec wgc router compose -i graph.deploy.yaml -o supergraph.json
          docker build --tag "$IMAGE" --label "org.opencontainers.image.source=$SOURCE" .
          pnpm exec tsx scripts/smoke.ts "$IMAGE"

      # People: with no settings it boots and serves its schema; a native
      # module built for the wrong libc or architecture dies at import, before
      # this. Slack: development mode for the check only — in production it
      # refuses to start without its database and key, which a bare `docker
      # run` has neither of; what this proves is that the image boots. Audit:
      # with no settings it boots, keeps nothing and serves its schema. Time
      # Off: with no settings it boots and serves its schema, on `/healthz`.
      - name: build and test the ${{ matrix.image }} image
        if: matrix.image != 'router'
        env:
          NAME: ${{ matrix.image }}
        run: |
          case "$NAME" in
            people) dockerfile=services/people/Dockerfile; port=4001; health=health; run_env=() ;;
            slack) dockerfile=platform/slack/Dockerfile; port=4102; health=health; run_env=(--env NODE_ENV=development) ;;
            audit) dockerfile=platform/audit/Dockerfile; port=4103; health=health; run_env=() ;;
            timeoff) dockerfile=services/timeoff/Dockerfile; port=4002; health=healthz; run_env=() ;;
            *) echo "::error::no build for image $NAME"; exit 1 ;;
          esac
          docker build --file "$dockerfile" --tag "$IMAGE" \
            --label "org.opencontainers.image.source=$SOURCE" .
          container="$(docker run --detach "${run_env[@]}" --publish "127.0.0.1:$port:$port" "$IMAGE")"
          if ! curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors \
            "http://127.0.0.1:$port/$health" >/dev/null; then
            docker logs "$container"
            exit 1
          fi
          docker rm --force "$container"

      - name: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push --quiet "$IMAGE"
          docker logout ghcr.io

      # The registry is transport, not history: the VM keeps the image each
      # environment is on and the one before it, which is all a rollback
      # needs, so five versions a package is plenty.
      - name: prune old images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: kithena-${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 5

  # Migrations before any service, never after. Expand-contract means the new
  # schema is readable by the old code, so migrating first is safe; migrating
  # second leaves a window where new code reads columns that do not exist.
  #
  # There is no rollback for this and there will not be one. `CLAUDE.md` is
  # explicit that there are no down migrations against a multi-tenant
  # production database — a failed migration is fixed forward, by a
  # migration, reviewed like any other change.
  migrate:
    name: migrate production
    needs: plan
    if: needs.plan.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    outputs:
      shipped: ${{ steps.migrations.outcome == 'success' }}
    # The throwaway database `atlas migrate lint` replays the directory into,
    # run here rather than left to `docker://` so that the service roles can be
    # created in it first. See the `atlas dev roles` step for why that matters.
    services:
      atlas-dev:
        image: postgres:18
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dev -d dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: check the database secret
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::missing production secret: DATABASE_URL"
            exit 1
          fi
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Roles are cluster-level in Postgres, so a container Atlas has just
      # started has none of them. `migrate lint` replays the whole directory
      # into the dev database to work out what a migration does, reaches
      # `GRANT ... TO svc_identity`, and dies on a role nothing in the
      # directory creates:
      #
      #     Error: executing statement: pq: role "svc_identity" does not exist
      #     -- 1 version with errors
      #
      # Production has these roles and is correctly migrated; only the scratch
      # database lacked them. The failure therefore said nothing about
      # production, and because this step runs under `bash -e`, `lint` exiting
      # non-zero meant `apply` and every deploy step below it never ran. The
      # identity and web deploys were silently skipped for a day.
      #
      # Created NOLOGIN and without a password: a GRANT only needs the role to
      # exist, nothing connects to this container as one of them, and a
      # password here would be a credential in the workflow for no gain.
      #
      # Kept in step with `tools/scripts/init-db.sql` — same roles, same
      # reason. A migration granting to a role this step does not know about
      # fails here, which is the right place to find out.
      #
      # A service container rather than Atlas's own `docker://` dev URL,
      # because the HCL `docker` block that would let Atlas seed the roles
      # itself needs `atlas login` — the paid tier this version is pinned to
      # avoid.
      - name: atlas dev roles
        env:
          PGPASSWORD: dev
        run: |
          psql -h localhost -p 5433 -U dev -d dev -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE svc_people;
          CREATE ROLE svc_timeoff;
          CREATE ROLE svc_identity NOBYPASSRLS;
          CREATE ROLE svc_messaging NOBYPASSRLS;
          CREATE ROLE svc_slack NOBYPASSRLS;
          CREATE ROLE svc_audit NOBYPASSRLS;
          SQL

      - name: migrate production
        id: migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ATLAS_DEV_URL: postgres://dev:dev@localhost:5433/dev?sslmode=disable&search_path=public
        run: |
          # Pinned, not `latest`. Atlas moved `migrate lint` behind a paid
          # tier in v0.38, and because this downloaded `latest` the production
          # deploy broke on a release nobody here made. A version that can
          # change under us is a deploy that can fail for reasons not in this
          # repository. v0.37.0 is the last release where `lint` runs without
          # an account; bump it deliberately.
          ATLAS_VERSION=v0.37.0
          curl -sSf "https://release.ariga.io/atlas/atlas-linux-amd64-${ATLAS_VERSION}" -o /usr/local/bin/atlas
          chmod +x /usr/local/bin/atlas
          # `lint` first: atlas.hcl marks destructive changes an error in this
          # environment, so a DROP reaches CI's output rather than the database.
          atlas migrate lint --env production --latest 1
          atlas migrate apply --env production

  # The identity service.
  #
  # After the migration and before everything that calls it. Expand-contract
  # means new code reads the old schema and old code reads the new one, so the
  # only ordering that is never wrong is schema, then service, then client.
  #
  # A Vercel function rather than a container since 2026-08-22: the reason
  # it needed a process was a Valkey connection held across requests, and
  # challenges live in Postgres now. docs/environments.md has the rest.
  #
  # `kithena-identity-production`, not `kithena-identity`. This deployed to
  # the staging project until now, which is the project `identity.staging`
  # points at — so production identity code went to the staging project's
  # production environment and never reached `identity.kithena.com`, which
  # belongs to `kithena-identity-production`. The smoke test below passed
  # throughout, because the domain kept serving the older deployment that
  # *was* in the right project.
  #
  # `docs/environments.md`: "separate databases, separate credentials and
  # separate Vercel projects exist to make the wrong thing hard rather than
  # merely forbidden."
  #
  # No install and no build here, nor in any job that deploys a Vercel-built
  # project: `.vercelignore` keeps `node_modules` and every build output out of
  # the upload, and Vercel installs and builds from the lockfile itself.
  identity:
    name: identity
    needs: [plan, migrate]
    if: >
      !cancelled() && !failure() &&
      needs.plan.outputs.identity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: deploy identity
        id: deploy
        env:
          VERCEL_PROJECT_ID: prj_ShPvJf0eeh9wwe1HwB2mFnMrTjRL
        run: |
          npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prod \
            --yes --archive=tgz --token "$VERCEL_TOKEN"
      # The custom domain, not the deployment URL. `ssoProtection` is set to
      # `all_except_custom_domains`, so a `.vercel.app` host answers 302 to a
      # login page and would pass a naive check that follows redirects.
      - name: smoke test identity
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --max-time 30 \
            https://identity.kithena.com/.well-known/jwks.json >/dev/null

  # The messaging service.
  #
  # After the migration, because it owns `messaging.delivery`, and after
  # identity, because identity is what calls it. Deploying the caller first
  # would leave a window where an invitation is issued and the thing that
  # mails it is still the previous build.
  #
  # Its project id comes from a repository variable rather than being
  # written here like identity's. The project is created once by hand, and
  # this workflow has to be mergeable before that happens — the alternative
  # is a literal id that does not exist yet, which fails the deploy for a
  # reason not in this repository.
  messaging:
    name: messaging
    needs: [plan, identity]
    if: >
      !cancelled() && !failure() &&
      needs.plan.outputs.messaging == 'true' && vars.VERCEL_PROJECT_ID_MESSAGING_PRODUCTION != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: deploy messaging
        id: deploy
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_MESSAGING_PRODUCTION }}
          # The only origin shape a notice may link to (`https://{slug}.…`).
          # A repository variable, like the project id. Unset, nothing is
          # passed and the service fails closed: it refuses every notice rather
          # than trusting a default that points at localhost.
          TENANT_APP_BASE: ${{ vars.TENANT_APP_BASE_PRODUCTION }}
        run: |
          args=(--prod --yes --archive=tgz --token "$VERCEL_TOKEN")
          if [ -n "$TENANT_APP_BASE" ]; then
            args+=(--env "TENANT_APP_BASE=$TENANT_APP_BASE")
          else
            echo "::warning::TENANT_APP_BASE_PRODUCTION is unset: messaging will send no reminder or webhook alert"
          fi
          npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy "${args[@]}"
      # `/healthz` is unauthenticated on purpose and says nothing worth having:
      # a status, and which transport is composed. Putting the shared secret in
      # a smoke test is how the shared secret reaches a workflow log.
      #
      # It reports the transport for a reason. `log` in production means
      # `RESEND_API_KEY` is missing and every invitation is being written to
      # stdout instead of sent — which looks exactly like a working deployment
      # until somebody asks why no new hire has ever been able to log in. The
      # service refuses to boot in that state, so this asserting `resend` is the
      # belt to that braces.
      - name: smoke test messaging
        run: |
          set -o pipefail
          body="$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --max-time 30 \
            https://messaging.kithena.com/healthz)"
          echo "$body"
          if ! grep -q '"transport":"resend"' <<<"$body"; then
            echo "::error::messaging is not composed against a real provider"
            exit 1
          fi

  # People, Slack, audit and the router, on the VM — after identity, whose
  # keys the router checks tokens against, and after messaging, which People
  # mails through.
  #
  # Schema, then service, then client, one layer further out: People serves
  # the subgraph, the router composes it, the remote renders against what
  # the router serves, and the shell loads the remote.
  #
  # People and the router run on one 4 GB VM under Docker Compose
  # (`deploy/vm/`), reached by SSH over AWS Systems Manager; only the router is public,
  # through a Cloudflare Tunnel. People holds Kafka consumer groups, runs
  # hourly jobs and drains on SIGTERM (PEO-118), so it needs a process,
  # not a function. `docs/environments.md` "Hosting" has the rest.
  #
  # One job, the services in series: they share the VM's 4 GB, Slack asks
  # People, and the router routes to People, Time Off and audit.
  #
  # Skipped while `ROUTER_URL_PRODUCTION` is unset, so this merges before the
  # VM exists.
  vm:
    name: VM (people, slack, audit, timeoff, router)
    needs: [plan, images, migrate, identity, messaging]
    if: >
      !cancelled() && !failure() &&
      vars.ROUTER_URL_PRODUCTION != '' && needs.plan.outputs.vm == 'true'
    runs-on: ubuntu-latest
    # The deploy waits for People and the router to be healthy.
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: read
      # GitHub's OIDC token, exchanged for the role that may start the VM and
      # open an SSH tunnel to it through SSM (`deploy/aws/provision.sh`).
      id-token: write
    # Each service's outcome and the image it was on before, for the rollback.
    outputs:
      people-outcome: ${{ steps.people.outcome }}
      people-previous: ${{ steps.people.outputs.previous }}
      slack-outcome: ${{ steps.slack.outcome }}
      slack-previous: ${{ steps.slack.outputs.previous }}
      audit-outcome: ${{ steps.audit.outcome }}
      audit-previous: ${{ steps.audit.outputs.previous }}
      timeoff-outcome: ${{ steps.timeoff.outcome }}
      timeoff-previous: ${{ steps.timeoff.outputs.previous }}
      router-outcome: ${{ steps.router.outcome }}
      router-previous: ${{ steps.router.outputs.previous }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # The names the images job pushed (`ghcr.io/<owner>/kithena-<name>:<sha>`).
      - name: names
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGES=ghcr.io/${OWNER,,}/kithena" >> "$GITHUB_ENV"

      - name: check the VM settings
        env:
          INSTANCE: ${{ vars.WORKSPACE_INSTANCE_ID_PRODUCTION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          VM_DEPLOY_SSH_KEY: ${{ secrets.VM_DEPLOY_SSH_KEY }}
          PEOPLE_API_TOKEN: ${{ secrets.PEOPLE_API_TOKEN }}
          AUDIT_API_TOKEN: ${{ secrets.AUDIT_API_TOKEN }}
          PEOPLE_ENV: ${{ secrets.PEOPLE_ENV }}
          TIMEOFF_API_TOKEN: ${{ secrets.TIMEOFF_API_TOKEN }}
          TIMEOFF_ENV: ${{ secrets.TIMEOFF_ENV }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          AUTH_TOKEN_AUDIENCE: ${{ vars.AUTH_TOKEN_AUDIENCE_PRODUCTION }}
          KITHENA_ENTITLEMENTS: ${{ vars.KITHENA_ENTITLEMENTS_PRODUCTION }}
          IMAGES_RESULT: ${{ needs.images.result }}
          NEED_IMAGES: ${{ needs.plan.outputs.images != '[]' }}
        run: |
          missing=
          for name in INSTANCE AWS_DEPLOY_ROLE_ARN AWS_REGION VM_DEPLOY_SSH_KEY PEOPLE_API_TOKEN AUDIT_API_TOKEN PEOPLE_ENV \
                      TIMEOFF_API_TOKEN TIMEOFF_ENV CLOUDFLARE_TUNNEL_TOKEN AUTH_TOKEN_AUDIENCE KITHENA_ENTITLEMENTS; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing production setting(s):$missing (docs/environments.md, Hosting)"
            exit 1
          fi
          if [ "$NEED_IMAGES" = true ] && [ "$IMAGES_RESULT" != success ]; then
            echo "::error::the VM images job did not succeed ($IMAGES_RESULT)"
            exit 1
          fi

      - name: ssh to the VM
        uses: ./.github/actions/vm-ssh
        with:
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          instance: ${{ vars.WORKSPACE_INSTANCE_ID_PRODUCTION }}
          ssh-key: ${{ secrets.VM_DEPLOY_SSH_KEY }}

      # The VM stops itself when idle (`deploy/vm/idle-stop.sh`), so a deploy
      # starts it first: a no-op when it is running. The deploy itself then
      # counts as activity, so the VM stays up at least `IDLE_STOP_MINUTES`
      # after it. Running is not reachable: SSH goes through the SSM agent, so
      # wait until Systems Manager reports the agent `Online`.
      - name: wake the VM
        env:
          INSTANCE: ${{ vars.WORKSPACE_INSTANCE_ID_PRODUCTION }}
        run: |
          aws ec2 start-instances --instance-ids "$INSTANCE" \
            --query 'StartingInstances[0].[PreviousState.Name,CurrentState.Name]' --output text
          aws ec2 wait instance-running --instance-ids "$INSTANCE"
          ping=
          for _ in $(seq 1 60); do
            ping="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE" \
              --query 'InstanceInformationList[0].PingStatus' --output text)"
            [ "$ping" = Online ] && break
            sleep 5
          done
          if [ "$ping" != Online ]; then
            echo "::error::the SSM agent on $INSTANCE is not online ($ping) after 5 min"
            exit 1
          fi

      # Secrets travel on stdin into root-only 0600 files under
      # `/etc/kithena/production/`: never argv, never an image, never this
      # repository. `PEOPLE_API_TOKEN` is appended to People's settings and
      # written into the router's from the one secret, so the token the router
      # sends and the token People expects cannot drift apart. The registry
      # login is this job's own token, which expires with the job.
      - name: prepare the VM
        id: prepare
        env:
          PEOPLE_API_TOKEN: ${{ secrets.PEOPLE_API_TOKEN }}
          PEOPLE_ENV: ${{ secrets.PEOPLE_ENV }}
          # The assistant's model key. Optional: absent, the assistant is off.
          ASSISTANT_API_KEY: ${{ secrets.ASSISTANT_API_KEY }}
          # Slack (`platform/slack`). Optional: without the app token and the
          # pair's token, the service starts and stays off.
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_TOKEN_KEY: ${{ secrets.SLACK_TOKEN_KEY }}
          SLACK_PEOPLE_TOKEN: ${{ secrets.SLACK_PEOPLE_TOKEN }}
          # The Slack–Time Off pair's secret, written into both ends.
          SLACK_TIMEOFF_TOKEN: ${{ secrets.SLACK_TIMEOFF_TOKEN }}
          # The router–audit pair's secret (`docs/audit.md`, "Deploying"),
          # written into both ends from the one secret, as PEOPLE_API_TOKEN is.
          AUDIT_API_TOKEN: ${{ secrets.AUDIT_API_TOKEN }}
          # The router–Time Off pair's secret, written into both ends from the
          # one secret, as PEOPLE_API_TOKEN is; `TIMEOFF_ENV` is the rest of
          # Time Off's settings, `TIMEOFF_FEED_SECRET` among them.
          TIMEOFF_API_TOKEN: ${{ secrets.TIMEOFF_API_TOKEN }}
          TIMEOFF_ENV: ${{ secrets.TIMEOFF_ENV }}
          # The calendar integrations' credentials (TOF-110), each its own
          # secret so adding one never means rewriting TIMEOFF_ENV. Unset, the
          # integration is not offered. The Google key is the service
          # account's JSON on one line (`jq -c`).
          TIMEOFF_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.TIMEOFF_GOOGLE_SERVICE_ACCOUNT }}
          TIMEOFF_MICROSOFT_CLIENT_ID: ${{ secrets.TIMEOFF_MICROSOFT_CLIENT_ID }}
          TIMEOFF_MICROSOFT_CLIENT_SECRET: ${{ secrets.TIMEOFF_MICROSOFT_CLIENT_SECRET }}
          # The key a provider's tokens are sealed under.
          TIMEOFF_INTEGRATION_KEY: ${{ secrets.TIMEOFF_INTEGRATION_KEY }}
          # Where a provider calls back: the tunnel routes Time Off's public
          # paths on this host to it (docs/environments.md, "Time Off's routes").
          TIMEOFF_PUBLIC_URL: ${{ vars.TIMEOFF_PUBLIC_URL || 'https://api.kithena.com' }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          # The identity outbox relay's way into Neon: the direct (not pooled)
          # endpoint, and `svc_debezium`'s password. Unset, identity's outbox is
          # not relayed and the deploy warns.
          IDENTITY_RELAY_HOST: ${{ vars.IDENTITY_RELAY_HOST_PRODUCTION }}
          IDENTITY_RELAY_PASSWORD: ${{ secrets.IDENTITY_RELAY_PASSWORD }}
          AUTH_TOKEN_AUDIENCE: ${{ vars.AUTH_TOKEN_AUDIENCE_PRODUCTION }}
          KITHENA_ENTITLEMENTS: ${{ vars.KITHENA_ENTITLEMENTS_PRODUCTION }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          # The agent can be online a moment before sshd accepts.
          for _ in $(seq 1 12); do ssh -o ConnectTimeout=10 vm true && break; sleep 5; done
          # `migrations/` replaced whole, so the copy is exactly this commit's.
          ssh vm 'mkdir -p kithena && rm -rf kithena/migrations'
          scp -q -r deploy/vm/compose.yaml deploy/vm/compose.staging.yaml \
            deploy/vm/deploy.sh deploy/vm/backup.sh deploy/vm/idle-stop.sh deploy/vm/debezium.env \
            atlas.hcl migrations vm:kithena/
          ssh vm sudo install -d -m 700 /etc/kithena /etc/kithena/production
          put() { ssh vm sudo install -m 600 /dev/stdin "/etc/kithena/production/$1"; }
          {
            printf '%s\nPEOPLE_API_TOKEN=%s\n' "$PEOPLE_ENV" "$PEOPLE_API_TOKEN"
            if [ -n "$ASSISTANT_API_KEY" ]; then printf 'ASSISTANT_API_KEY=%s\n' "$ASSISTANT_API_KEY"; fi
            if [ -n "$SLACK_PEOPLE_TOKEN" ]; then
              printf 'SLACK_URL=http://slack:4102\nSLACK_PEOPLE_TOKEN=%s\n' "$SLACK_PEOPLE_TOKEN"
            fi
          } | put people.env
          printf 'SLACK_APP_TOKEN=%s\nSLACK_CLIENT_ID=%s\nSLACK_CLIENT_SECRET=%s\nSLACK_TOKEN_KEY=%s\nSLACK_PEOPLE_TOKEN=%s\nSLACK_TIMEOFF_TOKEN=%s\nAUTH_ORIGIN=https://auth.app.kithena.com\nSLACK_COMMAND=/kithena\n' \
            "$SLACK_APP_TOKEN" "$SLACK_CLIENT_ID" "$SLACK_CLIENT_SECRET" "$SLACK_TOKEN_KEY" "$SLACK_PEOPLE_TOKEN" "$SLACK_TIMEOFF_TOKEN" | put slack.env
          printf 'AUDIT_API_TOKEN=%s\n' "$AUDIT_API_TOKEN" | put audit.env
          {
            printf '%s\nTIMEOFF_API_TOKEN=%s\n' "$TIMEOFF_ENV" "$TIMEOFF_API_TOKEN"
            for name in TIMEOFF_PUBLIC_URL TIMEOFF_INTEGRATION_KEY TIMEOFF_GOOGLE_SERVICE_ACCOUNT \
                        TIMEOFF_MICROSOFT_CLIENT_ID TIMEOFF_MICROSOFT_CLIENT_SECRET SLACK_TIMEOFF_TOKEN; do
              if [ -n "${!name}" ]; then printf '%s=%s\n' "$name" "${!name}"; fi
            done
          } | put timeoff.env
          printf 'PEOPLE_API_TOKEN=%s\nAUDIT_API_TOKEN=%s\nTIMEOFF_API_TOKEN=%s\nAUTH_JWKS_URL=%s\nAUTH_TOKEN_AUDIENCE=%s\nKITHENA_ENTITLEMENTS=%s\n' \
            "$PEOPLE_API_TOKEN" "$AUDIT_API_TOKEN" "$TIMEOFF_API_TOKEN" \
            https://identity.kithena.com/.well-known/jwks.json \
            "$AUTH_TOKEN_AUDIENCE" "$KITHENA_ENTITLEMENTS" | put router.env
          printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$CLOUDFLARE_TUNNEL_TOKEN" | put secrets.env
          if [ -n "$IDENTITY_RELAY_HOST" ] && [ -n "$IDENTITY_RELAY_PASSWORD" ]; then
            printf 'DEBEZIUM_SOURCE_DATABASE_HOSTNAME=%s\nDEBEZIUM_SOURCE_DATABASE_DBNAME=neondb\nDEBEZIUM_SOURCE_DATABASE_PASSWORD=%s\n' \
              "$IDENTITY_RELAY_HOST" "$IDENTITY_RELAY_PASSWORD"
          fi | put relay.env
          echo "$GH_TOKEN" | ssh vm sudo docker login ghcr.io -u "$ACTOR" --password-stdin

      # People's database is the VM's Postgres, not Neon, so the same
      # migrations the `migrate` job applied to Neon for identity are applied
      # here too, before People deploys: the order stays migrations, then
      # People. `deploy.sh migrate` runs the pinned Atlas in a one-shot
      # container on the Compose network; the directory was linted there.
      - name: migrate the VM database
        run: ssh vm sudo bash kithena/deploy.sh production migrate

      # Each deploy prints the image the service was on before it as
      # `previous=`, recorded for the rollback job — also when the deploy then
      # fails its health check, because by then the service is on the new
      # image and the rollback has to put it back. Empty on a first deploy.
      #
      # People: pulled, started, healthy, serving `/v1/openapi.json` (mounted
      # only once People has a database, where Yoga's `/health` would pass
      # without one), and reaching that database as `svc_people`. `deploy.sh`
      # asks both from inside People.
      - name: deploy people
        id: people
        if: needs.plan.outputs.people == 'true'
        run: |
          status=0
          # shellcheck disable=SC2029 # the image is meant to expand here
          ssh vm sudo bash kithena/deploy.sh production people "$IMAGES-people:$DEPLOY_SHA" | tee deploy.out || status=$?
          grep '^previous=' deploy.out >> "$GITHUB_OUTPUT" || true
          exit "$status"

      # After People, which it asks, and after the migration, which made its
      # schema. Pulled, started, healthy and answering `/health` from inside
      # the project's network.
      - name: deploy slack
        id: slack
        if: needs.plan.outputs.slack == 'true'
        run: |
          status=0
          # shellcheck disable=SC2029 # the image is meant to expand here
          ssh vm sudo bash kithena/deploy.sh production slack "$IMAGES-slack:$DEPLOY_SHA" | tee deploy.out || status=$?
          grep '^previous=' deploy.out >> "$GITHUB_OUTPUT" || true
          exit "$status"

      # After the migration, which made its schema and gave `svc_audit` its
      # login, and before the router, which routes `auditActivity` to it.
      # Pulled, started, healthy, and reaching its database as `svc_audit`.
      - name: deploy audit
        id: audit
        if: needs.plan.outputs.audit == 'true'
        run: |
          status=0
          # shellcheck disable=SC2029 # the image is meant to expand here
          ssh vm sudo bash kithena/deploy.sh production audit "$IMAGES-audit:$DEPLOY_SHA" | tee deploy.out || status=$?
          grep '^previous=' deploy.out >> "$GITHUB_OUTPUT" || true
          exit "$status"

      # After the migration, which made its schema and gave `svc_timeoff` its
      # login, and before the router, which routes Time Off's fields to it.
      # Pulled, started, healthy, holding the router's token, and reaching its
      # database as `svc_timeoff`.
      - name: deploy timeoff
        id: timeoff
        if: needs.plan.outputs.timeoff == 'true'
        run: |
          status=0
          # shellcheck disable=SC2029 # the image is meant to expand here
          ssh vm sudo bash kithena/deploy.sh production timeoff "$IMAGES-timeoff:$DEPLOY_SHA" | tee deploy.out || status=$?
          grep '^previous=' deploy.out >> "$GITHUB_OUTPUT" || true
          exit "$status"

      - name: deploy the router
        id: router
        if: needs.plan.outputs.router == 'true'
        run: |
          status=0
          # shellcheck disable=SC2029 # the image is meant to expand here
          ssh vm sudo bash kithena/deploy.sh production router "$IMAGES-router:$DEPLOY_SHA" | tee deploy.out || status=$?
          grep '^previous=' deploy.out >> "$GITHUB_OUTPUT" || true
          exit "$status"

      # Ready, and closed to a stranger, through the tunnel as a browser meets
      # it. The safelist was proven on the image.
      - name: smoke test the router
        if: needs.plan.outputs.router == 'true'
        env:
          ROUTER_URL: ${{ vars.ROUTER_URL_PRODUCTION }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
            "$ROUTER_URL/health/ready" >/dev/null
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 30 \
            -X POST -H 'content-type: application/json' -d '{"query":"{__typename}"}' \
            "$ROUTER_URL/graphql")"
          echo "an unauthenticated request answered $code"
          if [ "$code" != "401" ]; then
            echo "::error::the router did not refuse a request without a token"
            exit 1
          fi

      # The registry login on the VM ends with the job, whatever happened.
      - name: log the VM out of the registry
        if: always() && steps.prepare.outcome != 'skipped'
        run: ssh vm 'sudo docker logout ghcr.io' || true

  # The People remote, built and signed here, and uploaded as files by the job
  # after this one.
  #
  # Signed in this job, with the private key from the production
  # environment's secrets, and never by Vercel: the shell pins the public
  # half and renders only a server build that verifies (PEO-115), which is
  # what makes a compromise of the remote's host survivable. A key Vercel
  # held would make that guarantee decorative. So the remote is deployed as
  # static files rather than letting Vercel build the project.
  #
  # Its own job so the build runs while the VM deploys; the upload has to wait
  # for the router, the build does not. `sign` prints the manifest (two
  # hashes) and nothing else, and exits non-zero naming the variable when the
  # key is missing.
  people-remote-build:
    name: people remote (build and sign)
    needs: plan
    if: vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION != '' && needs.plan.outputs.people-remote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build the people remote
        run: pnpm turbo run build --filter=@kithena/web-people...
      - name: sign the people remote
        env:
          PEOPLE_REMOTE_SSR_SIGNING_KEY: ${{ secrets.PEOPLE_REMOTE_SSR_SIGNING_KEY }}
        run: pnpm --filter @kithena/web-people sign
      - name: keep the signed build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: people-remote-dist
          path: apps/web/people/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The committed `vercel.json` travels with the files for its headers, less
  # the keys that would have Vercel build or skip them. `dist/ssr` is
  # verified first, as the shell will verify it, so a key from the wrong
  # pair or a `dist` written after signing — here, or anywhere between the
  # job that signed it and this one — never reaches the domain.
  people-remote:
    name: people remote
    needs: [plan, people-remote-build, vm]
    if: >
      !cancelled() && !failure() &&
      vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION != '' && needs.plan.outputs.people-remote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: the signed build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: people-remote-dist
          path: apps/web/people/dist
      - name: deploy the people remote
        id: deploy
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION }}
          PEOPLE_REMOTE_SSR_PUBLIC_KEY: ${{ vars.PEOPLE_REMOTE_SSR_PUBLIC_KEY_PRODUCTION }}
        run: |
          set -o pipefail
          node apps/web/people/scripts/verify-ssr.mjs
          jq 'del(.ignoreCommand, .installCommand, .buildCommand, .outputDirectory)' \
            apps/web/people/vercel.json > apps/web/people/dist/vercel.json
          url="$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy apps/web/people/dist --prod \
            --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # On its custom domain, as the shell reaches it, with the headers the
      # shell depends on and a signature that verifies under the key the shell
      # is about to be given.
      - name: smoke test the people remote
        env:
          REMOTE: ${{ vars.PEOPLE_REMOTE_URL_PRODUCTION }}
          PEOPLE_REMOTE_SSR_PUBLIC_KEY: ${{ vars.PEOPLE_REMOTE_SSR_PUBLIC_KEY_PRODUCTION }}
        run: |
          if [ -z "$REMOTE" ] || [ -z "$PEOPLE_REMOTE_SSR_PUBLIC_KEY" ]; then
            echo "::error::PEOPLE_REMOTE_URL_PRODUCTION and PEOPLE_REMOTE_SSR_PUBLIC_KEY_PRODUCTION must be set with the remote's project"
            exit 1
          fi
          node apps/web/people/scripts/smoke-deploy.mjs "$REMOTE" https://acme.app.kithena.com \
            apps/web/people/dist/ssr/manifest.json

  # The Time Off remote, exactly as the People remote above: built and signed
  # here with its own key, which Vercel never holds, then uploaded as files
  # and checked on its custom domain before the shell is given its key.
  timeoff-remote-build:
    name: time off remote (build and sign)
    needs: plan
    if: vars.VERCEL_PROJECT_ID_TIMEOFF_REMOTE_PRODUCTION != '' && needs.plan.outputs.timeoff-remote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build the time off remote
        run: pnpm turbo run build --filter=@kithena/web-timeoff...
      - name: sign the time off remote
        env:
          TIMEOFF_REMOTE_SSR_SIGNING_KEY: ${{ secrets.TIMEOFF_REMOTE_SSR_SIGNING_KEY }}
        run: pnpm --filter @kithena/web-timeoff sign
      - name: keep the signed build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timeoff-remote-dist
          path: apps/web/timeoff/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  timeoff-remote:
    name: time off remote
    needs: [plan, timeoff-remote-build, vm]
    if: >
      !cancelled() && !failure() &&
      vars.VERCEL_PROJECT_ID_TIMEOFF_REMOTE_PRODUCTION != '' && needs.plan.outputs.timeoff-remote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: the signed build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timeoff-remote-dist
          path: apps/web/timeoff/dist
      - name: deploy the time off remote
        id: deploy
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_TIMEOFF_REMOTE_PRODUCTION }}
          TIMEOFF_REMOTE_SSR_PUBLIC_KEY: ${{ vars.TIMEOFF_REMOTE_SSR_PUBLIC_KEY_PRODUCTION }}
        run: |
          set -o pipefail
          node apps/web/timeoff/scripts/verify-ssr.mjs
          jq 'del(.ignoreCommand, .installCommand, .buildCommand, .outputDirectory)' \
            apps/web/timeoff/vercel.json > apps/web/timeoff/dist/vercel.json
          url="$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy apps/web/timeoff/dist --prod \
            --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: smoke test the time off remote
        env:
          REMOTE: ${{ vars.TIMEOFF_REMOTE_URL_PRODUCTION }}
          TIMEOFF_REMOTE_SSR_PUBLIC_KEY: ${{ vars.TIMEOFF_REMOTE_SSR_PUBLIC_KEY_PRODUCTION }}
        run: |
          if [ -z "$REMOTE" ] || [ -z "$TIMEOFF_REMOTE_SSR_PUBLIC_KEY" ]; then
            echo "::error::TIMEOFF_REMOTE_URL_PRODUCTION and TIMEOFF_REMOTE_SSR_PUBLIC_KEY_PRODUCTION must be set with the remote's project"
            exit 1
          fi
          node apps/web/timeoff/scripts/smoke-deploy.mjs "$REMOTE" https://acme.app.kithena.com \
            apps/web/timeoff/dist/ssr/manifest.json

  # The tenant app, last: it loads the remotes, which render against the
  # router.
  #
  # `kithena-web-production` owns `app.kithena.com` and `*.app.kithena.com`.
  # `--prod` and no `alias set`: the two tenant domains are production
  # domains of this project, so promoting the deployment is what points them
  # at it.
  #
  # The shell's People settings are passed per deployment and read per
  # request, so pointing the shell at a new remote or router never needs a
  # rebuild. Each only when set: an unset one leaves whatever the project
  # has, rather than overwriting it with nothing.
  web:
    name: web
    needs: [plan, identity, messaging, vm, people-remote, timeoff-remote]
    if: >
      !cancelled() && !failure() &&
      needs.plan.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://app.kithena.com
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: deploy web
        id: deploy
        env:
          VERCEL_PROJECT_ID: prj_gFIRdhqiaC2ynPaBNhDkM1IqzPMx
          PEOPLE_REMOTE_URL: ${{ vars.PEOPLE_REMOTE_URL_PRODUCTION }}
          PEOPLE_REMOTE_SSR_PUBLIC_KEY: ${{ vars.PEOPLE_REMOTE_SSR_PUBLIC_KEY_PRODUCTION }}
          TIMEOFF_REMOTE_URL: ${{ vars.TIMEOFF_REMOTE_URL_PRODUCTION }}
          TIMEOFF_REMOTE_SSR_PUBLIC_KEY: ${{ vars.TIMEOFF_REMOTE_SSR_PUBLIC_KEY_PRODUCTION }}
          ROUTER_URL: ${{ vars.ROUTER_URL_PRODUCTION }}
          # Waking the VM from the People pages (`apps/web/src/lib/workspace.ts`):
          # all three, or the feature stays off.
          WORKSPACE_INSTANCE_ID: ${{ vars.WORKSPACE_INSTANCE_ID_PRODUCTION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN_PRODUCTION }}
          WAKE_REGION: ${{ vars.AWS_REGION }}
        run: |
          # `pipefail`, because this pipes into `tail`: without it the status
          # reported is `tail`'s, so a deploy that failed exits 0 here and
          # hands an empty URL to everything downstream.
          set -o pipefail
          args=(--prod --yes --archive=tgz --token "$VERCEL_TOKEN")
          [ -n "$PEOPLE_REMOTE_URL" ] && args+=(--env "PEOPLE_REMOTE_URL=$PEOPLE_REMOTE_URL")
          [ -n "$PEOPLE_REMOTE_SSR_PUBLIC_KEY" ] && args+=(--env "PEOPLE_REMOTE_SSR_PUBLIC_KEY=$PEOPLE_REMOTE_SSR_PUBLIC_KEY")
          [ -n "$TIMEOFF_REMOTE_URL" ] && args+=(--env "TIMEOFF_REMOTE_URL=$TIMEOFF_REMOTE_URL")
          [ -n "$TIMEOFF_REMOTE_SSR_PUBLIC_KEY" ] && args+=(--env "TIMEOFF_REMOTE_SSR_PUBLIC_KEY=$TIMEOFF_REMOTE_SSR_PUBLIC_KEY")
          [ -n "$ROUTER_URL" ] && args+=(--env "ROUTER_URL=$ROUTER_URL")
          if [ -n "$WORKSPACE_INSTANCE_ID" ] && [ -n "$AWS_ROLE_ARN" ] && [ -n "$WAKE_REGION" ]; then
            args+=(--env "WORKSPACE_INSTANCE_ID=$WORKSPACE_INSTANCE_ID" \
              --env "AWS_ROLE_ARN=$AWS_ROLE_ARN" --env "AWS_REGION=$WAKE_REGION")
          fi
          url="$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy "${args[@]}" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Tenant app production: $url"
      # A deploy that returns 404 is a failed deploy, and the CLI exiting 0
      # does not prove the CDN is serving anything.
      #
      # By its deployment URL and *not* by `app.kithena.com`. The bare host has
      # no tenant in it, so `apps/web/src/proxy.ts` has nothing to resolve and
      # answers 404 by design. Naming it here would fail every deploy and roll
      # production back on a correctly working app. A per-tenant host would be
      # the real check, and it needs a tenant that is guaranteed to exist first.
      - name: smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$URL" >/dev/null

  # The auth origin. Unlike the Next apps, this one carries its own
  # `vercel.json` with `buildCommand: pnpm run deploy`, so Vercel builds it
  # from `apps/auth/shell` as its Root Directory. Deploying from the
  # repository root is what gives that command the workspace it needs —
  # `build:packages` filters on `@kithena/auth-shell^...`.
  #
  # `auth.app.kithena.com` mirrors `auth.staging.app.kithena.com`. It sits
  # under the `*.app.kithena.com` wildcard that `kithena-web-production`
  # holds, which is fine: an explicitly assigned domain wins over a
  # wildcard, so this reaches the auth origin and not the tenant app.
  #
  # A client of identity, so after it; it reaches nothing on the VM.
  auth:
    name: auth
    needs: [plan, identity, messaging]
    if: >
      !cancelled() && !failure() &&
      needs.plan.outputs.auth == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: deploy auth
        id: deploy
        env:
          VERCEL_PROJECT_ID: prj_ms3cotgBZ4hrzEoSDKoUAGVjIhiZ
        run: |
          set -o pipefail
          url="$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "Auth origin production: $url"
      - name: smoke test
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 https://auth.app.kithena.com >/dev/null

  # The back-office, on its own registrable domain rather than a path.
  # `admin.kithena.com` is not under `app.kithena.com`, so a browser will
  # not offer an employee's passkey here and will not offer an operator's
  # there. The isolation is free and it is why this is a separate host.
  #
  # A client of identity's internal API, so after it; nothing on the VM.
  admin:
    name: back-office
    needs: [plan, identity, messaging]
    if: >
      !cancelled() && !failure() &&
      needs.plan.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: deploy back-office
        id: deploy
        env:
          VERCEL_PROJECT_ID: prj_xFPtNIieNz3jP5EvFNPaFOJwgRe4
        run: |
          set -o pipefail
          url="$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "Back-office production: $url"
      # `/sign-in` and not `/`: the root redirects when nobody is signed in,
      # which is correct and is a 307. Following it would be following a
      # redirect into a page that must never render for a stranger.
      - name: smoke test
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 https://admin.kithena.com/sign-in >/dev/null

  # Reach's two public sites. Static files built here, depending on nothing
  # that is deployed, so they go as soon as `plan` has spoken. Both custom
  # domains are checked too: they are what people actually open, and a domain
  # can be detached or its certificate can lapse without the deployment
  # noticing.
  docs:
    name: docs
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build docs
        run: pnpm turbo run build --filter=@reach/docs...
      - name: deploy docs
        id: deploy
        env:
          VERCEL_PROJECT_ID: prj_hjiSAIp2hweckjQGdJVT5HAQ3zg9
        run: |
          set -o pipefail
          url="$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy apps/docs/dist --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Docs production: $url"
      - name: smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for url in "$URL" https://design.kithena.com; do
            echo "checking $url"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$url" >/dev/null
          done

  storybook:
    name: storybook
    needs: plan
    if: needs.plan.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build storybook
        run: pnpm storybook:build
      - name: deploy storybook
        id: deploy
        env:
          VERCEL_PROJECT_ID: prj_u605gEWnCNjhTkdr0J7lCBCBGgcO
        run: |
          set -o pipefail
          url="$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy apps/storybook/storybook-static --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Storybook production: $url"
      - name: smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for url in "$URL" https://storybook.kithena.com; do
            echo "checking $url"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$url" >/dev/null
          done

  # A deployment that fails its smoke test is rolled back rather than left
  # serving — and so is everything else this run deployed. Rolling back one
  # project out of five leaves production in a state no commit ever produced:
  # four surfaces on the build that just failed, one on the build before it.
  # That is worse than either end.
  #
  # Runs when any job above failed, after all of them have finished, from what
  # each reported: a Vercel target is rolled back when its deploy step
  # succeeded, a VM service when it recorded the image it replaced. Vercel
  # keeps the previous production deployment addressable, so promoting it
  # back is a second alias rather than a rebuild — seconds rather than the
  # minutes a revert-and-redeploy would take. The VM keeps no "previous
  # deployment" to promote, so each service is put back on the image its
  # deploy recorded, which is still on the VM's disk.
  #
  # The database is deliberately not rolled back with it. Migrations are
  # expand-contract, so the previous build reads the new schema perfectly
  # well; undoing the migration is what would break it.
  #
  # Clients first, then the services, which is the deploy order reversed.
  # Schema, then service, then client is the only ordering that is never
  # wrong going forwards, so undoing it back-to-front is the only ordering
  # that is never wrong coming back.
  rollback:
    name: roll back
    needs:
      [
        plan,
        images,
        migrate,
        identity,
        messaging,
        vm,
        people-remote-build,
        people-remote,
        timeoff-remote-build,
        timeoff-remote,
        web,
        auth,
        admin,
        docs,
        storybook,
      ]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      WEB_DEPLOYED: ${{ needs.web.outputs.deployed }}
      AUTH_DEPLOYED: ${{ needs.auth.outputs.deployed }}
      ADMIN_DEPLOYED: ${{ needs.admin.outputs.deployed }}
      DOCS_DEPLOYED: ${{ needs.docs.outputs.deployed }}
      STORYBOOK_DEPLOYED: ${{ needs.storybook.outputs.deployed }}
      IDENTITY_DEPLOYED: ${{ needs.identity.outputs.deployed }}
      MESSAGING_DEPLOYED: ${{ needs.messaging.outputs.deployed }}
      MESSAGING_PROJECT: ${{ vars.VERCEL_PROJECT_ID_MESSAGING_PRODUCTION }}
      REMOTE_DEPLOYED: ${{ needs.people-remote.outputs.deployed }}
      REMOTE_PROJECT: ${{ vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION }}
      TIMEOFF_REMOTE_DEPLOYED: ${{ needs.timeoff-remote.outputs.deployed }}
      TIMEOFF_REMOTE_PROJECT: ${{ vars.VERCEL_PROJECT_ID_TIMEOFF_REMOTE_PRODUCTION }}
      ROUTER_OUTCOME: ${{ needs.vm.outputs.router-outcome }}
      ROUTER_PREVIOUS: ${{ needs.vm.outputs.router-previous }}
      PEOPLE_OUTCOME: ${{ needs.vm.outputs.people-outcome }}
      PEOPLE_PREVIOUS: ${{ needs.vm.outputs.people-previous }}
      SLACK_OUTCOME: ${{ needs.vm.outputs.slack-outcome }}
      SLACK_PREVIOUS: ${{ needs.vm.outputs.slack-previous }}
      AUDIT_OUTCOME: ${{ needs.vm.outputs.audit-outcome }}
      AUDIT_PREVIOUS: ${{ needs.vm.outputs.audit-previous }}
      TIMEOFF_OUTCOME: ${{ needs.vm.outputs.timeoff-outcome }}
      TIMEOFF_PREVIOUS: ${{ needs.vm.outputs.timeoff-previous }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: ssh to the VM
        if: env.ROUTER_PREVIOUS != '' || env.PEOPLE_PREVIOUS != '' || env.SLACK_PREVIOUS != '' || env.AUDIT_PREVIOUS != '' || env.TIMEOFF_PREVIOUS != ''
        uses: ./.github/actions/vm-ssh
        with:
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          instance: ${{ vars.WORKSPACE_INSTANCE_ID_PRODUCTION }}
          ssh-key: ${{ secrets.VM_DEPLOY_SSH_KEY }}
      - name: roll back everything this run deployed
        run: |
          rolled=()
          missing=()

          roll_back() {
            local name="$1" deployed="$2" project="$3"
            if [ "$deployed" != "true" ]; then
              echo "$name was not deployed by this run; nothing to roll back"
              return 0
            fi
            # `sed -n '2p'`: the first URL is the deployment this run just made,
            # the second is the one it replaced.
            local previous
            previous="$(VERCEL_PROJECT_ID="$project" npx --yes vercel@${VERCEL_CLI_VERSION} list \
              --prod --token "$VERCEL_TOKEN" --yes 2>/dev/null \
              | grep -oE 'https://[a-z0-9.-]+\.vercel\.app' | sed -n '2p')"
            if [ -z "$previous" ]; then
              echo "::warning::$name has no previous production deployment to roll back to"
              missing+=("$name")
              return 0
            fi
            echo "::warning::rolling $name back to $previous"
            VERCEL_PROJECT_ID="$project" npx --yes vercel@${VERCEL_CLI_VERSION} promote "$previous" \
              --token "$VERCEL_TOKEN" --yes
            rolled+=("$name -> $previous")
          }

          # Attempted on `failure` as well as `success`: a deploy that failed
          # its health check has already switched the service to the new image.
          roll_back_vm() {
            local name="$1" outcome="$2" previous="$3"
            if [ "$outcome" != "success" ] && [ "$outcome" != "failure" ]; then
              echo "$name was not deployed by this run; nothing to roll back"
              return 0
            fi
            # No image recorded: either the step failed before it deployed
            # anything, or this was the service's first deploy.
            if [ -z "$previous" ]; then
              if [ "$outcome" = "success" ]; then
                echo "::warning::$name has no previous image to roll back to"
                missing+=("$name")
              else
                echo "$name failed before it deployed; nothing to roll back"
              fi
              return 0
            fi
            echo "::warning::rolling $name back to $previous"
            # No registry login needed: `deploy.sh` pulls only an image the VM
            # does not have, and it keeps the one each service was on before.
            # The agent can be online a moment before sshd accepts.
            for _ in $(seq 1 12); do ssh -o ConnectTimeout=10 vm true && break; sleep 5; done
            # shellcheck disable=SC2029 # the image is meant to expand here
            ssh vm sudo bash kithena/deploy.sh production "$name" "$previous"
            rolled+=("$name -> $previous")
          }

          roll_back storybook     "$STORYBOOK_DEPLOYED" prj_u605gEWnCNjhTkdr0J7lCBCBGgcO
          roll_back docs          "$DOCS_DEPLOYED"      prj_hjiSAIp2hweckjQGdJVT5HAQ3zg9
          roll_back back-office   "$ADMIN_DEPLOYED"     prj_xFPtNIieNz3jP5EvFNPaFOJwgRe4
          roll_back auth          "$AUTH_DEPLOYED"      prj_ms3cotgBZ4hrzEoSDKoUAGVjIhiZ
          roll_back tenant-app    "$WEB_DEPLOYED"       prj_gFIRdhqiaC2ynPaBNhDkM1IqzPMx
          roll_back people-remote "$REMOTE_DEPLOYED"    "$REMOTE_PROJECT"
          roll_back timeoff-remote "$TIMEOFF_REMOTE_DEPLOYED" "$TIMEOFF_REMOTE_PROJECT"
          roll_back_vm router     "$ROUTER_OUTCOME"     "$ROUTER_PREVIOUS"
          roll_back_vm timeoff    "$TIMEOFF_OUTCOME"    "$TIMEOFF_PREVIOUS"
          roll_back_vm people     "$PEOPLE_OUTCOME"     "$PEOPLE_PREVIOUS"
          roll_back_vm slack      "$SLACK_OUTCOME"      "$SLACK_PREVIOUS"
          roll_back_vm audit      "$AUDIT_OUTCOME"      "$AUDIT_PREVIOUS"
          roll_back messaging     "$MESSAGING_DEPLOYED" "$MESSAGING_PROJECT"
          roll_back identity      "$IDENTITY_DEPLOYED"  prj_ShPvJf0eeh9wwe1HwB2mFnMrTjRL

          if [ ${#rolled[@]} -eq 0 ] && [ ${#missing[@]} -eq 0 ]; then
            echo "::error::a job failed before anything was deployed; nothing was rolled back"
            exit 1
          fi
          for line in "${rolled[@]}"; do echo "rolled back: $line"; done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::these had no previous deployment and are still on the failed build: ${missing[*]}"
          fi
          echo "::error::production was rolled back. Fix forward; do not re-run this workflow."
          exit 1

  # Moves `deployed/production/<target>` to this commit for every target that
  # shipped, which is what the next run diffs against — and only when no job
  # failed, so a failure anywhere leaves every tag where it was and the next
  # run retries all of it. Its own job, so the jobs holding this environment's
  # secrets never also hold a token that can write to the repository. Through
  # the API: nothing to check out. A ref moved with `GITHUB_TOKEN` starts no
  # workflow, and none listens for tags anyway.
  mark:
    name: record the deployed commit
    needs:
      [
        plan,
        images,
        migrate,
        identity,
        messaging,
        vm,
        people-remote-build,
        people-remote,
        timeoff-remote-build,
        timeoff-remote,
        web,
        auth,
        admin,
        docs,
        storybook,
      ]
    if: >
      !cancelled() && !failure() &&
      needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: move the tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUTCOMES: >-
            migrations=${{ needs.migrate.outputs.shipped }}
            identity=${{ needs.identity.outputs.deployed }}
            messaging=${{ needs.messaging.outputs.deployed }}
            people=${{ needs.vm.outputs.people-outcome == 'success' }}
            router=${{ needs.vm.outputs.router-outcome == 'success' }}
            slack=${{ needs.vm.outputs.slack-outcome == 'success' }}
            audit=${{ needs.vm.outputs.audit-outcome == 'success' }}
            timeoff=${{ needs.vm.outputs.timeoff-outcome == 'success' }}
            people-remote=${{ needs.people-remote.outputs.deployed }}
            timeoff-remote=${{ needs.timeoff-remote.outputs.deployed }}
            shell=${{ needs.web.outputs.deployed }}
            auth=${{ needs.auth.outputs.deployed }}
            admin=${{ needs.admin.outputs.deployed }}
            docs=${{ needs.docs.outputs.deployed }}
            storybook=${{ needs.storybook.outputs.deployed }}
        run: |
          shipped=
          for pair in $OUTCOMES; do
            [ "${pair#*=}" = true ] && shipped="$shipped ${pair%%=*}"
          done
          echo "shipped:${shipped:- nothing}"
          for target in $shipped; do
            ref="tags/deployed/production/$target"
            gh api --method PATCH "repos/$REPO/git/refs/$ref" -f sha="$DEPLOY_SHA" -F force=true --silent 2>/dev/null ||
              gh api --method POST "repos/$REPO/git/refs" -f ref="refs/$ref" -f sha="$DEPLOY_SHA" --silent
            echo "deployed/production/$target -> $DEPLOY_SHA"
          done

      - name: comment the urls on the pr
        if: needs.docs.outputs.url != '' || needs.storybook.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_URL: ${{ needs.docs.outputs.url }}
          STORYBOOK_URL: ${{ needs.storybook.outputs.url }}
          REPO: ${{ github.repository }}
          SHA: ${{ env.DEPLOY_SHA }}
        run: |
          pr_number=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].number // empty')
          body="<!-- vercel-production -->
          ## 🚀 Vercel Production

          Deployed from **main** (\`${SHA:0:7}\`).
          "
          [ -n "$DOCS_URL" ] && body="${body}
          - **Docs:** ${DOCS_URL} — also at https://design.kithena.com"
          [ -n "$STORYBOOK_URL" ] && body="${body}
          - **Storybook:** ${STORYBOOK_URL} — also at https://storybook.kithena.com"
          if [ -n "$pr_number" ]; then
            existing=$(gh api "repos/${REPO}/issues/${pr_number}/comments" --paginate --jq '.[] | select(.body | contains("<!-- vercel-production -->")) | .id' | head -n 1)
            if [ -n "$existing" ]; then
              gh api "repos/${REPO}/issues/comments/${existing}" --method PATCH -f body="$body"
            else
              gh pr comment "$pr_number" --repo "$REPO" --body "$body"
            fi
          else
            echo "::notice::No pull request found for commit ${SHA}; deployment succeeded, nothing to comment on."
          fi
