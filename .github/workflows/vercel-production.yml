name: vercel-production

# Production deploys, and only after `ci` has gone green on the same commit.
#
# A separate workflow cannot use `needs:`, so the dependency is expressed with
# `workflow_run` plus an explicit conclusion check. On `push` this would deploy
# whatever landed on main regardless of whether the axe pass, the contrast gate
# or the tests failed — publishing the build the gates just rejected, which is
# the one outcome they exist to prevent.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  # The team the two projects live under. Not a secret — it names an account,
  # it does not authorise anything. The token that does is a repository secret.
  VERCEL_ORG_ID: team_uActP8CY3wkqOpyG5WDKXkTj
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  # Pinned. This runs with a production token; "@latest" hands whatever
  # was published minutes ago the ability to deploy. Dependabot does not
  # watch an npx invocation, so this is bumped deliberately.
  VERCEL_CLI_VERSION: 59.3.0

concurrency:
  group: vercel-production
  # Never cancelled halfway: cancelling a deploy leaves whichever half-uploaded
  # build the CDN happened to have.
  cancel-in-progress: false

jobs:
  deploy:
    name: production deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 40, not 25: People's image is built on Fly's remote builder and the
    # router's is built and started here, which together take minutes the
    # Vercel-only job never needed.
    timeout-minutes: 40
    # A GitHub Environment, for three reasons: the secrets here are production's
    # and no other job can read them, the approval rule on it means a deploy is
    # something a person chose rather than something a merge caused, and the
    # deployment history is the change-management evidence a customer's security
    # questionnaire asks for.
    environment:
      name: production
      url: https://app.kithena.com

    # The throwaway database `atlas migrate lint` replays the directory into,
    # run here rather than left to `docker://` so that the service roles can be
    # created in it first. See the `atlas dev roles` step for why that matters.
    services:
      atlas-dev:
        image: postgres:17
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dev -d dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # The commit `ci` actually tested, not whatever main points at now. A
      # second push while this queued would otherwise deploy an untested tip.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile

      # A missing secret should say so in one line, rather than surfacing as a
      # CLI usage error forty lines into the output of the first deploy step.
      - name: check the token
        run: |
          missing=
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "${{ secrets.DATABASE_URL }}" ] && missing="$missing DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::missing production secret(s):$missing"
            exit 1
          fi

      # Built here rather than by Vercel. Both apps are workspace consumers of
      # `@reach/ui`, which ships TypeScript source, so a build needs the whole
      # monorepo and its lockfile.
      # Migrations before the deploy, never after. Expand-contract means the new
      # schema is readable by the old code, so migrating first is safe; migrating
      # second leaves a window where new code reads columns that do not exist.
      #
      # There is no rollback step and there will not be one. `CLAUDE.md` is
      # explicit that there are no down migrations against a multi-tenant
      # production database — a failed migration is fixed forward, by a
      # migration, reviewed like any other change.
      # Roles are cluster-level in Postgres, so a container Atlas has just
      # started has none of them. `migrate lint` replays the whole directory
      # into the dev database to work out what a migration does, reaches
      # `GRANT ... TO svc_identity`, and dies on a role nothing in the
      # directory creates:
      #
      #     Error: executing statement: pq: role "svc_identity" does not exist
      #     -- 1 version with errors
      #
      # Production has these roles and is correctly migrated; only the scratch
      # database lacked them. The failure therefore said nothing about
      # production, and because this step runs under `bash -e`, `lint` exiting
      # non-zero meant `apply` and every deploy step below it never ran. The
      # identity and web deploys were silently skipped for a day.
      #
      # Created NOLOGIN and without a password: a GRANT only needs the role to
      # exist, nothing connects to this container as one of them, and a
      # password here would be a credential in the workflow for no gain.
      #
      # Kept in step with `tools/scripts/init-db.sql` — same roles, same
      # reason. A migration granting to a role this step does not know about
      # fails here, which is the right place to find out.
      #
      # A service container rather than Atlas's own `docker://` dev URL,
      # because the HCL `docker` block that would let Atlas seed the roles
      # itself needs `atlas login` — the paid tier this version is pinned to
      # avoid.
      - name: atlas dev roles
        env:
          PGPASSWORD: dev
        run: |
          psql -h localhost -p 5433 -U dev -d dev -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE svc_people;
          CREATE ROLE svc_timeoff;
          CREATE ROLE svc_identity NOBYPASSRLS;
          CREATE ROLE svc_messaging NOBYPASSRLS;
          SQL

      - name: migrate production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ATLAS_DEV_URL: postgres://dev:dev@localhost:5433/dev?sslmode=disable&search_path=public
        run: |
          # Pinned, not `latest`. Atlas moved `migrate lint` behind a paid
          # tier in v0.38, and because this downloaded `latest` the production
          # deploy broke on a release nobody here made. A version that can
          # change under us is a deploy that can fail for reasons not in this
          # repository. v0.37.0 is the last release where `lint` runs without
          # an account; bump it deliberately.
          ATLAS_VERSION=v0.37.0
          curl -sSf "https://release.ariga.io/atlas/atlas-linux-amd64-${ATLAS_VERSION}" -o /usr/local/bin/atlas
          chmod +x /usr/local/bin/atlas
          # `lint` first: atlas.hcl marks destructive changes an error in this
          # environment, so a DROP reaches CI's output rather than the database.
          atlas migrate lint --env production --latest 1
          atlas migrate apply --env production

      # The identity service. Deployed after the migration and before the UI,
      # for the same reason the migration comes first: expand-contract means
      # new code reads the old schema and old code reads the new one, so the
      # only ordering that is never wrong is schema, then service, then client.


      # The identity service.
      #
      # After the migration and before the UI. Expand-contract means new code
      # reads the old schema and old code reads the new one, so the only
      # ordering that is never wrong is schema, then service, then client.
      #
      # A Vercel function rather than a container since 2026-08-22: the reason
      # it needed a process was a Valkey connection held across requests, and
      # challenges live in Postgres now. docs/environments.md has the rest.
      #
      # `kithena-identity-production`, not `kithena-identity`. This deployed to
      # the staging project until now, which is the project `identity.staging`
      # points at — so production identity code went to the staging project's
      # production environment and never reached `identity.kithena.com`, which
      # belongs to `kithena-identity-production`. The smoke test below passed
      # throughout, because the domain kept serving the older deployment that
      # *was* in the right project.
      #
      # `docs/environments.md`: "separate databases, separate credentials and
      # separate Vercel projects exist to make the wrong thing hard rather than
      # merely forbidden."
      - name: deploy identity
        id: identity
        env:
          VERCEL_PROJECT_ID: prj_ShPvJf0eeh9wwe1HwB2mFnMrTjRL
        run: |
          npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prod \
            --yes --archive=tgz --token "$VERCEL_TOKEN"

      # The custom domain, not the deployment URL. `ssoProtection` is set to
      # `all_except_custom_domains`, so a `.vercel.app` host answers 302 to a
      # login page and would pass a naive check that follows redirects.
      - name: smoke test identity
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --max-time 30 \
            https://identity.kithena.com/.well-known/jwks.json >/dev/null

      # The messaging service.
      #
      # After the migration, because it owns `messaging.delivery`, and after
      # identity, because identity is what calls it. Deploying the caller first
      # would leave a window where an invitation is issued and the thing that
      # mails it is still the previous build.
      #
      # Its project id comes from a repository variable rather than being
      # written here like identity's. The project is created once by hand, and
      # this workflow has to be mergeable before that happens — the alternative
      # is a literal id that does not exist yet, which fails the deploy for a
      # reason not in this repository.
      - name: deploy messaging
        id: messaging
        if: vars.VERCEL_PROJECT_ID_MESSAGING_PRODUCTION != ''
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_MESSAGING_PRODUCTION }}
          # The only origin shape a notice may link to (`https://{slug}.…`).
          # A repository variable, like the project id. Unset, nothing is
          # passed and the service fails closed: it refuses every notice rather
          # than trusting a default that points at localhost.
          TENANT_APP_BASE: ${{ vars.TENANT_APP_BASE_PRODUCTION }}
        run: |
          args=(--prod --yes --archive=tgz --token "$VERCEL_TOKEN")
          if [ -n "$TENANT_APP_BASE" ]; then
            args+=(--env "TENANT_APP_BASE=$TENANT_APP_BASE")
          else
            echo "::warning::TENANT_APP_BASE_PRODUCTION is unset: messaging will send no reminder or webhook alert"
          fi
          npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy "${args[@]}"

      # `/healthz` is unauthenticated on purpose and says nothing worth having:
      # a status, and which transport is composed. Putting the shared secret in
      # a smoke test is how the shared secret reaches a workflow log.
      #
      # It reports the transport for a reason. `log` in production means
      # `RESEND_API_KEY` is missing and every invitation is being written to
      # stdout instead of sent — which looks exactly like a working deployment
      # until somebody asks why no new hire has ever been able to log in. The
      # service refuses to boot in that state, so this asserting `resend` is the
      # belt to that braces.
      - name: smoke test messaging
        if: vars.VERCEL_PROJECT_ID_MESSAGING_PRODUCTION != ''
        run: |
          set -o pipefail
          body="$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --max-time 30 \
            https://messaging.kithena.com/healthz)"
          echo "$body"
          if ! grep -q '"transport":"resend"' <<<"$body"; then
            echo "::error::messaging is not composed against a real provider"
            exit 1
          fi

      - name: warn about a missing messaging project
        if: vars.VERCEL_PROJECT_ID_MESSAGING_PRODUCTION == ''
        run: |
          echo "::warning::VERCEL_PROJECT_ID_MESSAGING_PRODUCTION is unset, so \
          the messaging service was not deployed. Invitations will not be \
          emailed; enrolment links are still returned to the back-office."

      # People, the router, the People remote — then the shell.
      #
      # Schema, then service, then client, one layer further out: People serves
      # the subgraph, the router composes it, the remote renders against what
      # the router serves, and the shell (`deploy web` below) loads the remote.
      #
      # People and the router run on Fly.io, not Vercel. People holds Kafka
      # consumer groups, runs hourly jobs and drains on SIGTERM (PEO-118) — a
      # function-per-request runtime has no process to hold any of that. The
      # router is a Go binary with no serverless build at all.
      # `docs/environments.md`, "People, the router and the remote", has the
      # rest and the list of settings.
      #
      # Each is skipped with a warning while its app or project variable is
      # unset, the way messaging is, so this merges before the apps exist.
      - name: flyctl
        if: vars.FLY_APP_PEOPLE_PRODUCTION != ''
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          # Pinned, like the Vercel CLI: this runs with a production token.
          version: 0.4.87

      # The image each app is on *before* this deploy, recorded first: Fly has
      # no "promote the previous deployment", so rolling back is redeploying
      # this image. Empty on an app with no machines yet.
      #
      # `PEOPLE_API_TOKEN` is staged onto both apps from one GitHub secret, so
      # the token the router sends and the token People expects cannot drift
      # apart. `printf` into `secrets import` rather than `secrets set NAME=…`,
      # which would put the value in a process's argv. Every other People
      # setting is a Fly secret set once by hand.
      - name: deploy people
        id: people
        if: vars.FLY_APP_PEOPLE_PRODUCTION != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PEOPLE_API_TOKEN: ${{ secrets.PEOPLE_API_TOKEN }}
          APP: ${{ vars.FLY_APP_PEOPLE_PRODUCTION }}
        run: |
          set -o pipefail
          missing=
          [ -z "$FLY_API_TOKEN" ] && missing="$missing FLY_API_TOKEN"
          [ -z "$PEOPLE_API_TOKEN" ] && missing="$missing PEOPLE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::missing production secret(s):$missing"
            exit 1
          fi
          previous="$(flyctl machines list --app "$APP" --json | jq -r 'first(.[].config.image) // empty')"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          printf 'PEOPLE_API_TOKEN=%s\n' "$PEOPLE_API_TOKEN" \
            | flyctl secrets import --stage --app "$APP"
          flyctl deploy . --app "$APP" \
            --config services/people/fly.toml \
            --dockerfile services/people/Dockerfile \
            --remote-only --yes

      # `/v1/openapi.json` rather than `/health`. Yoga's `/health` answers with
      # no database at all, and People without `PEOPLE_DATABASE_URL` still
      # boots — serving the schema and nothing else. The REST routes are only
      # mounted when the database is configured, so this is the check that a
      # missing secret cannot pass.
      - name: smoke test people
        if: vars.FLY_APP_PEOPLE_PRODUCTION != ''
        env:
          APP: ${{ vars.FLY_APP_PEOPLE_PRODUCTION }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --max-time 30 \
            "https://${APP}.fly.dev/v1/openapi.json" >/dev/null

      # The supergraph is composed from `services/people/schemas/people.graphql`,
      # the SDL People's build serves, routed to People over Fly's private
      # network. It is baked into the image with the safelist, and the image is
      # proven before it is pushed: `scripts/smoke.ts` starts it, and a
      # persisted operation must pass while an unknown hash is refused. That
      # cannot be asked of the live router — it refuses anything without a
      # token identity minted for a signed-in session, which a workflow must
      # never hold — so the image is where it is asked, and the image is what
      # ships.
      - name: build and test the router image
        id: router-image
        if: vars.FLY_APP_ROUTER_PRODUCTION != '' && vars.FLY_APP_PEOPLE_PRODUCTION != ''
        working-directory: apps/gateway
        env:
          APP: ${{ vars.FLY_APP_ROUTER_PRODUCTION }}
          PEOPLE_APP: ${{ vars.FLY_APP_PEOPLE_PRODUCTION }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cat > graph.deploy.yaml <<EOF
          version: 1
          subgraphs:
            - name: people
              routing_url: http://${PEOPLE_APP}.internal:4001/graphql
              schema:
                file: ../../services/people/schemas/people.graphql
          EOF
          pnpm exec wgc router compose -i graph.deploy.yaml -o supergraph.json
          image="registry.fly.io/${APP}:${SHA}"
          docker build --tag "$image" .
          pnpm exec tsx scripts/smoke.ts "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # The router's settings are staged as secrets, not passed as `--env`, so
      # a rollback that redeploys the previous image keeps them. The audience
      # and the entitlements must equal identity's own `AUTH_TOKEN_AUDIENCE`
      # and `KITHENA_ENTITLEMENTS`: a different audience refuses every token.
      - name: deploy the router
        id: router
        if: vars.FLY_APP_ROUTER_PRODUCTION != '' && vars.FLY_APP_PEOPLE_PRODUCTION != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PEOPLE_API_TOKEN: ${{ secrets.PEOPLE_API_TOKEN }}
          APP: ${{ vars.FLY_APP_ROUTER_PRODUCTION }}
          IMAGE: ${{ steps.router-image.outputs.image }}
          AUTH_TOKEN_AUDIENCE: ${{ vars.AUTH_TOKEN_AUDIENCE_PRODUCTION }}
          KITHENA_ENTITLEMENTS: ${{ vars.KITHENA_ENTITLEMENTS_PRODUCTION }}
        run: |
          set -o pipefail
          missing=
          [ -z "$AUTH_TOKEN_AUDIENCE" ] && missing="$missing AUTH_TOKEN_AUDIENCE_PRODUCTION"
          [ -z "$KITHENA_ENTITLEMENTS" ] && missing="$missing KITHENA_ENTITLEMENTS_PRODUCTION"
          if [ -n "$missing" ]; then
            echo "::error::missing production variable(s):$missing"
            exit 1
          fi
          previous="$(flyctl machines list --app "$APP" --json | jq -r 'first(.[].config.image) // empty')"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          flyctl auth docker
          docker push "$IMAGE"
          printf 'PEOPLE_API_TOKEN=%s\nAUTH_JWKS_URL=%s\nAUTH_TOKEN_AUDIENCE=%s\nKITHENA_ENTITLEMENTS=%s\n' \
            "$PEOPLE_API_TOKEN" \
            https://identity.kithena.com/.well-known/jwks.json \
            "$AUTH_TOKEN_AUDIENCE" "$KITHENA_ENTITLEMENTS" \
            | flyctl secrets import --stage --app "$APP"
          flyctl deploy --app "$APP" --config apps/gateway/fly.toml \
            --image "$IMAGE" --yes

      # Ready, and closed to a stranger. The safelist was proven on the image.
      - name: smoke test the router
        if: vars.FLY_APP_ROUTER_PRODUCTION != '' && vars.FLY_APP_PEOPLE_PRODUCTION != ''
        env:
          APP: ${{ vars.FLY_APP_ROUTER_PRODUCTION }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --max-time 30 \
            "https://${APP}.fly.dev/health/ready" >/dev/null
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 30 \
            -X POST -H 'content-type: application/json' -d '{"query":"{__typename}"}' \
            "https://${APP}.fly.dev/graphql")"
          echo "an unauthenticated request answered $code"
          if [ "$code" != "401" ]; then
            echo "::error::the router did not refuse a request without a token"
            exit 1
          fi

      # The People remote, built and signed here and uploaded as files.
      #
      # Signed in this job, with the private key from the production
      # environment's secrets, and never by Vercel: the shell pins the public
      # half and renders only a server build that verifies (PEO-115), which is
      # what makes a compromise of the remote's host survivable. A key Vercel
      # held would make that guarantee decorative. So this deploys `dist` as
      # static files rather than letting Vercel build the project.
      - name: build the people remote
        if: vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION != ''
        run: pnpm turbo run build --filter=@kithena/web-people...

      # `sign` prints the manifest (two hashes) and nothing else, and exits
      # non-zero naming the variable when the key is missing.
      - name: sign the people remote
        if: vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION != ''
        env:
          PEOPLE_REMOTE_SSR_SIGNING_KEY: ${{ secrets.PEOPLE_REMOTE_SSR_SIGNING_KEY }}
        run: pnpm --filter @kithena/web-people sign

      # The committed `vercel.json` travels with the files for its headers, less
      # the keys that would have Vercel build or skip them.
      - name: deploy the people remote
        id: remote
        if: vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION != ''
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION }}
        run: |
          set -o pipefail
          jq 'del(.ignoreCommand, .installCommand, .buildCommand, .outputDirectory)' \
            apps/web/people/vercel.json > apps/web/people/dist/vercel.json
          url="$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy apps/web/people/dist --prod \
            --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # On its custom domain, as the shell reaches it, with the headers the
      # shell depends on and a signature that verifies under the key the shell
      # is about to be given.
      - name: smoke test the people remote
        if: vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION != ''
        env:
          REMOTE: ${{ vars.PEOPLE_REMOTE_URL_PRODUCTION }}
          PEOPLE_REMOTE_SSR_PUBLIC_KEY: ${{ vars.PEOPLE_REMOTE_SSR_PUBLIC_KEY_PRODUCTION }}
        run: |
          if [ -z "$REMOTE" ] || [ -z "$PEOPLE_REMOTE_SSR_PUBLIC_KEY" ]; then
            echo "::error::PEOPLE_REMOTE_URL_PRODUCTION and PEOPLE_REMOTE_SSR_PUBLIC_KEY_PRODUCTION must be set with the remote's project"
            exit 1
          fi
          node apps/web/people/scripts/smoke-deploy.mjs "$REMOTE" https://acme.app.kithena.com

      - name: warn about what was not deployed
        if: vars.FLY_APP_PEOPLE_PRODUCTION == '' || vars.FLY_APP_ROUTER_PRODUCTION == '' || vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION == ''
        env:
          PEOPLE: ${{ vars.FLY_APP_PEOPLE_PRODUCTION }}
          ROUTER: ${{ vars.FLY_APP_ROUTER_PRODUCTION }}
          REMOTE: ${{ vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION }}
        run: |
          [ -z "$PEOPLE" ] && echo "::warning::FLY_APP_PEOPLE_PRODUCTION is unset: People and the router were not deployed"
          [ -z "$ROUTER" ] && echo "::warning::FLY_APP_ROUTER_PRODUCTION is unset: the router was not deployed"
          [ -z "$REMOTE" ] && echo "::warning::VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION is unset: the People remote was not deployed"
          true

      # The tenant app, which no workflow has ever deployed to production.
      #
      # `kithena-web-production` already owns `app.kithena.com` and
      # `*.app.kithena.com` — the domains were attached and the DNS wildcard
      # was in place. The project simply had no deployments, so every tenant
      # host answered `DEPLOYMENT_NOT_FOUND`. Staging has shipped `apps/web`
      # since it existed; production never did.
      #
      # `TENANT_HOST_SUFFIX` is what `apps/web/src/proxy.ts` strips to find the
      # tenant in a host. It falls back to `''`, so leaving it unset does not
      # fail the build — it silently produces an app that cannot resolve a
      # tenant, which is worse.
      - name: build web
        env:
          TENANT_HOST_SUFFIX: app.kithena.com
        run: pnpm turbo run build --filter=@kithena/web...

      - name: build back-office
        env:
          # The same suffix `apps/web/src/proxy.ts` strips to find a tenant, so
          # the two cannot disagree about what a company's address is. Without
          # it the back-office printed `acme.app.kithena.com` everywhere,
          # including on staging, where that is production's hostname.
          TENANT_HOST_SUFFIX: app.kithena.com
      # `turbo run ... --filter=X...` and not `pnpm --filter X build`. The
      # trailing `...` means "and everything X depends on": turbo.json makes
      # `build` depend on `^build` and `codegen`, so a bare pnpm filter runs
      # `next build` against workspace packages that were never built. That is
      # how this failed — `Module not found: Can't resolve '@kithena/contracts'`
      # — and it passes locally only because a developer's tree already has the
      # dist directories. The Dockerfile has always done it this way.
        run: pnpm turbo run build --filter=@kithena/admin...

      - name: build docs
        run: pnpm turbo run build --filter=@reach/docs...
      - name: build storybook
        run: pnpm storybook:build

      # The back-office, on its own registrable domain rather than a path.
      # `admin.kithena.com` is not under `app.kithena.com`, so a browser will
      # not offer an employee's passkey here and will not offer an operator's
      # there. The isolation is free and it is why this is a separate host.
      # `--prod` and no `alias set`. The two tenant domains are production
      # domains of this project, so promoting the deployment is what points
      # them at it; aliasing each one by hand is what staging has to do because
      # it deploys as a preview.
      #
      # The shell's People settings are passed per deployment and read per
      # request, so pointing the shell at a new remote or router never needs a
      # rebuild. Each only when set: an unset one leaves whatever the project
      # has, rather than overwriting it with nothing.
      - name: deploy web
        id: web
        env:
          VERCEL_PROJECT_ID: prj_gFIRdhqiaC2ynPaBNhDkM1IqzPMx
          PEOPLE_REMOTE_URL: ${{ vars.PEOPLE_REMOTE_URL_PRODUCTION }}
          PEOPLE_REMOTE_SSR_PUBLIC_KEY: ${{ vars.PEOPLE_REMOTE_SSR_PUBLIC_KEY_PRODUCTION }}
          ROUTER_APP: ${{ vars.FLY_APP_ROUTER_PRODUCTION }}
        run: |
          # `pipefail`, because this pipes into `tail`: without it the status
          # reported is `tail`'s, so a deploy that failed exits 0 here and
          # hands an empty URL to everything downstream.
          set -o pipefail
          args=(--prod --yes --archive=tgz --token "$VERCEL_TOKEN")
          [ -n "$PEOPLE_REMOTE_URL" ] && args+=(--env "PEOPLE_REMOTE_URL=$PEOPLE_REMOTE_URL")
          [ -n "$PEOPLE_REMOTE_SSR_PUBLIC_KEY" ] && args+=(--env "PEOPLE_REMOTE_SSR_PUBLIC_KEY=$PEOPLE_REMOTE_SSR_PUBLIC_KEY")
          [ -n "$ROUTER_APP" ] && args+=(--env "ROUTER_URL=https://${ROUTER_APP}.fly.dev")
          url="$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy "${args[@]}" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Tenant app production: $url"

      # The auth origin, which no workflow has ever deployed — to production or
      # to staging. `apps/auth/shell` got a Vercel target this week and has been
      # shipped by hand since.
      #
      # No build step: unlike the Next apps, this one carries its own
      # `vercel.json` with `buildCommand: pnpm run deploy`, so Vercel builds it
      # from `apps/auth/shell` as its Root Directory. Deploying from the
      # repository root is what gives that command the workspace it needs —
      # `build:packages` filters on `@kithena/auth-shell^...`.
      #
      # `auth.app.kithena.com` mirrors `auth.staging.app.kithena.com`. It sits
      # under the `*.app.kithena.com` wildcard that `kithena-web-production`
      # holds, which is fine: an explicitly assigned domain wins over a
      # wildcard, so this reaches the auth origin and not the tenant app.
      - name: deploy auth
        id: auth
        env:
          VERCEL_PROJECT_ID: prj_ms3cotgBZ4hrzEoSDKoUAGVjIhiZ
        run: |
          # `pipefail`, because this pipes into `tail`: without it the status
          # reported is `tail`'s, so a deploy that failed exits 0 here and
          # hands an empty URL to everything downstream.
          set -o pipefail
          url="$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Auth origin production: $url"

      - name: deploy back-office
        id: admin
        env:
          VERCEL_PROJECT_ID: prj_xFPtNIieNz3jP5EvFNPaFOJwgRe4
        run: |
          # `pipefail`, because this pipes into `tail`: without it the status
          # reported is `tail`'s, so a deploy that failed exits 0 here and
          # hands an empty URL to everything downstream.
          set -o pipefail
          url="$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Back-office production: $url"

      - name: deploy docs
        id: docs
        env:
          VERCEL_PROJECT_ID: prj_hjiSAIp2hweckjQGdJVT5HAQ3zg9
        run: |
          # `pipefail`, because this pipes into `tail`: without it the status
          # reported is `tail`'s, so a deploy that failed exits 0 here and
          # hands an empty URL to everything downstream.
          set -o pipefail
          url="$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy apps/docs/dist --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Docs production: $url"

      - name: deploy storybook
        id: storybook
        env:
          VERCEL_PROJECT_ID: prj_u605gEWnCNjhTkdr0J7lCBCBGgcO
        run: |
          # `pipefail`, because this pipes into `tail`: without it the status
          # reported is `tail`'s, so a deploy that failed exits 0 here and
          # hands an empty URL to everything downstream.
          set -o pipefail
          url="$(npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy apps/storybook/storybook-static --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Storybook production: $url"

      # A deploy that returns 404 is a failed deploy, and the CLI exiting 0 does
      # not prove the CDN is serving anything. Both custom domains are checked
      # too: they are what people actually open, and a domain can be detached or
      # its certificate can lapse without the deployment noticing.
      - name: smoke test
        env:
          WEB_URL: ${{ steps.web.outputs.url }}
          DOCS_URL: ${{ steps.docs.outputs.url }}
          STORYBOOK_URL: ${{ steps.storybook.outputs.url }}
        run: |
          # `/sign-in` for the back-office and not `/`: the root redirects when
          # nobody is signed in, which is correct and is a 307. Following it
          # would be following a redirect into a page that must never render
          # for a stranger.
          #
          # The tenant app is checked by its deployment URL and *not* by
          # `app.kithena.com`. The bare host has no tenant in it, so
          # `apps/web/src/proxy.ts` has nothing to resolve and answers 404 by
          # design — `staging.app.kithena.com` does the same today. Naming it
          # here would fail every deploy and roll production back on a
          # correctly working app. A per-tenant host would be the real check,
          # and it needs a tenant that is guaranteed to exist first.
          for url in "$WEB_URL" "$DOCS_URL" "$STORYBOOK_URL" \
                     https://design.kithena.com https://storybook.kithena.com \
                     https://auth.app.kithena.com \
                     https://admin.kithena.com/sign-in; do
            echo "checking $url"
            curl --fail --silent --show-error --location \
                 --retry 5 --retry-delay 5 --max-time 30 "$url" >/dev/null
          done

      # A deployment that fails its smoke test is rolled back rather than left
      # serving. Vercel keeps the previous production deployment addressable, so
      # promoting it back is a second alias rather than a rebuild — seconds
      # rather than the minutes a revert-and-redeploy would take.
      #
      # The database is deliberately not rolled back with it. Migrations are
      # expand-contract, so the previous build reads the new schema perfectly
      # well; undoing the migration is what would break it.
      #
      # Every project this job promoted, not just the docs one. Rolling back a
      # single project out of five leaves production in a state no commit ever
      # produced: four surfaces on the build that just failed its smoke test,
      # one on the build before it. That is worse than either end.
      #
      # Clients first, then the service, which is the deploy order reversed.
      # Schema, then service, then client is the only ordering that is never
      # wrong going forwards, so undoing it back-to-front is the only ordering
      # that is never wrong coming back.
      #
      # Each project is skipped unless its own deploy step succeeded — a run
      # that failed while deploying the back-office must not try to promote a
      # tenant app it never shipped.
      - name: roll back if the smoke test failed
        if: failure()
        env:
          WEB_OUTCOME: ${{ steps.web.outcome }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          ADMIN_OUTCOME: ${{ steps.admin.outcome }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
          STORYBOOK_OUTCOME: ${{ steps.storybook.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          REMOTE_OUTCOME: ${{ steps.remote.outcome }}
          REMOTE_PROJECT: ${{ vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_PRODUCTION }}
          ROUTER_OUTCOME: ${{ steps.router.outcome }}
          ROUTER_APP: ${{ vars.FLY_APP_ROUTER_PRODUCTION }}
          ROUTER_PREVIOUS: ${{ steps.router.outputs.previous }}
          PEOPLE_OUTCOME: ${{ steps.people.outcome }}
          PEOPLE_APP: ${{ vars.FLY_APP_PEOPLE_PRODUCTION }}
          PEOPLE_PREVIOUS: ${{ steps.people.outputs.previous }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          rolled=()
          missing=()

          roll_back() {
            local name="$1" outcome="$2" project="$3"
            if [ "$outcome" != "success" ]; then
              echo "$name was not deployed by this run; nothing to roll back"
              return 0
            fi
            # `sed -n '2p'`: the first URL is the deployment this job just made,
            # the second is the one it replaced.
            local previous
            previous="$(VERCEL_PROJECT_ID="$project" npx --yes vercel@${VERCEL_CLI_VERSION} list \
              --prod --token "$VERCEL_TOKEN" --yes 2>/dev/null \
              | grep -oE 'https://[a-z0-9.-]+\.vercel\.app' | sed -n '2p')"
            if [ -z "$previous" ]; then
              echo "::warning::$name has no previous production deployment to roll back to"
              missing+=("$name")
              return 0
            fi
            echo "::warning::rolling $name back to $previous"
            VERCEL_PROJECT_ID="$project" npx --yes vercel@${VERCEL_CLI_VERSION} promote "$previous" \
              --token "$VERCEL_TOKEN" --yes
            rolled+=("$name -> $previous")
          }

          # Fly keeps no "previous production deployment" to promote, so a Fly
          # app is rolled back by redeploying the image its deploy step
          # recorded before it replaced it. Attempted on `failure` as well as
          # `success`: a Fly rollout that failed its health check can leave a
          # machine on the new image, where a Vercel deploy that failed changed
          # nothing. Redeploying the image already running is harmless.
          roll_back_fly() {
            local name="$1" outcome="$2" app="$3" config="$4" previous="$5"
            if [ "$outcome" != "success" ] && [ "$outcome" != "failure" ]; then
              echo "$name was not deployed by this run; nothing to roll back"
              return 0
            fi
            # No image recorded: either the step failed before it deployed
            # anything, or this was the app's first deploy.
            if [ -z "$previous" ]; then
              if [ "$outcome" = "success" ]; then
                echo "::warning::$name has no previous image to roll back to"
                missing+=("$name")
              else
                echo "$name failed before it deployed; nothing to roll back"
              fi
              return 0
            fi
            echo "::warning::rolling $name back to $previous"
            flyctl deploy --app "$app" --config "$config" --image "$previous" --yes
            rolled+=("$name -> $previous")
          }

          roll_back storybook   "$STORYBOOK_OUTCOME" prj_u605gEWnCNjhTkdr0J7lCBCBGgcO
          roll_back docs        "$DOCS_OUTCOME"      prj_hjiSAIp2hweckjQGdJVT5HAQ3zg9
          roll_back back-office "$ADMIN_OUTCOME"     prj_xFPtNIieNz3jP5EvFNPaFOJwgRe4
          roll_back auth        "$AUTH_OUTCOME"      prj_ms3cotgBZ4hrzEoSDKoUAGVjIhiZ
          roll_back tenant-app  "$WEB_OUTCOME"       prj_gFIRdhqiaC2ynPaBNhDkM1IqzPMx
          roll_back people-remote "$REMOTE_OUTCOME"  "$REMOTE_PROJECT"
          roll_back_fly router  "$ROUTER_OUTCOME"    "$ROUTER_APP" apps/gateway/fly.toml    "$ROUTER_PREVIOUS"
          roll_back_fly people  "$PEOPLE_OUTCOME"    "$PEOPLE_APP" services/people/fly.toml "$PEOPLE_PREVIOUS"
          roll_back identity    "$IDENTITY_OUTCOME"  prj_ShPvJf0eeh9wwe1HwB2mFnMrTjRL

          if [ ${#rolled[@]} -eq 0 ] && [ ${#missing[@]} -eq 0 ]; then
            echo "::error::this job failed before it deployed anything; nothing was rolled back"
            exit 1
          fi
          for line in "${rolled[@]}"; do echo "rolled back: $line"; done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::these had no previous deployment and are still on the failed build: ${missing[*]}"
          fi
          echo "::error::production was rolled back. Fix forward; do not re-run this job."
          exit 1

      - name: comment the urls on the pr
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_URL: ${{ steps.docs.outputs.url }}
          STORYBOOK_URL: ${{ steps.storybook.outputs.url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].number // empty')
          body="<!-- vercel-production -->
          ## 🚀 Vercel Production

          Deployed from **main** (\`${SHA:0:7}\`).

          - **Docs:** ${DOCS_URL} — also at https://design.kithena.com
          - **Storybook:** ${STORYBOOK_URL} — also at https://storybook.kithena.com
          "
          if [ -n "$pr_number" ]; then
            existing=$(gh api "repos/${REPO}/issues/${pr_number}/comments" --paginate --jq '.[] | select(.body | contains("<!-- vercel-production -->")) | .id' | head -n 1)
            if [ -n "$existing" ]; then
              gh api "repos/${REPO}/issues/comments/${existing}" --method PATCH -f body="$body"
            else
              gh pr comment "$pr_number" --body "$body"
            fi
          else
            echo "::notice::No pull request found for commit ${SHA}; deployment succeeded, nothing to comment on."
          fi
