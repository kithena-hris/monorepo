name: chromatic

# `push: main` is what establishes the baseline, and without it the rest does
# not work: `onlyChanged` compares against the last accepted build on the base
# branch, and `autoAcceptChanges: main` is the instruction to accept it there.
#
# Main and by hand only, since 2026-10-19. It ran on every pull request that
# touched Reach, and Chromatic's free snapshot quota is spent: each run then
# sat "pending" forever ("Update your plan to resume testing"), a runner
# minute and a check that never finished, on a check the ruleset does not
# require. The baseline on main still moves on each merge, so a run started
# by hand (`gh workflow run chromatic.yml`) compares against the last
# accepted one. Put `pull_request` back here when the plan allows it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  chromatic:
    name: visual regression
    # Skipped for Dependabot, which cannot pass. GitHub withholds repository
    # secrets from a Dependabot-triggered run, so `CHROMATIC_PROJECT_TOKEN` is empty
    # and this job fails on every dependency bump — a red cross that says
    # nothing about the change and trains people to ignore a failing check.
    #
    # Keyed on the actor rather than the branch, because the two differ in the
    # case that matters: a human pushing a fix onto a Dependabot branch *does*
    # get the secrets, and that run should snapshot rather than skip.
    #
    # A skip reports neutral, not green. This is not a required check, so
    # nothing that gated a merge before gates it any differently now.
    #
    # Narrowed to pull requests on purpose. This workflow also runs on `push:
    # main` and `merge_group`, and the push is what establishes the baseline
    # `onlyChanged` compares against — skipping that because the actor happened
    # to be Dependabot would leave every later pull request diffing against a
    # baseline nobody took.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile
      # `--stats-json` is in the build script, and TurboSnap does not work
      # without it. `onlyChanged: true` below asks Chromatic to snapshot only
      # the stories a change can reach, and it works that out from
      # `preview-stats.json` — which Storybook only writes when asked. Without
      # the flag the step fails outright with "TurboSnap disabled due to missing
      # stats file" rather than falling back to a full run.
      - name: build storybook
        run: pnpm storybook:build

      - name: publish to chromatic
        uses: chromaui/action@e50abd573c8a789526f165fec06137a7c21d7299 # v18.13.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: apps/storybook/storybook-static
          # Required in a monorepo, and the second half of making TurboSnap
          # work at all. It traces a changed file to the stories that import it,
          # and to do that it has to know where the repository root is relative
          # to the Storybook project — otherwise every path it reads from the
          # stats file resolves somewhere that does not exist, and it fails with
          # "Could not retrieve dependent story files".
          storybookBaseDir: apps/storybook
          onlyChanged: true
          autoAcceptChanges: main
          exitZeroOnChanges: false
          exitOnceUploaded: false
