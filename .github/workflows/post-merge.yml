name: Post-merge validation

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: post-merge-main
  cancel-in-progress: false

jobs:
  affected:
    name: Validate affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve previous main revision
        id: range
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"
      - name: Run affected validation
        env:
          BASE_SHA: ${{ steps.range.outputs.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          pnpm turbo run lint typecheck test build --since="$BASE_SHA" --include-dependencies --concurrency=4
      - name: Run affected integration tests
        env:
          BASE_SHA: ${{ steps.range.outputs.before }}
        run: pnpm turbo run test:integration --since="$BASE_SHA" --include-dependencies --concurrency=4
      - name: Run affected contract tests
        env:
          BASE_SHA: ${{ steps.range.outputs.before }}
        run: pnpm turbo run test:contract --since="$BASE_SHA" --include-dependencies --concurrency=4

  design-system:
    name: Validate affected design system
    needs: affected
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect affected stories
        id: stories
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node tools/a11y/affected-stories.mjs
      - name: Install dependencies
        if: steps.stories.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
      - name: Setup Node
        if: steps.stories.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.stories.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: steps.stories.outputs.skip != 'true'
        run: pnpm --filter @reach/storybook exec playwright install --with-deps chromium
      - name: Run affected Storybook tests
        if: steps.stories.outputs.skip != 'true'
        run: pnpm test:stories
      - name: Start Storybook
        if: steps.stories.outputs.skip != 'true'
        run: |
          pnpm --filter @reach/storybook dev --quiet &
          npx --yes wait-on http://localhost:6006/index.json --timeout 180000
      - name: Run affected contrast checks
        if: steps.stories.outputs.skip != 'true'
        env:
          STORY_FILTER: ${{ steps.stories.outputs.filters }}
          STORYBOOK_URL: http://localhost:6006
          CONTRAST_WORKERS: 4
        run: node tools/a11y/affected-contrast.mjs
      - name: Stop Storybook
        if: always() && steps.stories.outputs.skip != 'true'
        run: pkill -f "storybook" || true

  deploy:
    name: Deploy production
    needs: [affected, design-system]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Vercel credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build production applications
        run: |
          pnpm --filter @reach/docs build
          pnpm storybook:build
      - name: Deploy Docs
        id: docs
        env:
          VERCEL_ORG_ID: team_uActP8CY3wkqOpyG5WDKXKkTj
          VERCEL_PROJECT_ID: prj_hjiSAIp2hweckjQGdJVT5HAQ3zg9
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(npx --yes vercel@latest deploy apps/docs/dist --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Deploy Storybook
        id: storybook
        env:
          VERCEL_ORG_ID: team_uActP8CY3wkqOpyG5WDKXKkTj
          VERCEL_PROJECT_ID: prj_u605gEWnCNjhTkdr0J7lCBCBGgcO
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(npx --yes vercel@latest deploy apps/storybook/storybook-static --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test production deployments
        env:
          DOCS_URL: ${{ steps.docs.outputs.url }}
          STORYBOOK_URL: ${{ steps.storybook.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$DOCS_URL" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$STORYBOOK_URL" >/dev/null
      - name: Publish production URLs
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_URL: ${{ steps.docs.outputs.url }}
          STORYBOOK_URL: ${{ steps.storybook.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          body="<!-- vercel-production -->
          ## 🚀 Production deployment

          Deployed from **main** (`${GITHUB_SHA:0:7}`) after affected validation and production smoke tests.

          - **Docs:** ${DOCS_URL}
          - **Storybook:** ${STORYBOOK_URL}
          "
          gh api "repos/${REPO}/issues" --method POST \
            -f title="Production deployment — ${GITHUB_SHA:0:7}" \
            -f body="$body"
