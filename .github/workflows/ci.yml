name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Read-only. Without this the workflow inherits the repository default, which on
# older settings is write-all: every job would be able to push to `main` and
# publish packages purely because nobody narrowed it. This workflow comments on
# nothing and deploys nothing — `vercel-preview` and `vercel-production` do
# that, and they ask for `pull-requests: write` themselves.
permissions:
  contents: read

# Superseded runs are cancelled on a pull request, where only the tip matters
# and an older commit's result is noise worth paying nothing for.
#
# Never on `main`, because the group key there is the same string for every
# push — `refs/heads/main` — so a second merge cancels the first merge's run.
# That is not just a lost result: `vercel-production` triggers on this workflow
# and refuses anything whose conclusion is not `success`, and a cancelled run
# reports `cancelled`. The deploy is then skipped silently, with no failure
# anywhere to notice, and `main` sits undeployed until something else happens
# to push. Two merges nine minutes apart is all it takes, which is exactly how
# #8 came to never reach production.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Which of the slow, narrow gates this change can reach. The gates below keep
  # running as jobs (their required checks are matrix jobs, and a skipped matrix
  # job reports without its shard, which would leave `design-system (1)` pending
  # forever), but their expensive steps are skipped when nothing they cover
  # changed. Pull requests only: on `main` and in the merge queue both outputs
  # are always true, so a detector that guessed wrong costs a red build after
  # merge, never an unmeasured regression.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.diff.outputs.ui }}
      contracts: ${{ steps.diff.outputs.contracts }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: what changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          # Anything every job depends on: a dependency, the workspace, the
          # build graph, a patch, a shared tsconfig, or this workflow itself.
          shared='^(pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|turbo\.json|tsconfig[^/]*\.json|patches/|\.github/workflows/ci\.yml)'
          # What Storybook, axe, the contrast sweep and the docs site render.
          ui='^(packages/ui/|apps/storybook/|apps/docs/|tools/a11y/|tools/storybook/)'
          # What codegen, the contract tests and supergraph composition read.
          contracts='^(packages/contracts/|packages/graphql-kit/|services/|platform/|apps/gateway/|tools/codegen/)'
          # What the web acceptance stack runs: the shell and its remote, People,
          # identity, the router's config and persisted operations, every
          # migration, and every package (the design system renders the screens,
          # `packages/testing` starts the containers).
          web='^(apps/web/|services/people/|platform/identity/|apps/gateway/|packages/|migrations/)'
          any() { printf '%s\n' "$changed" | grep -Eq "$1"; }
          if any "$shared" || any "$ui"; then echo "ui=true" >> "$GITHUB_OUTPUT"; else echo "ui=false" >> "$GITHUB_OUTPUT"; fi
          if any "$shared" || any "$contracts"; then echo "contracts=true" >> "$GITHUB_OUTPUT"; else echo "contracts=false" >> "$GITHUB_OUTPUT"; fi
          if any "$shared" || any "$web"; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi
          echo "changed files:"; printf '%s\n' "$changed" | head -50

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }

      - name: install
        run: pnpm install --frozen-lockfile

      # Build first, because `lint` and `boundaries` are the two checks that do
      # not go through turbo. Every turbo task declares `dependsOn: ["^build"]`
      # and so builds what it needs, but `pnpm lint` is a bare `oxlint && eslint`
      # and `pnpm boundaries` a bare `depcruise`. `dist/` is not committed and
      # `@kithena/contracts` resolves through `./dist/index.d.ts`, so on a clean
      # checkout both see an unbuilt workspace and typescript-eslint reports the
      # whole codebase as `error typed value`.
      - name: build
        run: pnpm build

      # Cheap rules first, then the type-aware pass. ESLint resolves against
      # the pinned TypeScript 6 API until 7.1 ships a stable one. The
      # type-aware pass holds the whole program in memory and outgrew Node's
      # default heap (about 4 GB) with the People Phase 2/3 code; the runner
      # has 16 GB.
      - name: lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm lint

      # Architectural boundaries. A cross-module import fails here, which is
      # the only thing stopping the anti-sticky property from eroding.
      - name: module boundaries
        run: pnpm boundaries

      # TypeScript 6 is the merge gate. TS 7 is the fast local check; the two
      # compilers can still disagree and the authoritative one should decide.
      - name: typecheck on TS 6
        run: pnpm typecheck:authoritative

      - name: unit tests
        run: pnpm test

      # The invitation email carries concrete sRGB values, because a mail client
      # has no stylesheet to load, no custom properties and no `oklch()` —
      # Outlook renders through Word, which has none of the three. A snapshot of
      # a colour goes stale silently, so this reads the real stylesheet,
      # resolves the `var()` chain and converts, and fails if the copy has
      # moved.
      #
      # Here rather than in the Storybook job because it needs no browser: the
      # conversion is checked against `reach-tokens.json`, which a browser
      # produced, so it is verified against the renderer it stands in for.
      - name: email theme drift
        run: pnpm email:theme-drift

      # `atlas migrate apply` verifies the directory against `atlas.sum` before
      # it applies anything, so a migration added without re-hashing fails the
      # deploy — after this workflow has gone green, because nothing here used
      # to read the ledger.
      #
      # It has happened twice: #62 and #65, each unblocking a deploy that had
      # already passed every check. The reason it is easy to miss is that the
      # local path does not go through Atlas at all — `just local-db` applies
      # the directory with `psql` against its own `local_migration` table, so a
      # migration can be written, applied and tested without Atlas ever running.
      #
      # Re-hash and fail on a diff. `migrate validate` would be the fuller
      # check and is the wrong one here: it replays the whole directory, which
      # needs a database and the `svc_*` roles the deploy job creates in its
      # throwaway one first. This needs neither, and catches the failure that
      # actually happens.
      #
      # Pinned for the same reason the deploy pins it: `latest` moved `migrate
      # lint` behind a paid tier in v0.38 and broke a production deploy on a
      # release nobody here made.
      - name: migration ledger
        run: |
          ATLAS_VERSION=v0.37.0
          curl -sSf "https://release.ariga.io/atlas/atlas-linux-amd64-${ATLAS_VERSION}" -o /usr/local/bin/atlas
          chmod +x /usr/local/bin/atlas
          atlas migrate hash --dir "file://migrations"
          if ! git diff --quiet -- migrations/atlas.sum; then
            echo "::error file=migrations/atlas.sum::atlas.sum is stale. Run 'atlas migrate hash --dir file://migrations' and commit the result."
            git --no-pager diff -- migrations/atlas.sum
            exit 1
          fi
          echo "migration ledger matches the directory"

  contracts:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        if: needs.changes.outputs.contracts == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        if: needs.changes.outputs.contracts == 'true'
        run: pnpm install --frozen-lockfile
      - name: regenerate from contracts
        if: needs.changes.outputs.contracts == 'true'
        run: pnpm codegen
      - name: contract tests
        if: needs.changes.outputs.contracts == 'true'
        run: pnpm test:contract
      - name: compose the supergraph
        if: needs.changes.outputs.contracts == 'true'
        working-directory: apps/gateway
        run: pnpm check

      - name: nothing to check
        if: needs.changes.outputs.contracts != 'true'
        run: echo "::notice::No change this job covers (contracts, services, platform, gateway, codegen or shared config). It runs in full on main."


  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile
      - name: integration tests, real postgres
        run: pnpm test:integration

  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        module: [people, timeoff]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile
      # Through turbo, so the module's dependencies are built first. Run
      # directly, `pnpm --filter` would start vitest against an unbuilt
      # workspace and the module would fail to boot for the one reason this job
      # is not trying to detect.
      #
      # Twice, as steps rather than a second matrix axis, so the required checks
      # keep their names (`standalone (people)`). First with no TypeSafe key,
      # the configuration a customer without one runs; then with a dummy key,
      # so the advisor exists and the path through it is exercised. The dummy
      # is not a secret and reaches nothing: the suite replaces `fetch` and
      # fails on any request it did not mock, so CI never calls the real API.
      - name: boot the module alone, no TypeSafe key
        run: pnpm turbo run test:standalone --filter @kithena/${{ matrix.module }}
      # Straight through pnpm, not turbo: the step above built what it needs,
      # and turbo's strict env mode would withhold an undeclared variable from
      # the task — the run would pass with no key and prove nothing.
      - name: boot the module alone, TypeSafe key set (advisor mocked)
        env:
          TYPESAFE_API_KEY: standalone-dummy-key
        run: pnpm --filter @kithena/${{ matrix.module }} test:standalone

  # The tenant app as a person meets it: Postgres with every migration,
  # OpenFGA, identity, the Cosmo Router, People, the People remote and the
  # shell as production builds, driven by Chromium (`apps/web/acceptance`).
  # About thirteen tests over three minutes of setup, so it is gated like the
  # jobs above: the job always runs and always reports `web acceptance`, and
  # its steps run when the diff can reach the stack (`changes.outputs.web`),
  # and always on `main` and in the merge queue.
  #
  # Hermetic: every server is on loopback or in a container, and the webhook
  # test posts to the harness's own HTTPS receiver. Nothing reaches the
  # internet except the image and browser downloads before the suite starts.
  web-acceptance:
    name: web acceptance
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        if: needs.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile
      # Identity and People run from source under tsx, but resolve
      # `@kithena/contracts` and its siblings through their built `dist/`.
      - name: build the packages
        if: needs.changes.outputs.web == 'true'
        run: pnpm turbo run build --filter='./packages/*'
      - name: chromium
        if: needs.changes.outputs.web == 'true'
        run: pnpm --filter @kithena/web exec playwright install --with-deps chromium
      - name: acceptance suite
        if: needs.changes.outputs.web == 'true'
        env:
          ACCEPTANCE_LOGS: ${{ runner.temp }}/acceptance-servers.log
        run: pnpm --filter @kithena/web test:acceptance
      # The servers' last output, which is what explains a red run; the suite
      # writes it on the way down whatever the result.
      - name: keep the server logs
        if: failure() && needs.changes.outputs.web == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-acceptance-logs
          path: ${{ runner.temp }}/acceptance-servers.log
          retention-days: 7

      - name: nothing to check
        if: needs.changes.outputs.web != 'true'
        run: echo "::notice::No change this job covers (apps/web, People, identity, the gateway, packages, migrations or shared config). It runs in full on main."

  design-system:
    needs: changes
    # Every story renders in a real browser and axe runs over the result. An
    # accessibility rule that is only written down is an accessibility rule that
    # is already broken somewhere.
    #
    # Sharded four ways. The sweep renders every entry in two themes and two
    # pointer profiles — 468 x 4 renders in series took 34 minutes, which was
    # the whole pipeline; everything else here finishes inside three. The shards
    # are a round-robin over a sorted index, verified to partition it exactly,
    # so four runners cover the same set in roughly a quarter of the time.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: checkout
        if: needs.changes.outputs.ui == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: pnpm
        if: needs.changes.outputs.ui == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        if: needs.changes.outputs.ui == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        if: needs.changes.outputs.ui == 'true'
        run: pnpm install --frozen-lockfile
      - name: chromium
        if: needs.changes.outputs.ui == 'true'
        run: pnpm --filter @reach/storybook exec playwright install --with-deps chromium

      # Unconditional, and only on the first shard because it covers every story
      # by itself. Narrowing an accessibility pass by what a diff appears to
      # touch is how such a gate quietly stops being one.
      - name: axe over every story
        if: needs.changes.outputs.ui == 'true' && (matrix.shard == 1)
        run: pnpm test:stories

      # Narrows the *contrast sweep* and nothing else, and only on a pull
      # request. Every check below still runs on every event; the detector
      # chooses how much of one of them to run, never whether the job runs.
      - name: pick affected stories
        id: scope
        if: needs.changes.outputs.ui == 'true' && (github.event_name == 'pull_request')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node tools/a11y/affected-stories.mjs

      - name: contrast
        if: needs.changes.outputs.ui == 'true'
        # It measures focus rings, which means it cannot be replaced by anything
        # static: the ring colour only exists while an element is focused.
        timeout-minutes: 25
        env:
          STORY_FILTER: ${{ steps.scope.outputs.filters }}
          SKIP_STORY_SWEEP: ${{ steps.scope.outputs.skip }}
          STORYBOOK_URL: http://localhost:6006
          SHARD: ${{ matrix.shard }}/4
        run: |
          pnpm --filter @reach/storybook dev --quiet &
          npx --yes wait-on http://localhost:6006/index.json --timeout 180000

          # The drift gates describe the whole design system rather than any
          # subset of it, so they run once rather than four times.
          if [ "${{ matrix.shard }}" = "1" ]; then
            # The manager cannot reference a Reach custom property (it is a
            # separate document from the preview and does not load the
            # stylesheet), so its theme holds resolved copies. This fails if one
            # of them no longer matches the token it is named after.
            pnpm storybook:theme-drift
            # The public docs site lists what ships. It cannot fetch that list at
            # runtime (static build), so the list is a copy and this fails when
            # it stops matching.
            pnpm docs:catalogue-drift
            # Reach is documented and sold on its own and must never name
            # Kithena. Storybook enforces its half by excluding the mark's
            # stories; this is the documentation half, added after a demo
            # shipped a branded share link to production.
            pnpm docs:brand-leak
          fi

          # On a pull request that changed no design-system file, the story
          # sweep is skipped here — and runs in full on main, so a detector that
          # guessed wrong costs a red build after merge rather than a regression
          # nobody measures. On main and in the merge queue `scope` never ran,
          # both variables are empty, and the full sharded sweep is what runs.
          if [ "$SKIP_STORY_SWEEP" = "true" ]; then
            echo "::notice::No design-system change on this pull request. The story contrast sweep runs in full on main."
          elif [ -n "$STORY_FILTER" ] && [ "$STORY_FILTER" != "__ALL__" ]; then
            # Already a narrow set; sharding it further would leave most shards
            # with nothing and pay four installs to discover that.
            if [ "${{ matrix.shard }}" = "1" ]; then
              SHARD= node tools/a11y/affected-contrast.mjs
            fi
          else
            node tools/a11y/contrast-sweep.mjs
          fi

          # The docs site is built out of the design system and makes claims
          # about these thresholds, so it is held to them too. One shard, since
          # it is a single page rather than part of the story index.
          if [ "${{ matrix.shard }}" = "1" ]; then
            pnpm --filter @reach/docs build
            pnpm --filter @reach/docs preview --port 3100 &
            npx --yes wait-on http://localhost:3100 --timeout 60000
            SHARD= PAGE_URL=http://localhost:3100/ pnpm a11y:contrast
          fi

      - name: build storybook
        if: needs.changes.outputs.ui == 'true' && (matrix.shard == 1)
        run: pnpm storybook:build
      - name: keep the storybook build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.changes.outputs.ui == 'true' && (matrix.shard == 1)
        with:
          name: storybook
          path: apps/storybook/storybook-static
          retention-days: 14

      - name: nothing to check
        if: needs.changes.outputs.ui != 'true'
        run: echo "::notice::No design-system change (packages/ui, storybook, docs, a11y tooling or shared config). It runs in full on main."

