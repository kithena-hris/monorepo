name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm boundaries
      - run: pnpm typecheck:authoritative
      - run: pnpm test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm test:contract
      - name: Check subgraphs
        working-directory: apps/gateway
        run: pnpm check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [people, timeoff]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build standalone dependency graph
        run: pnpm turbo run build --filter=@hris/${{ matrix.module }}...
      - run: pnpm --filter @hris/${{ matrix.module }} test:standalone

  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect affected stories
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node tools/a11y/affected-stories.mjs
      - name: Install dependencies
        if: steps.affected.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
      - name: Setup Node
        if: steps.affected.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install dependencies
        if: steps.affected.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: steps.affected.outputs.skip != 'true'
        run: pnpm --filter @reach/storybook exec playwright install --with-deps chromium
      - name: Run Storybook tests
        if: steps.affected.outputs.skip != 'true'
        run: pnpm test:stories
      - name: Start Storybook
        if: steps.affected.outputs.skip != 'true'
        run: |
          pnpm --filter @reach/storybook dev --quiet &
          npx --yes wait-on http://localhost:6006/index.json --timeout 180000
      - name: Design-system drift gates
        if: steps.affected.outputs.skip != 'true'
        run: |
          pnpm storybook:theme-drift
          pnpm docs:catalogue-drift
      - name: Contrast gate — affected stories
        if: steps.affected.outputs.skip != 'true'
        env:
          STORY_FILTER: ${{ steps.affected.outputs.filters }}
          STORYBOOK_URL: http://localhost:6006
          CONTRAST_WORKERS: 4
        run: node tools/a11y/affected-contrast.mjs
      - name: Stop Storybook
        if: always() && steps.affected.outputs.skip != 'true'
        run: pkill -f "storybook" || true
      - name: Build Storybook
        if: steps.affected.outputs.skip != 'true'
        run: pnpm storybook:build
      - uses: actions/upload-artifact@v4
        if: steps.affected.outputs.skip != 'true'
        with:
          name: storybook
          path: apps/storybook/storybook-static
          retention-days: 14

  deploy:
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' &&
      needs.contracts.result == 'success' &&
      (needs.design-system.result == 'success' || needs.design-system.result == 'skipped')
    needs: [verify, contracts, design-system]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_uActP8CY3wkqOpyG5WDKXKkTj
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check the Vercel token is present
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - run: pnpm --filter @reach/docs build
      - run: pnpm --filter @reach/storybook build
      - name: Deploy the documentation
        id: deploy-docs
        env:
          VERCEL_PROJECT_ID: prj_hjiSAIp2hweckjQGdJVT5HAQ3zg9
        run: |
          url=$(npx --yes vercel@latest deploy apps/docs/dist --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Documentation production URL: $url"
      - name: Deploy Storybook
        id: deploy-storybook
        env:
          VERCEL_PROJECT_ID: prj_u605gEWnCNjhTkdr0J7lCBCBGgcO
        run: |
          url=$(npx --yes vercel@latest deploy apps/storybook/storybook-static --prod --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Storybook production URL: $url"
      - name: Publish deployment URLs to GitHub
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_URL: ${{ steps.deploy-docs.outputs.url }}
          STORYBOOK_URL: ${{ steps.deploy-storybook.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          body="<!-- vercel-deployments -->
          ## 🚀 Vercel deployments

          - **Docs:** ${DOCS_URL}
          - **Storybook:** ${STORYBOOK_URL}
          "
          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.body | contains("<!-- vercel-deployments -->")) | .id' | head -n 1)
          if [ -n "$existing" ]; then
            gh api "repos/${REPO}/issues/comments/${existing}" --method PATCH -f body="$body"
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
