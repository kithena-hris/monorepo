name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Cheap rules first, then the type-aware pass. ESLint resolves against
      # the pinned TypeScript 6 API until 7.1 ships a stable one.
      - run: pnpm lint

      # Architectural boundaries. A cross-module import fails here, which is
      # the only thing stopping the anti-sticky property from eroding.
      - run: pnpm boundaries

      # TypeScript 6 is the merge gate. TS 7 is the fast local check; the two
      # compilers can still disagree and the authoritative one should decide.
      - run: pnpm typecheck:authoritative

      - run: pnpm test
      - run: pnpm build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Fails when a contract field carries no classification policy.
      - run: pnpm codegen

      # Consumer-driven contract tests between event producers and consumers.
      - run: pnpm test:contract

      # Rejects a subgraph change that would break a composed field.
      - run: pnpm --filter @hris/gateway check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  standalone:
    # Each module boots with only its declared dependencies present. Without
    # this job, coupling creeps back in within two months.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [people, timeoff]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hris/${{ matrix.module }} test:standalone

  design-system:
    # Every story renders in a real browser and axe runs over the result. An
    # accessibility rule that is only written down is an accessibility rule that
    # is already broken somewhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reach/storybook exec playwright install --with-deps chromium
      - run: pnpm test:stories

      # axe reports contrast it cannot judge as `incomplete`, and incomplete
      # never fails a build. Short text is always incomplete, so step numbers,
      # badge counts and avatar initials went unchecked until this was added.
      # See tools/a11y/README.md.
      - name: Contrast gate
        # Every story in both themes and both pointer profiles, so this is the
        # long step in the job. It also measures focus rings, which means it
        # cannot be replaced by anything static: the ring colour only exists
        # while an element is focused.
        timeout-minutes: 45
        run: |
          pnpm --filter @reach/storybook dev --quiet &
          npx --yes wait-on http://localhost:6006/index.json --timeout 180000
          # The manager cannot reference a Reach custom property (it is a
          # separate document from the preview and does not load the
          # stylesheet), so its theme holds resolved copies. This fails if one
          # of them no longer matches the token it is named after.
          pnpm storybook:theme-drift
          # The public docs site lists what ships. It cannot fetch that list at
          # runtime (static build, and Storybook is behind sign-in), so the list
          # is a copy and this fails when it stops matching.
          pnpm docs:catalogue-drift
          pnpm a11y:contrast
          # The docs site is built out of the design system and makes claims
          # about these thresholds, so it is held to them too.
          pnpm --filter @reach/docs build
          pnpm --filter @reach/docs preview --port 3100 &
          npx --yes wait-on http://localhost:3100 --timeout 60000
          PAGE_URL=http://localhost:3100/ pnpm a11y:contrast

      - run: pnpm storybook:build
      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: apps/storybook/storybook-static
          retention-days: 14
