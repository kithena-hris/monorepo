name: ci

on:
  # `ready_for_review` too: a draft runs only the quick checks (below), and
  # marking it ready is what runs the rest.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

# Read-only. Without this the workflow inherits the repository default, which on
# older settings is write-all: every job would be able to push to `main` and
# publish packages purely because nobody narrowed it. This workflow comments on
# nothing and deploys nothing — `vercel-preview` and `vercel-production` do
# that, and they ask for `pull-requests: write` themselves.
permissions:
  contents: read

# Superseded runs are cancelled on a pull request, where only the tip matters
# and an older commit's result is noise worth paying nothing for.
#
# On `main` too, since 2026-09-27. A second merge now cancels the first
# merge's run, and `vercel-production` skips the cancelled one (it deploys only
# a `success`). That used to lose the older commit — #8 never reached
# production that way — but the deploy no longer ships "this commit": it ships
# every target that differs from its `deployed/production/<target>` tag
# (`tools/scripts/src/affected-targets.ts`), so the newer merge's deploy carries
# the older one's changes with it. The cost is that a superseded commit gets no
# verdict of its own; the newer run judges both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Which of the slow, narrow gates this change can reach. `contracts` is
  # skipped as a job; `web acceptance` keeps running as a job and skips its
  # expensive steps. A sharded gate (`integration`) skips its whole matrix,
  # because the required check is the
  # aggregate job after it, which reads these outputs — a skipped matrix job
  # reports without its shard, so a skip on a required *shard* name would sit
  # pending forever. Pull requests only: on `main` and in the merge queue every
  # output is true, so a detector that guessed wrong costs a red build after
  # merge, never an unmeasured regression.
  #
  # The one exception: on `main`, a gate the pull request already ran in full
  # on this exact tree. `gh pr merge --squash` on a pull request whose CI ran
  # against main's current tip gives a commit whose tree is byte-for-byte the
  # `refs/pull/N/merge` commit CI tested. `tested-tree`, at the bottom, records
  # what a green pull request run tested; `already tested` reads the record
  # back and proves it (the status was written by this workflow, links a green
  # `ci` run on the PR's head, and names this tree). Then `verify` and
  # `standalone` skip and the proven gates turn off; a gate the pull request
  # narrowed still runs here. Any doubt is a full run: the step cannot fail the
  # job, and empty outputs mean "run everything". docs/environments.md, "A merge
  # is not tested twice".
  #
  # In this job rather than one of its own: every gate needs this job, and a
  # job that is skipped on pull requests would skip everything downstream of it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      actions: read
    outputs:
      contracts: ${{ steps.diff.outputs.contracts }}
      web: ${{ steps.diff.outputs.web }}
      integration: ${{ steps.diff.outputs.integration }}
      matched: ${{ steps.tested.outputs.matched }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: already tested in its pull request?
        id: tested
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: .github/scripts/retested-tree.sh
      - name: what changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          PROVEN: ${{ steps.tested.outputs.proven }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            for gate in contracts web integration; do
              case " $PROVEN " in
                *" $gate "*) echo "$gate=false" >> "$GITHUB_OUTPUT" ;;
                *) echo "$gate=true" >> "$GITHUB_OUTPUT" ;;
              esac
            done
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          # Anything every job depends on: a dependency, the workspace, the
          # build graph, a patch, a shared tsconfig, or this workflow itself.
          shared='^(pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|turbo\.json|tsconfig[^/]*\.json|patches/|\.github/actions/|\.github/workflows/ci\.yml)'
          # What codegen, the contract tests and supergraph composition read.
          contracts='^(packages/contracts/|packages/graphql-kit/|services/|platform/|apps/gateway/|tools/codegen/)'
          # What the web acceptance stack runs: the shell and its remotes, People,
          # Time Off, identity, the router's config and persisted operations,
          # every migration, and every package (the design system renders the
          # screens, `packages/testing` starts the containers).
          web='^(apps/web/|services/people/|services/timeoff/|services/documents/|apps/web/documents/|platform/identity/|apps/gateway/|packages/|migrations/)'
          # What the integration suites run: every package with one, what they
          # import (the kits; never `packages/ui`, which a service may not
          # import), and the migrations their containers apply.
          integration='^(services/|platform/|packages/(auth-kit|contracts|db-kit|domain-kit|graphql-kit|telemetry|testing)/|migrations/|atlas\.hcl|tools/scripts/)'
          any() { printf '%s\n' "$changed" | grep -Eq "$1"; }
          if any "$shared" || any "$contracts"; then echo "contracts=true" >> "$GITHUB_OUTPUT"; else echo "contracts=false" >> "$GITHUB_OUTPUT"; fi
          if any "$shared" || any "$web"; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi
          if any "$shared" || any "$integration"; then echo "integration=true" >> "$GITHUB_OUTPUT"; else echo "integration=false" >> "$GITHUB_OUTPUT"; fi
          echo "changed files:"; printf '%s\n' "$changed" | head -50

  # Lint (with the module boundaries and the drift checks), the TS 6
  # typecheck and the unit tests, one after another on one runner. Three
  # runners each paid for their own checkout, install and build, and each was
  # billed a whole minute at least; turbo's remote cache already makes the
  # typecheck and the tests of an unchanged package a cache hit. Skipped on
  # main when this tree passed in its pull request: a skipped job satisfies
  # the required check.
  verify:
    needs: changes
    if: needs.changes.outputs.matched != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }

      - name: install
        run: pnpm install --frozen-lockfile

      # `lint` and `boundaries` do not go through turbo, so they need the
      # workspace built first; the typecheck and unit tests build what they need.
      - name: build
        run: pnpm build

      - name: lint
        run: pnpm lint

      # Architectural boundaries. A cross-module import fails here, which is
      # the only thing stopping the anti-sticky property from eroding.
      - name: module boundaries
        run: pnpm boundaries

      # TypeScript 6 is the merge gate. TS 7 is the fast local check; the two
      # compilers can still disagree and the authoritative one should decide.
      - name: typecheck on TS 6
        run: pnpm typecheck:authoritative

      - name: unit tests
        run: pnpm test

      # The invitation email carries concrete sRGB values, because a mail client
      # has no stylesheet to load, no custom properties and no `oklch()` —
      # Outlook renders through Word, which has none of the three. A snapshot of
      # a colour goes stale silently, so this reads the real stylesheet,
      # resolves the `var()` chain and converts, and fails if the copy has
      # moved.
      #
      # Here rather than in the Storybook job because it needs no browser: the
      # conversion is checked against `reach-tokens.json`, which a browser
      # produced, so it is verified against the renderer it stands in for.
      - name: email theme drift
        run: pnpm email:theme-drift

      # Everything a person can do in People and Time Off on the web, they can
      # do in the phone app: every operation the web reaches is reached by the
      # app too, or `apps/tenant-mobile/desktop-only.json` says why not. A new
      # web operation fails here until the app has it or the reason is written.
      - name: the phone app reaches what the web does
        run: pnpm --filter @kithena/tenant-mobile coverage --strict

      # `atlas migrate apply` verifies the directory against `atlas.sum` before
      # it applies anything, so a migration added without re-hashing fails the
      # deploy — after this workflow has gone green, because nothing here used
      # to read the ledger.
      #
      # It has happened twice: #62 and #65, each unblocking a deploy that had
      # already passed every check. The reason it is easy to miss is that the
      # local path does not go through Atlas at all — `just local-db` applies
      # the directory with `psql` against its own `local_migration` table, so a
      # migration can be written, applied and tested without Atlas ever running.
      #
      # Re-hash and fail on a diff. `migrate validate` would be the fuller
      # check and is the wrong one here: it replays the whole directory, which
      # needs a database and the `svc_*` roles the deploy job creates in its
      # throwaway one first. This needs neither, and catches the failure that
      # actually happens.
      #
      # Pinned for the same reason the deploy pins it: `latest` moved `migrate
      # lint` behind a paid tier in v0.38 and broke a production deploy on a
      # release nobody here made.
      - name: migration ledger
        run: |
          ATLAS_VERSION=v0.37.0
          curl -sSf "https://release.ariga.io/atlas/atlas-linux-amd64-${ATLAS_VERSION}" -o /usr/local/bin/atlas
          chmod +x /usr/local/bin/atlas
          atlas migrate hash --dir "file://migrations"
          if ! git diff --quiet -- migrations/atlas.sum; then
            echo "::error file=migrations/atlas.sum::atlas.sum is stale. Run 'atlas migrate hash --dir file://migrations' and commit the result."
            git --no-pager diff -- migrations/atlas.sum
            exit 1
          fi
          echo "migration ledger matches the directory"

  contracts:
    needs: changes
    # Skipped when nothing it covers changed: a skipped job satisfies the
    # required check, and no runner starts just to say so.
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile
      - name: regenerate from contracts
        run: pnpm codegen
      - name: contract tests
        run: pnpm test:contract
      - name: compose the supergraph
        working-directory: apps/gateway
        run: pnpm check

  # Five streams at once. People's suite is most of the time and runs its files
  # one after another (each starts its own containers), so it is split four
  # ways with Vitest's `--shard`; every other package's suite is the fifth.
  # A shard is a whole file, so a file's containers never span two runners.
  # Three People shards took 125-185 s of tests each, about 20 files apiece.
  integration-shard:
    name: integration (${{ matrix.stream }})
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stream: 'people 1/4', filter: '@kithena/people', shard: '1/4' }
          - { stream: 'people 2/4', filter: '@kithena/people', shard: '2/4' }
          - { stream: 'people 3/4', filter: '@kithena/people', shard: '3/4' }
          - { stream: 'people 4/4', filter: '@kithena/people', shard: '4/4' }
          - { stream: 'the rest', filter: '!@kithena/people', shard: '' }
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile
      # Through turbo, so each package's dependencies are built first.
      - name: integration tests, real postgres
        env:
          FILTER: ${{ matrix.filter }}
          SHARD: ${{ matrix.shard }}
        run: |
          args=(--filter "$FILTER")
          if [ -n "$SHARD" ]; then
            pnpm turbo run test:integration "${args[@]}" -- --shard="$SHARD"
          else
            pnpm turbo run test:integration "${args[@]}"
          fi

  # The required check keeps its name: green only when every stream is, or
  # when the change cannot reach any integration suite.
  integration:
    needs: [changes, integration-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every stream passed
        env:
          CHANGES: ${{ needs.changes.result }}
          REACHED: ${{ needs.changes.outputs.integration }}
          RESULT: ${{ needs.integration-shard.result }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          echo "changes: $CHANGES (integration=$REACHED), streams: $RESULT"
          # A failed detector skips the matrix; that is not a pass.
          [ "$CHANGES" = success ] || exit 1
          if [ "$DRAFT" = true ]; then
            echo "::notice::A draft runs the quick checks only. Mark it ready for review to run the integration suites."
            exit 0
          fi
          if [ "$REACHED" != true ]; then
            echo "::notice::No change an integration suite covers (services, platform, the kits, migrations or shared config). On main it runs unless this tree already passed it in its pull request."
            exit 0
          fi
          [ "$RESULT" = success ]

  standalone:
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.matched != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        module: [people, timeoff, documents, recruiting, onboarding]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile
      # Through turbo, so the module's dependencies are built first. Run
      # directly, `pnpm --filter` would start vitest against an unbuilt
      # workspace and the module would fail to boot for the one reason this job
      # is not trying to detect.
      #
      # Twice, as steps rather than a second matrix axis, so the required checks
      # keep their names (`standalone (people)`). First with no TypeSafe key,
      # the configuration a customer without one runs; then with a dummy key,
      # so the advisor exists and the path through it is exercised. The dummy
      # is not a secret and reaches nothing: the suite replaces `fetch` and
      # fails on any request it did not mock, so CI never calls the real API.
      - name: boot the module alone, no TypeSafe key
        run: pnpm turbo run test:standalone --filter @kithena/${{ matrix.module }}
      # Straight through pnpm, not turbo: the step above built what it needs,
      # and turbo's strict env mode would withhold an undeclared variable from
      # the task — the run would pass with no key and prove nothing.
      - name: boot the module alone, TypeSafe key set (advisor mocked)
        env:
          TYPESAFE_API_KEY: standalone-dummy-key
          ASSISTANT_API_KEY: standalone-dummy-key
        run: pnpm --filter @kithena/${{ matrix.module }} test:standalone

  # The tenant app as a person meets it: Postgres with every migration,
  # OpenFGA, Redpanda, identity, the Cosmo Router, People and Time Off, both
  # remotes and the shell as production builds, driven by Chromium
  # (`apps/web/acceptance`). The builds are made once for both files; each file
  # starts its own stack. Minutes of setup, so it is gated like the
  # jobs above: the job always runs and always reports `web acceptance`, and
  # its steps run when the diff can reach the stack (`changes.outputs.web`),
  # and always on `main` and in the merge queue.
  #
  # Hermetic: every server is on loopback or in a container, and the webhook
  # test posts to the harness's own HTTPS receiver. Nothing reaches the
  # internet except the image and browser downloads before the suite starts.
  #
  # The files run on runners of their own at once rather than one after
  # another: in one job the suite was about ten minutes. People's tests are
  # three files (its core flows, other companies, its pages), each a part,
  # then perf, then every other file. Each runner builds the three apps
  # itself (about 20 s) and starts its own stack, as each file already did. `web acceptance`
  # itself is the aggregate below, the name the branch ruleset requires.
  web-acceptance-files:
    name: web acceptance (${{ matrix.part }})
    needs: changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: people
            files: acceptance/people.acceptance.test.ts
          - part: people-companies
            files: acceptance/people-companies.acceptance.test.ts
          - part: people-pages
            files: acceptance/people-pages.acceptance.test.ts
          - part: perf
            files: acceptance/perf.acceptance.test.ts
          # Every other file, so a new one is never left out.
          - part: rest
            files: ''
    steps:
      - name: checkout
        if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm
        if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        if: needs.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile
      # Identity, People and Time Off run from source under tsx, but resolve
      # `@kithena/contracts` and its siblings through their built `dist/`.
      - name: build the packages
        if: needs.changes.outputs.web == 'true'
        run: pnpm turbo run build --filter='./packages/*'
      - name: chromium
        if: needs.changes.outputs.web == 'true'
        uses: ./.github/actions/chromium
        with: { package: '@kithena/web' }
      - name: acceptance suite
        if: needs.changes.outputs.web == 'true'
        env:
          ACCEPTANCE_LOGS: ${{ runner.temp }}/acceptance-servers.log
          FILES: ${{ matrix.files }}
        run: |
          if [ -z "$FILES" ]; then
            FILES="$(cd apps/web && ls acceptance/*.acceptance.test.ts | grep -v -e '/people' -e '/perf\.' | tr '\n' ' ')"
          fi
          echo "files: $FILES"
          # shellcheck disable=SC2086 # one argument per file
          pnpm --filter @kithena/web test:acceptance $FILES
      # The servers' last output, which is what explains a red run; the suite
      # writes it on the way down whatever the result.
      - name: keep the server logs
        if: failure() && needs.changes.outputs.web == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-acceptance-logs-${{ matrix.part }}
          path: ${{ runner.temp }}/acceptance-servers.log
          retention-days: 7

      - name: nothing to check
        if: needs.changes.outputs.web != 'true'
        run: echo "::notice::No change this job covers (apps/web, People, Time Off, identity, the gateway, packages, migrations or shared config). On main it runs unless this tree already passed it in its pull request."

  web-acceptance:
    name: web acceptance
    needs: [changes, web-acceptance-files]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every part passed
        env:
          CHANGES: ${{ needs.changes.result }}
          FILES: ${{ needs.web-acceptance-files.result }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          echo "changes: $CHANGES, files: $FILES"
          # A failed detector skips the parts; that is not a pass.
          [ "$CHANGES" = success ] || exit 1
          if [ "$DRAFT" = true ]; then
            echo "::notice::A draft runs the quick checks only. Mark it ready for review to run the acceptance suite."
            exit 0
          fi
          [ "$FILES" = success ]

  # The record `changes` reads on main: once every required check of a pull
  # request run is green, a `ci/tested-tree` status on the PR's head naming the
  # tree this run tested (`refs/pull/N/merge`, the PR on main's tip at that
  # moment) and the narrowed gates that ran in full. `verify` and `standalone`
  # always run in full on a pull request, so a green run proves them; if that
  # ever changes, they need a word in `ran=` too. The newest status wins, so it
  # always describes the last green run. Not a required check. A fork's token
  # cannot write statuses: nothing is recorded and main runs the full suite,
  # which is also what happens when this step fails.
  tested-tree:
    needs: [changes, verify, contracts, integration, standalone, web-acceptance]
    if: >-
      ${{ github.event_name == 'pull_request' && !cancelled() &&
      needs.changes.result == 'success' && needs.verify.result == 'success' &&
      (needs.contracts.result == 'success' || needs.contracts.result == 'skipped') &&
      needs.integration.result == 'success' &&
      needs.standalone.result == 'success' && needs.web-acceptance.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: record the tested tree
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTRACTS: ${{ needs.changes.outputs.contracts }}
          WEB: ${{ needs.changes.outputs.web }}
          INTEGRATION: ${{ needs.changes.outputs.integration }}
        run: |
          tree="$(gh api "repos/$REPO/git/commits/$MERGE_SHA" --jq .tree.sha)"
          ran=()
          [ "$CONTRACTS" = true ] && ran+=(contracts)
          [ "$WEB" = true ] && ran+=(web)
          [ "$INTEGRATION" = true ] && ran+=(integration)
          description="tree=$tree ran=$(IFS=,; echo "${ran[*]}")"
          echo "$description"
          gh api "repos/$REPO/statuses/$HEAD_SHA" -f state=success -f context=ci/tested-tree \
            -f description="$description" -f target_url="$RUN_URL" > /dev/null
