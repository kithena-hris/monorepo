name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm boundaries
      - run: pnpm typecheck:authoritative
      - run: pnpm test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm test:contract
      - run: pnpm --filter @hris/gateway check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [people, timeoff]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hris/${{ matrix.module }} test:standalone

  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reach/storybook exec playwright install --with-deps chromium
      - run: pnpm test:stories

      - name: Detect affected stories
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node tools/a11y/affected-stories.mjs

      - name: Start Storybook
        if: steps.affected.outputs.skip != 'true'
        run: |
          pnpm --filter @reach/storybook dev --quiet &
          npx --yes wait-on http://localhost:6006/index.json --timeout 180000

      - name: Design-system drift gates
        if: steps.affected.outputs.skip != 'true'
        run: |
          pnpm storybook:theme-drift
          pnpm docs:catalogue-drift

      - name: Contrast gate — full
        if: steps.affected.outputs.full == 'true'
        timeout-minutes: 45
        run: pnpm a11y:contrast

      - name: Contrast gate — affected stories
        if: steps.affected.outputs.full != 'true' && steps.affected.outputs.skip != 'true'
        env:
          STORY_FILTER: ${{ steps.affected.outputs.filters }}
        run: pnpm a11y:contrast

      - name: Stop Storybook
        if: always() && steps.affected.outputs.skip != 'true'
        run: pkill -f "storybook" || true

      - name: Build Storybook
        run: pnpm storybook:build

      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: apps/storybook/storybook-static
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [verify, contracts, design-system]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_uActP8CY3wkqOpyG5WDKXkTj
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check the Vercel token is present
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - run: pnpm --filter @reach/docs build
      - run: pnpm --filter @reach/storybook build
      - name: Deploy the documentation
        env:
          VERCEL_PROJECT_ID: prj_hjiSAIp2hweckjQGdJVT5HAQ3zg9
        run: |
          npx --yes vercel@latest deploy apps/docs/dist --prod --yes --archive=tgz --token "$VERCEL_TOKEN"
      - name: Deploy Storybook
        env:
          VERCEL_PROJECT_ID: prj_u605gEWnCNjhTkdr0J7lCBCBGgcO
        run: |
          npx --yes vercel@latest deploy apps/storybook/storybook-static --prod --yes --archive=tgz --token "$VERCEL_TOKEN"
