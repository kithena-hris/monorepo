name: vercel-preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/docs/**'
      - 'apps/storybook/**'
      - 'packages/**'
      - 'services/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_uActP8CY3wkqOpyG5WDKXKkTj
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  build:
    name: Build preview artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reach/docs build
      - run: pnpm storybook:build
      - name: Package preview artifacts with stable paths
        run: |
          tar -C apps/docs -czf /tmp/docs-preview.tgz dist
          tar -C apps/storybook -czf /tmp/storybook-preview.tgz storybook-static
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-artifacts
          path: |
            /tmp/docs-preview.tgz
            /tmp/storybook-preview.tgz
          retention-days: 1

  preview:
    name: Deploy Vercel previews
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vercel-preview-artifacts
          path: /tmp/vercel-preview-artifacts
      - name: Validate Vercel credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore preview artifacts
        run: |
          mkdir -p apps/docs apps/storybook
          tar -xzf /tmp/vercel-preview-artifacts/docs-preview.tgz -C apps/docs
          tar -xzf /tmp/vercel-preview-artifacts/storybook-preview.tgz -C apps/storybook
          test -f apps/docs/dist/index.html
          test -f apps/storybook/storybook-static/index.html
      - name: Deploy docs preview
        id: docs
        env:
          VERCEL_PROJECT_ID: prj_hjiSAIp2hweckjQGdJVT5HAQ3zg9
        run: |
          url="$(npx --yes vercel@latest deploy apps/docs/dist --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Deploy Storybook preview
        id: storybook
        env:
          VERCEL_PROJECT_ID: prj_u605gEWnCNjhTkdr0J7lCBCBGgcO
        run: |
          url="$(npx --yes vercel@latest deploy apps/storybook/storybook-static --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Publish preview URLs to PR
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_URL: ${{ steps.docs.outputs.url }}
          STORYBOOK_URL: ${{ steps.storybook.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          body="<!-- vercel-preview -->
          ## 🚀 Vercel Preview

          - **Docs:** ${DOCS_URL}
          - **Storybook:** ${STORYBOOK_URL}
          "
          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.body | contains("<!-- vercel-preview -->")) | .id' | head -n 1)
          if [ -n "$existing" ]; then
            gh api "repos/${REPO}/issues/comments/${existing}" --method PATCH -f body="$body"
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
