name: vercel-preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/docs/**'
      - 'apps/storybook/**'
      - 'packages/**'
      - 'services/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  merge_group:

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_uActP8CY3wkqOpyG5WDKXkTj
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  build:
    name: Build preview artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reach/docs build
      - run: pnpm storybook:build
      - name: Package preview artifacts with stable paths
        run: |
          tar -C apps/docs -czf /tmp/docs-preview.tgz dist
          tar -C apps/storybook -czf /tmp/storybook-preview.tgz storybook-static
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-artifacts
          path: |
            /tmp/docs-preview.tgz
            /tmp/storybook-preview.tgz
          retention-days: 1

  preview:
    name: Deploy Vercel previews
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vercel-preview-artifacts
          path: /tmp/vercel-preview-artifacts

      - name: Validate Vercel credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Restore preview artifacts
        run: |
          mkdir -p apps/docs apps/storybook
          tar -xzf /tmp/vercel-preview-artifacts/docs-preview.tgz -C apps/docs
          tar -xzf /tmp/vercel-preview-artifacts/storybook-preview.tgz -C apps/storybook
          test -f apps/docs/dist/index.html
          test -f apps/storybook/storybook-static/index.html

      - name: Deploy docs preview
        id: docs
        env:
          VERCEL_PROJECT_ID: prj_hjiSAIp2hweckjQGdJVT5HAQ3zg9
        run: |
          url="$(npx --yes vercel@latest deploy apps/docs/dist --yes --archive=tgz --token "$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Docs preview: $url"

      - name: Deploy Storybook preview
        id: storybook
        env:
          VERCEL_PROJECT_ID: prj_u605gEWnCNjhTkdr0J7lCBCBGgcO
        run: |
          url="$(npx --yes vercel@latest deploy apps/storybook/storybook-static --yes --archive=tgz --token "$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Storybook preview: $url"

      - name: Publish preview URLs to job summary
        env:
          DOCS_URL: ${{ steps.docs.outputs.url }}
          STORYBOOK_URL: ${{ steps.storybook.outputs.url }}
        run: |
          {
            echo '## Vercel previews'
            echo
            echo "- Docs: ${DOCS_URL}"
            echo "- Storybook: ${STORYBOOK_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
