name: vercel-preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/docs/**'
      - 'apps/storybook/**'
      - 'packages/**'
      - 'services/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_uActP8CY3wkqOpyG5WDKXKkTj
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  preview:
    name: Deploy Vercel previews
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Pull Docs preview environment
        working-directory: apps/docs
        env:
          VERCEL_PROJECT_ID: prj_xFPtNIieNz3jP5EvFNPaFOJwgRe4
        run: npx --yes vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"
      - name: Build Docs with Vercel
        working-directory: apps/docs
        env:
          VERCEL_PROJECT_ID: prj_xFPtNIieNz3jP5EvFNPaFOJwgRe4
        run: npx --yes vercel@latest build --token "$VERCEL_TOKEN"
      - name: Deploy Docs prebuilt
        id: docs
        working-directory: apps/docs
        env:
          VERCEL_PROJECT_ID: prj_xFPtNIieNz3jP5EvFNPaFOJwgRe4
        run: |
          url="$(npx --yes vercel@latest deploy --prebuilt --yes --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Pull Storybook preview environment
        working-directory: apps/storybook
        env:
          VERCEL_PROJECT_ID: prj_u605gEWnCNjhTkdr0J7lCBCBGgcO
        run: npx --yes vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"
      - name: Build Storybook with Vercel
        working-directory: apps/storybook
        env:
          VERCEL_PROJECT_ID: prj_u605gEWnCNjhTkdr0J7lCBCBGgcO
        run: npx --yes vercel@latest build --token "$VERCEL_TOKEN"
      - name: Deploy Storybook prebuilt
        id: storybook
        working-directory: apps/storybook
        env:
          VERCEL_PROJECT_ID: prj_u605gEWnCNjhTkdr0J7lCBCBGgcO
        run: |
          url="$(npx --yes vercel@latest deploy --prebuilt --yes --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URLs on PR
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_URL: ${{ steps.docs.outputs.url }}
          STORYBOOK_URL: ${{ steps.storybook.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          body="<!-- vercel-preview -->
          ## 🚀 Vercel Preview

          - **Docs:** ${DOCS_URL}
          - **Storybook:** ${STORYBOOK_URL}
          "
          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.body | contains("<!-- vercel-preview -->")) | .id' | head -n 1)
          if [ -n "$existing" ]; then
            gh api "repos/${REPO}/issues/comments/${existing}" --method PATCH -f body="$body"
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
