name: security

# Separate from `ci` on purpose. These checks answer a different question —
# "is anything here dangerous" rather than "is anything here broken" — and they
# have to keep running on a repository nobody is currently changing, because a
# dependency becomes vulnerable on someone else's schedule, not on ours.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday morning. A weekly run is what turns "we had no advisories when we
    # merged" into "we have no advisories now".
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history. Scanning only the tip finds nothing: a credential that was
      # committed and then deleted is still in the pack file, still cloneable,
      # and still valid until it is rotated.
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }

      # The binary rather than the marketplace action: that action requires a
      # paid licence key for organisation-owned repositories, and a security
      # gate that silently no-ops when a key is missing is worse than none.
      #
      # Checksum-verified, the same as `tools/scripts/install-gitleaks.sh` does
      # for the pre-commit hook. This previously piped an unverified download
      # straight into /usr/local/bin — in the more privileged of the two
      # environments, and for the one tool where trusting whatever the network
      # returns is least defensible.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/$archive" -o "$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          expected="$(grep " ${archive}\$" checksums.txt | awk '{print $1}')"
          if [ -z "$expected" ]; then
            echo "::error::No published checksum for $archive"
            exit 1
          fi
          echo "${expected}  ${archive}" | sha256sum --check --status || {
            echo "::error::Checksum mismatch for $archive"
            exit 1
          }
          tar -xzf "$archive" -C /usr/local/bin gitleaks
          rm -f "$archive" checksums.txt
          gitleaks version

      - name: scan full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile

      # The gate is on what ships. A ReDoS in a linter cannot be reached by a
      # request to this product, and failing the build on it trains everyone to
      # ignore the job that is also meant to catch the one that matters.
      - name: audit production deps
        run: pnpm audit --prod --audit-level low

      # Development tooling is reported, never gates. Dependabot raises these as
      # reviewable pull requests with a changelog attached, which is the right
      # place to decide about a major version of a build tool.
      - name: report dev advisories
        if: always()
        continue-on-error: true
        run: pnpm audit --audit-level high || true

  permissions-check:
    name: workflow permissions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A workflow with no `permissions:` block inherits whatever the repository
      # default is, which is `write-all` on older settings. This fails when a
      # workflow forgets to narrow it, so a future job cannot quietly gain the
      # ability to push to the repository or publish a package.
      - name: workflows declare permissions
        run: |
          missing=0
          for f in .github/workflows/*.yml; do
            if ! grep -q '^permissions:' "$f"; then
              echo "::error file=$f::workflow does not declare a top-level permissions block"
              missing=1
            fi
          done
          exit $missing
