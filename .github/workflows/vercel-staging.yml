name: vercel-staging

# Staging, deployed from a pull request once `ci` has gone green on it.
#
# The point of staging is to look at a change with test customers before it
# reaches real ones, so it deploys *before* merge rather than after. Like
# production, it triggers on `workflow_run` and refuses anything whose `ci`
# conclusion is not `success` — a separate workflow cannot use `needs:`, and
# without the guard this would deploy a branch whose tests failed.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One staging deploy at a time for the whole environment, not one per branch.
  # Keyed per branch, two pull requests ran `atlas migrate apply` against the
  # same database concurrently. A deploy is replaceable; a half-applied
  # migration is not, so this is a queue and nothing is cancelled mid-flight.
  #
  # This makes the race rarer, not impossible: an abandoned pull request still
  # leaves its schema on staging. The real fix is a Neon branch per pull
  # request, which needs a NEON_API_KEY and is tracked separately.
  group: vercel-staging
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_uActP8CY3wkqOpyG5WDKXkTj
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_CLI_VERSION: 59.3.0

jobs:
  # People's and the router's images, built natively on arm64 for the VM
  # (`docs/environments.md` "Hosting") and proven before they are pushed:
  # the router image must pass a persisted operation, refuse an unknown hash
  # and refuse a request without a token (`apps/gateway/scripts/smoke.ts`), and
  # People's must boot and answer `/health`. Nothing is pushed otherwise.
  #
  # The supergraph routes to `http://people:4001`, People's name on the VM's
  # Compose network in every environment, so one router image per commit
  # serves either. Skipped while `ROUTER_URL_STAGING` is unset.
  images:
    name: arm64 images
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      vars.ROUTER_URL_STAGING != ''
    # A native arm64 runner, free for a public repository. Under QEMU the
    # People build takes an order of magnitude longer.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      people: ${{ steps.names.outputs.people }}
      router: ${{ steps.names.outputs.router }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile

      - name: names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "people=ghcr.io/${OWNER,,}/kithena-people:${SHA}" >> "$GITHUB_OUTPUT"
          echo "router=ghcr.io/${OWNER,,}/kithena-router:${SHA}" >> "$GITHUB_OUTPUT"

      - name: build and test the router image
        working-directory: apps/gateway
        env:
          IMAGE: ${{ steps.names.outputs.router }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          cat > graph.deploy.yaml <<'EOF'
          version: 1
          subgraphs:
            - name: people
              routing_url: http://people:4001/graphql
              schema:
                file: ../../services/people/schemas/people.graphql
          EOF
          pnpm exec wgc router compose -i graph.deploy.yaml -o supergraph.json
          docker build --tag "$IMAGE" --label "org.opencontainers.image.source=$SOURCE" .
          pnpm exec tsx scripts/smoke.ts "$IMAGE"

      # With no settings People boots and serves its schema; a native module
      # built for the wrong libc or architecture dies at import, before this.
      - name: build and test the people image
        env:
          IMAGE: ${{ steps.names.outputs.people }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          docker build --file services/people/Dockerfile --tag "$IMAGE" \
            --label "org.opencontainers.image.source=$SOURCE" .
          container="$(docker run --detach --publish 127.0.0.1:4001:4001 "$IMAGE")"
          if ! curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:4001/health >/dev/null; then
            docker logs "$container"
            exit 1
          fi
          docker rm --force "$container"

      - name: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          PEOPLE: ${{ steps.names.outputs.people }}
          ROUTER: ${{ steps.names.outputs.router }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push --quiet "$PEOPLE"
          docker push --quiet "$ROUTER"
          docker logout ghcr.io

      # The registry is transport, not history: the VM keeps the image each
      # environment is on and the one before it, which is all a rollback
      # needs, so five versions a package is plenty.
      - name: prune people images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: kithena-people
          package-type: container
          min-versions-to-keep: 5
      - name: prune router images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: kithena-router
          package-type: container
          min-versions-to-keep: 5

  deploy:
    name: staging deploy
    # Pull requests only. A push to main is production's business, and `ci` runs
    # on both.
    needs: images
    # `!cancelled()`: an images job skipped because the VM is not configured
    # must not skip the Vercel deploys with it; a failed one must.
    if: >
      !cancelled() && needs.images.result != 'failure' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    # Job-level, so the workflow's two plus the VM's pull from the registry.
    permissions:
      contents: read
      pull-requests: write
      packages: read
    # 30, not 25: the VM deploy waits for People and the router to be healthy.
    timeout-minutes: 30
    environment:
      name: staging
      url: https://staging.app.kithena.com
    steps:
      # The commit `ci` tested, not the branch tip, which may have moved on.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile

      - name: check the secrets
        run: |
          missing=
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "${{ secrets.DATABASE_URL }}" ] && missing="$missing DATABASE_URL"
          [ -z "${{ vars.VERCEL_WEB_PROJECT_ID }}" ] && missing="$missing VERCEL_WEB_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing staging secret(s):$missing"
            exit 1
          fi

      # Migrations before the deploy, never after. Expand-contract means the new
      # schema is readable by the old code, so migrating first is safe and
      # migrating second is a window where the new code reads columns that do
      # not exist yet.
      - name: migrate staging
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ATLAS_DEV_URL: ${{ vars.ATLAS_DEV_URL }}
        run: |
          # Pinned, not `latest`. Atlas moved `migrate lint` behind a paid
          # tier in v0.38, and because this downloaded `latest` the production
          # deploy broke on a release nobody here made. A version that can
          # change under us is a deploy that can fail for reasons not in this
          # repository. v0.37.0 is the last release where `lint` runs without
          # an account; bump it deliberately.
          ATLAS_VERSION=v0.37.0
          curl -sSf "https://release.ariga.io/atlas/atlas-linux-amd64-${ATLAS_VERSION}" -o /usr/local/bin/atlas
          chmod +x /usr/local/bin/atlas
          atlas migrate apply --env staging

      # People, the router, the People remote — then the shell.
      #
      # Schema, then service, then client, one layer further out: People serves
      # the subgraph, the router composes it, the remote renders against what
      # the router serves, and the shell loads the remote.
      #
      # People and the router run on one Oracle Cloud VM under Docker Compose
      # (`deploy/vm/`), reached over Tailscale; only the router is public,
      # through a Cloudflare Tunnel. People holds Kafka consumer groups, runs
      # hourly jobs and drains on SIGTERM (PEO-118), so it needs a process,
      # not a function. `docs/environments.md` "Hosting" has the rest.
      #
      # Skipped with a warning while `ROUTER_URL_STAGING` is unset, so this
      # merges before the VM exists.
      - name: check the VM settings
        if: vars.ROUTER_URL_STAGING != ''
        env:
          VM_HOST: ${{ vars.VM_TAILSCALE_HOST }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          PEOPLE_API_TOKEN: ${{ secrets.PEOPLE_API_TOKEN }}
          PEOPLE_ENV: ${{ secrets.PEOPLE_ENV }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          AUTH_TOKEN_AUDIENCE: ${{ vars.AUTH_TOKEN_AUDIENCE_STAGING }}
          KITHENA_ENTITLEMENTS: ${{ vars.KITHENA_ENTITLEMENTS_STAGING }}
          IMAGES: ${{ needs.images.result }}
        run: |
          missing=
          for name in VM_HOST TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET PEOPLE_API_TOKEN PEOPLE_ENV \
                      CLOUDFLARE_TUNNEL_TOKEN AUTH_TOKEN_AUDIENCE KITHENA_ENTITLEMENTS; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing staging setting(s):$missing (docs/environments.md, Hosting)"
            exit 1
          fi
          if [ "$IMAGES" != success ]; then
            echo "::error::the arm64 images job did not succeed ($IMAGES)"
            exit 1
          fi

      # An ephemeral node tagged `tag:ci`, gone when the job ends. The tailnet
      # policy lets `tag:ci` reach `tag:vm` as `deploy` and nothing else.
      - name: tailscale
        if: vars.ROUTER_URL_STAGING != ''
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Secrets travel on stdin into root-only 0600 files under
      # `/etc/kithena/staging/`: never argv, never an image, never this
      # repository. `PEOPLE_API_TOKEN` is appended to People's settings and
      # written into the router's from the one secret, so the token the router
      # sends and the token People expects cannot drift apart. The registry
      # login is this job's own token, which expires with the job.
      - name: prepare the VM
        if: vars.ROUTER_URL_STAGING != ''
        env:
          VM_HOST: ${{ vars.VM_TAILSCALE_HOST }}
          PEOPLE_API_TOKEN: ${{ secrets.PEOPLE_API_TOKEN }}
          PEOPLE_ENV: ${{ secrets.PEOPLE_ENV }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          AUTH_TOKEN_AUDIENCE: ${{ vars.AUTH_TOKEN_AUDIENCE_STAGING }}
          KITHENA_ENTITLEMENTS: ${{ vars.KITHENA_ENTITLEMENTS_STAGING }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.ssh
          printf 'Host vm\n  HostName %s\n  User deploy\n  StrictHostKeyChecking accept-new\n' \
            "$VM_HOST" > ~/.ssh/config
          # `migrations/` replaced whole, so the copy is exactly this commit's.
          ssh vm 'mkdir -p kithena && rm -rf kithena/migrations'
          scp -q -r deploy/vm/compose.yaml deploy/vm/compose.staging.yaml \
            deploy/vm/deploy.sh deploy/vm/backup.sh atlas.hcl migrations vm:kithena/
          ssh vm sudo install -d -m 700 /etc/kithena /etc/kithena/staging
          put() { ssh vm sudo install -m 600 /dev/stdin "/etc/kithena/staging/$1"; }
          printf '%s\nPEOPLE_API_TOKEN=%s\n' "$PEOPLE_ENV" "$PEOPLE_API_TOKEN" | put people.env
          printf 'PEOPLE_API_TOKEN=%s\nAUTH_JWKS_URL=%s\nAUTH_TOKEN_AUDIENCE=%s\nKITHENA_ENTITLEMENTS=%s\n' \
            "$PEOPLE_API_TOKEN" \
            https://identity.staging.kithena.com/.well-known/jwks.json \
            "$AUTH_TOKEN_AUDIENCE" "$KITHENA_ENTITLEMENTS" | put router.env
          printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$CLOUDFLARE_TUNNEL_TOKEN" | put secrets.env
          echo "$GH_TOKEN" | ssh vm sudo docker login ghcr.io -u "$ACTOR" --password-stdin

      # People's database is the VM's Postgres, not Neon, so the same
      # migrations the step above applied to Neon for identity are applied
      # there too, before People deploys: the order stays migrations, then
      # People. `deploy.sh migrate` runs the pinned Atlas in a one-shot
      # container on the Compose network.
      - name: migrate the VM database
        if: vars.ROUTER_URL_STAGING != ''
        run: ssh vm sudo bash kithena/deploy.sh staging migrate

      # Pulled, started, healthy, serving `/v1/openapi.json` (mounted only once
      # People has a database, where Yoga's `/health` would pass without one),
      # and reaching that database as `svc_people`. `deploy.sh` asks both from
      # inside People.
      - name: deploy people
        id: people
        if: vars.ROUTER_URL_STAGING != ''
        env:
          IMAGE: ${{ needs.images.outputs.people }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2029 # the image is meant to expand here
          ssh vm sudo bash kithena/deploy.sh staging people "$IMAGE" | tee deploy.out
          grep '^previous=' deploy.out >> "$GITHUB_OUTPUT"

      - name: deploy the router
        id: router
        if: vars.ROUTER_URL_STAGING != ''
        env:
          IMAGE: ${{ needs.images.outputs.router }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2029 # the image is meant to expand here
          ssh vm sudo bash kithena/deploy.sh staging router "$IMAGE" | tee deploy.out
          grep '^previous=' deploy.out >> "$GITHUB_OUTPUT"

      # Ready, and closed to a stranger, through the tunnel as a browser meets
      # it. The safelist was proven on the image.
      - name: smoke test the router
        if: vars.ROUTER_URL_STAGING != ''
        env:
          ROUTER_URL: ${{ vars.ROUTER_URL_STAGING }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
            "$ROUTER_URL/health/ready" >/dev/null
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 30 \
            -X POST -H 'content-type: application/json' -d '{"query":"{__typename}"}' \
            "$ROUTER_URL/graphql")"
          echo "an unauthenticated request answered $code"
          if [ "$code" != "401" ]; then
            echo "::error::the router did not refuse a request without a token"
            exit 1
          fi

      # The People remote, built and signed here and uploaded as files.
      #
      # Signed in this job, with the private key from this environment's
      # secrets, and never by Vercel: the shell pins the public half and
      # renders only a server build that verifies (PEO-115), which is what
      # makes a compromise of the remote's host survivable. A key Vercel held
      # would make that guarantee decorative. So this deploys `dist` as static
      # files rather than letting Vercel build the project — a Vercel build
      # cannot be signed without handing it the key.
      - name: build the people remote
        if: vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_STAGING != ''
        run: pnpm turbo run build --filter=@kithena/web-people...

      # `sign` prints the manifest (two hashes) and nothing else, and exits
      # non-zero naming the variable when the key is missing.
      - name: sign the people remote
        if: vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_STAGING != ''
        env:
          PEOPLE_REMOTE_SSR_SIGNING_KEY: ${{ secrets.PEOPLE_REMOTE_SSR_SIGNING_KEY }}
        run: pnpm --filter @kithena/web-people sign

      # The committed `vercel.json` travels with the files for its headers, less
      # the keys that would have Vercel build or skip them.
      - name: deploy the people remote
        id: remote
        if: vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_STAGING != ''
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_STAGING }}
        run: |
          set -o pipefail
          jq 'del(.ignoreCommand, .installCommand, .buildCommand, .outputDirectory)' \
            apps/web/people/vercel.json > apps/web/people/dist/vercel.json
          url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy apps/web/people/dist --prod \
            --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # On its custom domain, as the shell reaches it, with the headers the
      # shell depends on and a signature that verifies under the key the shell
      # is about to be given.
      - name: smoke test the people remote
        if: vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_STAGING != ''
        env:
          REMOTE: ${{ vars.PEOPLE_REMOTE_URL_STAGING }}
          PEOPLE_REMOTE_SSR_PUBLIC_KEY: ${{ vars.PEOPLE_REMOTE_SSR_PUBLIC_KEY_STAGING }}
        run: |
          if [ -z "$REMOTE" ] || [ -z "$PEOPLE_REMOTE_SSR_PUBLIC_KEY" ]; then
            echo "::error::PEOPLE_REMOTE_URL_STAGING and PEOPLE_REMOTE_SSR_PUBLIC_KEY_STAGING must be set with the remote's project"
            exit 1
          fi
          node apps/web/people/scripts/smoke-deploy.mjs "$REMOTE" https://acme.staging.app.kithena.com

      - name: warn about what was not deployed
        if: vars.ROUTER_URL_STAGING == '' || vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_STAGING == ''
        env:
          ROUTER: ${{ vars.ROUTER_URL_STAGING }}
          REMOTE: ${{ vars.VERCEL_PROJECT_ID_PEOPLE_REMOTE_STAGING }}
        run: |
          [ -z "$ROUTER" ] && echo "::warning::ROUTER_URL_STAGING is unset: People and the router were not deployed"
          [ -z "$REMOTE" ] && echo "::warning::VERCEL_PROJECT_ID_PEOPLE_REMOTE_STAGING is unset: the People remote was not deployed"
          true

      - name: build web
        env:
          TENANT_HOST_SUFFIX: staging.app.kithena.com
      # `turbo run ... --filter=X...` and not `pnpm --filter X build`. The
      # trailing `...` means "and everything X depends on": turbo.json makes
      # `build` depend on `^build` and `codegen`, so a bare pnpm filter runs
      # `next build` against workspace packages that were never built. That is
      # how this failed — `Module not found: Can't resolve '@kithena/contracts'`
      # — and it passes locally only because a developer's tree already has the
      # dist directories. The Dockerfile has always done it this way.
        run: pnpm turbo run build --filter=@kithena/web...

      # The shell's People settings are passed per deployment and read per
      # request, so pointing the shell at a new remote or router never needs a
      # rebuild. Each only when set: an unset one leaves whatever the project
      # has, rather than overwriting it with nothing.
      - name: deploy
        id: deploy
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEB_PROJECT_ID }}
          PEOPLE_REMOTE_URL: ${{ vars.PEOPLE_REMOTE_URL_STAGING }}
          PEOPLE_REMOTE_SSR_PUBLIC_KEY: ${{ vars.PEOPLE_REMOTE_SSR_PUBLIC_KEY_STAGING }}
          ROUTER_URL: ${{ vars.ROUTER_URL_STAGING }}
        run: |
          # `pipefail`, because this pipes into `tail`: without it the status
          # reported is `tail`'s, so a deploy that failed exits 0 here and
          # hands an empty URL to everything downstream.
          set -o pipefail
          args=(--yes --archive=tgz --token "$VERCEL_TOKEN")
          [ -n "$PEOPLE_REMOTE_URL" ] && args+=(--env "PEOPLE_REMOTE_URL=$PEOPLE_REMOTE_URL")
          [ -n "$PEOPLE_REMOTE_SSR_PUBLIC_KEY" ] && args+=(--env "PEOPLE_REMOTE_SSR_PUBLIC_KEY=$PEOPLE_REMOTE_SSR_PUBLIC_KEY")
          [ -n "$ROUTER_URL" ] && args+=(--env "ROUTER_URL=$ROUTER_URL")
          url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy "${args[@]}" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # Both, and the wildcard is the one that matters.
          #
          # `staging.app.kithena.com` is the tenant host *suffix* and answers
          # 404 by design, so aliasing only that pointed the one domain nobody
          # uses at the new build and left every real tenant host —
          # `acme.staging.app.kithena.com` — on whichever deployment last held
          # the wildcard. Staging looked green for a week while serving a build
          # from before the change under test, and the smoke test could not see
          # it because the host it checks is the host that 404s either way.
          #
          # Production does not need this: it deploys `--prod`, so both domains
          # are production domains of the project and promoting the deployment
          # points them at it.
          for domain in staging.app.kithena.com '*.staging.app.kithena.com'; do
            npx --yes vercel@${VERCEL_CLI_VERSION} alias set "$url" \
              "$domain" --token "$VERCEL_TOKEN"
          done

      # Whether the deployment is serving, not whether a tenant exists.
      #
      # `staging.app.kithena.com` is the tenant host *suffix*, not a tenant, so
      # it answers 404 — and that is the correct answer rather than a fault.
      # `apps/web/src/lib/tenant.ts` is part of the isolation boundary and is
      # written to fail closed: an unparseable host, an unknown label and a
      # reserved label all produce `null`, and `null` is a 404. A bare suffix
      # has no label at all.
      #
      # `--fail` therefore turned the app behaving correctly into a failed
      # deploy, and because this step runs under `bash -e` it took `deploy
      # identity` and the back-office down with it — the schema moved, the front
      # end shipped, and the thing holding sessions was never told. That is the
      # exact failure mode #38 is about, one layer up.
      #
      # So: a response, and not a server error. A 404 from the app proves Next
      # is running and the host was resolved. A 502 or a timeout does not.
      # Asserting 404 exactly would break the day the suffix grows a marketing
      # page, which is not a thing this check should have an opinion about.
      - name: smoke test
        run: |
          code="$(curl --silent --show-error --location --output /dev/null \
            --retry 5 --retry-delay 5 --max-time 30 \
            --write-out '%{http_code}' https://staging.app.kithena.com)"
          echo "staging.app.kithena.com answered $code"

          # And a real tenant host, which is what the wildcard alias serves.
          # The suffix above answers 404 whether the deployment is current or a
          # month old; this one does not, so it is the check that would have
          # caught the tenant hosts being stale.
          tenant="$(curl -sS --retry 5 --retry-delay 4 --retry-all-errors \
            --output /dev/null --write-out '%{http_code}' \
            https://acme.staging.app.kithena.com/)"
          echo "acme.staging.app.kithena.com answered $tenant"
          if [ "$tenant" = "404" ]; then
            echo "::error::the tenant wildcard is not serving this deployment"
            exit 1
          fi
          if [ -z "$code" ] || [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "::error::the tenant app is not serving (answered ${code:-nothing})"
            exit 1
          fi

      # The identity service, which no workflow deployed until now. A pipeline
      # that migrates the database and ships the UI while leaving the service
      # on old code is the worst of the three states: the schema has moved, the
      # front end expects it, and the thing holding sessions has not been told.


      # The identity service.
      #
      # After the migration and before the UI. Expand-contract means new code
      # reads the old schema and old code reads the new one, so the only
      # ordering that is never wrong is schema, then service, then client.
      #
      # A Vercel function rather than a container since 2026-08-22: the reason
      # it needed a process was a Valkey connection held across requests, and
      # challenges live in Postgres now. docs/environments.md has the rest.
      #
      # `--prod`, and that is not a typo. This is the *staging* project, whose
      # production environment is staging — `kithena-identity` holds only
      # `identity.staging.kithena.com`, and production lives in a different
      # project entirely for the reason `vercel-production.yml` sets out at
      # length.
      #
      # Without it this deployed a preview and aliased nothing, so the custom
      # domain went on serving whatever it served before and the smoke test
      # below passed against it. A deploy step that cannot change what the
      # domain serves is a deploy step that does nothing, and it passes.
      - name: deploy identity
        env:
          VERCEL_PROJECT_ID: prj_lpS5Um8fsfD6TUuEwE8PfctaiJPD
        run: |
          npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prod \
            --yes --archive=tgz --token "$VERCEL_TOKEN"

      # The custom domain, not the deployment URL. `ssoProtection` is set to
      # `all_except_custom_domains`, so a `.vercel.app` host answers 302 to a
      # login page and would pass a naive check that follows redirects.
      - name: smoke test identity
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --max-time 30 \
            https://identity.staging.kithena.com/.well-known/jwks.json >/dev/null

      # The messaging service.
      #
      # After identity, because identity is what calls it: deploying the caller
      # first would leave a window where an invitation is issued and the thing
      # that mails it is still the previous build. Nothing breaks either way —
      # the link comes back in the response regardless — but the ordering costs
      # nothing and one of the two is right.
      #
      # Its project id comes from a repository variable rather than being
      # written here, because the project is created once by hand and this
      # workflow has to be mergeable before that happens.
      - name: deploy messaging
        id: messaging
        if: vars.VERCEL_PROJECT_ID_MESSAGING_STAGING != ''
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_MESSAGING_STAGING }}
          # The only origin shape a notice may link to (`https://{slug}.…`).
          # A repository variable, like the project id. Unset, nothing is
          # passed and the service fails closed: it refuses every notice rather
          # than trusting a default that points at localhost.
          TENANT_APP_BASE: ${{ vars.TENANT_APP_BASE_STAGING }}
        run: |
          args=(--prod --yes --archive=tgz --token "$VERCEL_TOKEN")
          if [ -n "$TENANT_APP_BASE" ]; then
            args+=(--env "TENANT_APP_BASE=$TENANT_APP_BASE")
          else
            echo "::warning::TENANT_APP_BASE_STAGING is unset: messaging will send no reminder or webhook alert"
          fi
          npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy "${args[@]}"

      # `/healthz`, which is deliberately unauthenticated and says nothing worth
      # having — a status and which transport is composed. Putting the shared
      # secret into a smoke test is how the shared secret reaches a workflow log.
      #
      # The custom domain, not the deployment URL: `ssoProtection` is
      # `all_except_custom_domains`, so a `.vercel.app` host answers 302 to a
      # login page and would pass a naive check that follows redirects.
      - name: smoke test messaging
        if: vars.VERCEL_PROJECT_ID_MESSAGING_STAGING != ''
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --max-time 30 \
            https://messaging.staging.kithena.com/healthz >/dev/null

      - name: build back-office
        env:
          # The same suffix `apps/web/src/proxy.ts` strips to find a tenant, so
          # the two cannot disagree about what a company's address is. Without
          # it the back-office printed `acme.app.kithena.com` on every screen —
          # a real hostname, belonging to production, and wrong everywhere else.
          TENANT_HOST_SUFFIX: staging.app.kithena.com
        run: pnpm turbo run build --filter=@kithena/admin...

      # The back-office, on its own registrable domain rather than a path.
      #
      # The auth origin, which staging did not deploy until now.
      #
      # It was "shipped by hand" — which meant staging ran a new identity and a
      # new tenant app against whatever build of the sign-in page somebody last
      # pushed from a laptop. That is the worst of the three to have stale,
      # because it is the one holding the ceremony: the handoff endpoint this
      # release adds returned 404 on staging while both sides of it were live.
      #
      # No build step, matching production: this app carries its own
      # `vercel.json` with `buildCommand`, so Vercel builds it from
      # `apps/auth/shell` as its Root Directory, and deploying from the
      # repository root is what gives that command its workspace.
      #
      # `--prod` because this project's production deployment *is* staging's
      # auth origin — `auth.staging.app.kithena.com` is assigned to it. A
      # preview deploy would build the change and alias it nowhere.
      - name: deploy auth
        id: auth
        env:
          VERCEL_PROJECT_ID: prj_SGKR5ItEN1XaYgorCPRNBYQxuHqM
        run: |
          # `pipefail`, because this pipes into `tail`: without it the status
          # reported is `tail`'s, so a deploy that failed exits 0 here and
          # hands an empty URL to everything downstream.
          set -o pipefail
          url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prod \
            --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Auth origin staging: $url"

      # The sign-in page itself, which must render before anybody can use it,
      # and the handoff route that finishes a sign-in. Both unauthenticated: one
      # is a public page, the other answers 400 to an empty body and says
      # nothing about whether any session exists.
      - name: smoke test auth
        run: |
          code="$(curl -fsS --retry 5 --retry-delay 4 --retry-all-errors \
            --output /dev/null --write-out '%{http_code}' \
            'https://auth.staging.app.kithena.com/login?tenant=acme')"
          echo "auth.staging login answered $code"

          handoff="$(curl -sS --retry 3 --retry-delay 4 --retry-all-errors \
            --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' -d '{}' \
            'https://auth.staging.app.kithena.com/api/auth/handoff')"
          echo "auth.staging handoff answered $handoff"
          # 401 is the correct answer to a request with no session cookie. A 404
          # means the deploy did not carry this release's routes at all, which
          # is exactly the staleness this step exists to catch.
          if [ "$handoff" = "404" ]; then
            echo "::error::the auth origin is missing /api/auth/handoff"
            exit 1
          fi

      # `admin.kithena.com` is not under `app.kithena.com`, so a browser will
      # not offer an employee's passkey here and will not offer an operator's
      # there. That isolation is free and it is the main reason this is a
      # separate host.
      - name: deploy back-office
        id: admin
        env:
          VERCEL_PROJECT_ID: prj_xFPtNIieNz3jP5EvFNPaFOJwgRe4
        run: |
          # `pipefail`, because this pipes into `tail`: without it the status
          # reported is `tail`'s, so a deploy that failed exits 0 here and
          # hands an empty URL to everything downstream.
          set -o pipefail
          url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy \
            --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          npx --yes vercel@${VERCEL_CLI_VERSION} alias set "$url" \
            admin.staging.kithena.com --token "$VERCEL_TOKEN"

      # `/sign-in` and not `/`, deliberately. The root redirects when nobody is
      # signed in, which is the correct behaviour and a 307 rather than a 200 —
      # checking it would either pass for the wrong reason or need
      # `--location`, and following a redirect into a page that must never
      # render for a stranger is not a smoke test worth having.
      - name: smoke test the back-office
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --max-time 30 \
            https://admin.staging.kithena.com/sign-in >/dev/null

      # The registry login on the VM ends with the job, whatever happened.
      - name: log the VM out of the registry
        if: always() && steps.people.outcome != 'skipped'
        run: ssh vm 'sudo docker logout ghcr.io' || true

      - name: comment the url on the pr
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].number // empty')
          [ -z "$pr" ] && { echo "::notice::no pull request for ${SHA}"; exit 0; }
          body="<!-- staging -->
          ## 🧪 Staging

          \`${SHA:0:7}\` is on staging: https://staging.app.kithena.com

          Tenants resolve at \`<company>.staging.app.kithena.com\`.
          Test customers only — staging holds no real customer data.
          "
          existing=$(gh api "repos/${REPO}/issues/${pr}/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- staging -->")) | .id' | head -n 1)
          if [ -n "$existing" ]; then
            gh api "repos/${REPO}/issues/comments/${existing}" --method PATCH -f body="$body"
          else
            gh pr comment "$pr" --body "$body"
          fi
