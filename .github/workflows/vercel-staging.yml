name: vercel-staging

# Staging, deployed from a pull request once `ci` has gone green on it.
#
# The point of staging is to look at a change with test customers before it
# reaches real ones, so it deploys *before* merge rather than after. Like
# production, it triggers on `workflow_run` and refuses anything whose `ci`
# conclusion is not `success` — a separate workflow cannot use `needs:`, and
# without the guard this would deploy a branch whose tests failed.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One staging deploy at a time for the whole environment, not one per branch.
  # Keyed per branch, two pull requests ran `atlas migrate apply` against the
  # same database concurrently. A deploy is replaceable; a half-applied
  # migration is not, so this is a queue and nothing is cancelled mid-flight.
  #
  # This makes the race rarer, not impossible: an abandoned pull request still
  # leaves its schema on staging. The real fix is a Neon branch per pull
  # request, which needs a NEON_API_KEY and is tracked separately.
  group: vercel-staging
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_uActP8CY3wkqOpyG5WDKXkTj
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_CLI_VERSION: 59.3.0

jobs:
  deploy:
    name: staging deploy
    # Pull requests only. A push to main is production's business, and `ci` runs
    # on both.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging.app.kithena.com
    steps:
      # The commit `ci` tested, not the branch tip, which may have moved on.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - name: install
        run: pnpm install --frozen-lockfile

      - name: check the secrets
        run: |
          missing=
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "${{ secrets.DATABASE_URL }}" ] && missing="$missing DATABASE_URL"
          [ -z "${{ vars.VERCEL_WEB_PROJECT_ID }}" ] && missing="$missing VERCEL_WEB_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing staging secret(s):$missing"
            exit 1
          fi

      # Migrations before the deploy, never after. Expand-contract means the new
      # schema is readable by the old code, so migrating first is safe and
      # migrating second is a window where the new code reads columns that do
      # not exist yet.
      - name: migrate staging
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ATLAS_DEV_URL: ${{ vars.ATLAS_DEV_URL }}
        run: |
          # Pinned, not `latest`. Atlas moved `migrate lint` behind a paid
          # tier in v0.38, and because this downloaded `latest` the production
          # deploy broke on a release nobody here made. A version that can
          # change under us is a deploy that can fail for reasons not in this
          # repository. v0.37.0 is the last release where `lint` runs without
          # an account; bump it deliberately.
          ATLAS_VERSION=v0.37.0
          curl -sSf "https://release.ariga.io/atlas/atlas-linux-amd64-${ATLAS_VERSION}" -o /usr/local/bin/atlas
          chmod +x /usr/local/bin/atlas
          atlas migrate apply --env staging

      - name: build web
        env:
          TENANT_HOST_SUFFIX: staging.app.kithena.com
      # `turbo run ... --filter=X...` and not `pnpm --filter X build`. The
      # trailing `...` means "and everything X depends on": turbo.json makes
      # `build` depend on `^build` and `codegen`, so a bare pnpm filter runs
      # `next build` against workspace packages that were never built. That is
      # how this failed — `Module not found: Can't resolve '@kithena/contracts'`
      # — and it passes locally only because a developer's tree already has the
      # dist directories. The Dockerfile has always done it this way.
        run: pnpm turbo run build --filter=@kithena/web...

      - name: deploy
        id: deploy
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEB_PROJECT_ID }}
        run: |
          # `pipefail`, because this pipes into `tail`: without it the status
          # reported is `tail`'s, so a deploy that failed exits 0 here and
          # hands an empty URL to everything downstream.
          set -o pipefail
          url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy \
            --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # Both, and the wildcard is the one that matters.
          #
          # `staging.app.kithena.com` is the tenant host *suffix* and answers
          # 404 by design, so aliasing only that pointed the one domain nobody
          # uses at the new build and left every real tenant host —
          # `acme.staging.app.kithena.com` — on whichever deployment last held
          # the wildcard. Staging looked green for a week while serving a build
          # from before the change under test, and the smoke test could not see
          # it because the host it checks is the host that 404s either way.
          #
          # Production does not need this: it deploys `--prod`, so both domains
          # are production domains of the project and promoting the deployment
          # points them at it.
          for domain in staging.app.kithena.com '*.staging.app.kithena.com'; do
            npx --yes vercel@${VERCEL_CLI_VERSION} alias set "$url" \
              "$domain" --token "$VERCEL_TOKEN"
          done

      # Whether the deployment is serving, not whether a tenant exists.
      #
      # `staging.app.kithena.com` is the tenant host *suffix*, not a tenant, so
      # it answers 404 — and that is the correct answer rather than a fault.
      # `apps/web/src/lib/tenant.ts` is part of the isolation boundary and is
      # written to fail closed: an unparseable host, an unknown label and a
      # reserved label all produce `null`, and `null` is a 404. A bare suffix
      # has no label at all.
      #
      # `--fail` therefore turned the app behaving correctly into a failed
      # deploy, and because this step runs under `bash -e` it took `deploy
      # identity` and the back-office down with it — the schema moved, the front
      # end shipped, and the thing holding sessions was never told. That is the
      # exact failure mode #38 is about, one layer up.
      #
      # So: a response, and not a server error. A 404 from the app proves Next
      # is running and the host was resolved. A 502 or a timeout does not.
      # Asserting 404 exactly would break the day the suffix grows a marketing
      # page, which is not a thing this check should have an opinion about.
      - name: smoke test
        run: |
          code="$(curl --silent --show-error --location --output /dev/null \
            --retry 5 --retry-delay 5 --max-time 30 \
            --write-out '%{http_code}' https://staging.app.kithena.com)"
          echo "staging.app.kithena.com answered $code"

          # And a real tenant host, which is what the wildcard alias serves.
          # The suffix above answers 404 whether the deployment is current or a
          # month old; this one does not, so it is the check that would have
          # caught the tenant hosts being stale.
          tenant="$(curl -sS --retry 5 --retry-delay 4 --retry-all-errors \
            --output /dev/null --write-out '%{http_code}' \
            https://acme.staging.app.kithena.com/)"
          echo "acme.staging.app.kithena.com answered $tenant"
          if [ "$tenant" = "404" ]; then
            echo "::error::the tenant wildcard is not serving this deployment"
            exit 1
          fi
          if [ -z "$code" ] || [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "::error::the tenant app is not serving (answered ${code:-nothing})"
            exit 1
          fi

      # The identity service, which no workflow deployed until now. A pipeline
      # that migrates the database and ships the UI while leaving the service
      # on old code is the worst of the three states: the schema has moved, the
      # front end expects it, and the thing holding sessions has not been told.


      # The identity service.
      #
      # After the migration and before the UI. Expand-contract means new code
      # reads the old schema and old code reads the new one, so the only
      # ordering that is never wrong is schema, then service, then client.
      #
      # A Vercel function rather than a container since 2026-08-22: the reason
      # it needed a process was a Valkey connection held across requests, and
      # challenges live in Postgres now. docs/environments.md has the rest.
      #
      # `--prod`, and that is not a typo. This is the *staging* project, whose
      # production environment is staging — `kithena-identity` holds only
      # `identity.staging.kithena.com`, and production lives in a different
      # project entirely for the reason `vercel-production.yml` sets out at
      # length.
      #
      # Without it this deployed a preview and aliased nothing, so the custom
      # domain went on serving whatever it served before and the smoke test
      # below passed against it. A deploy step that cannot change what the
      # domain serves is a deploy step that does nothing, and it passes.
      - name: deploy identity
        env:
          VERCEL_PROJECT_ID: prj_lpS5Um8fsfD6TUuEwE8PfctaiJPD
        run: |
          npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prod \
            --yes --archive=tgz --token "$VERCEL_TOKEN"

      # The custom domain, not the deployment URL. `ssoProtection` is set to
      # `all_except_custom_domains`, so a `.vercel.app` host answers 302 to a
      # login page and would pass a naive check that follows redirects.
      - name: smoke test identity
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --max-time 30 \
            https://identity.staging.kithena.com/.well-known/jwks.json >/dev/null

      # The messaging service.
      #
      # After identity, because identity is what calls it: deploying the caller
      # first would leave a window where an invitation is issued and the thing
      # that mails it is still the previous build. Nothing breaks either way —
      # the link comes back in the response regardless — but the ordering costs
      # nothing and one of the two is right.
      #
      # Its project id comes from a repository variable rather than being
      # written here, because the project is created once by hand and this
      # workflow has to be mergeable before that happens.
      - name: deploy messaging
        id: messaging
        if: vars.VERCEL_PROJECT_ID_MESSAGING_STAGING != ''
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_MESSAGING_STAGING }}
        run: |
          npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prod \
            --yes --archive=tgz --token "$VERCEL_TOKEN"

      # `/healthz`, which is deliberately unauthenticated and says nothing worth
      # having — a status and which transport is composed. Putting the shared
      # secret into a smoke test is how the shared secret reaches a workflow log.
      #
      # The custom domain, not the deployment URL: `ssoProtection` is
      # `all_except_custom_domains`, so a `.vercel.app` host answers 302 to a
      # login page and would pass a naive check that follows redirects.
      - name: smoke test messaging
        if: vars.VERCEL_PROJECT_ID_MESSAGING_STAGING != ''
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --max-time 30 \
            https://messaging.staging.kithena.com/healthz >/dev/null

      - name: build back-office
        env:
          # The same suffix `apps/web/src/proxy.ts` strips to find a tenant, so
          # the two cannot disagree about what a company's address is. Without
          # it the back-office printed `acme.app.kithena.com` on every screen —
          # a real hostname, belonging to production, and wrong everywhere else.
          TENANT_HOST_SUFFIX: staging.app.kithena.com
        run: pnpm turbo run build --filter=@kithena/admin...

      # The back-office, on its own registrable domain rather than a path.
      #
      # The auth origin, which staging did not deploy until now.
      #
      # It was "shipped by hand" — which meant staging ran a new identity and a
      # new tenant app against whatever build of the sign-in page somebody last
      # pushed from a laptop. That is the worst of the three to have stale,
      # because it is the one holding the ceremony: the handoff endpoint this
      # release adds returned 404 on staging while both sides of it were live.
      #
      # No build step, matching production: this app carries its own
      # `vercel.json` with `buildCommand`, so Vercel builds it from
      # `apps/auth/shell` as its Root Directory, and deploying from the
      # repository root is what gives that command its workspace.
      #
      # `--prod` because this project's production deployment *is* staging's
      # auth origin — `auth.staging.app.kithena.com` is assigned to it. A
      # preview deploy would build the change and alias it nowhere.
      - name: deploy auth
        id: auth
        env:
          VERCEL_PROJECT_ID: prj_SGKR5ItEN1XaYgorCPRNBYQxuHqM
        run: |
          # `pipefail`, because this pipes into `tail`: without it the status
          # reported is `tail`'s, so a deploy that failed exits 0 here and
          # hands an empty URL to everything downstream.
          set -o pipefail
          url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prod \
            --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Auth origin staging: $url"

      # The sign-in page itself, which must render before anybody can use it,
      # and the handoff route that finishes a sign-in. Both unauthenticated: one
      # is a public page, the other answers 400 to an empty body and says
      # nothing about whether any session exists.
      - name: smoke test auth
        run: |
          code="$(curl -fsS --retry 5 --retry-delay 4 --retry-all-errors \
            --output /dev/null --write-out '%{http_code}' \
            'https://auth.staging.app.kithena.com/login?tenant=acme')"
          echo "auth.staging login answered $code"

          handoff="$(curl -sS --retry 3 --retry-delay 4 --retry-all-errors \
            --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' -d '{}' \
            'https://auth.staging.app.kithena.com/api/auth/handoff')"
          echo "auth.staging handoff answered $handoff"
          # 401 is the correct answer to a request with no session cookie. A 404
          # means the deploy did not carry this release's routes at all, which
          # is exactly the staleness this step exists to catch.
          if [ "$handoff" = "404" ]; then
            echo "::error::the auth origin is missing /api/auth/handoff"
            exit 1
          fi

      # `admin.kithena.com` is not under `app.kithena.com`, so a browser will
      # not offer an employee's passkey here and will not offer an operator's
      # there. That isolation is free and it is the main reason this is a
      # separate host.
      - name: deploy back-office
        id: admin
        env:
          VERCEL_PROJECT_ID: prj_xFPtNIieNz3jP5EvFNPaFOJwgRe4
        run: |
          # `pipefail`, because this pipes into `tail`: without it the status
          # reported is `tail`'s, so a deploy that failed exits 0 here and
          # hands an empty URL to everything downstream.
          set -o pipefail
          url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy \
            --yes --archive=tgz --token "$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL; treating this as a failed deploy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          npx --yes vercel@${VERCEL_CLI_VERSION} alias set "$url" \
            admin.staging.kithena.com --token "$VERCEL_TOKEN"

      # `/sign-in` and not `/`, deliberately. The root redirects when nobody is
      # signed in, which is the correct behaviour and a 307 rather than a 200 —
      # checking it would either pass for the wrong reason or need
      # `--location`, and following a redirect into a page that must never
      # render for a stranger is not a smoke test worth having.
      - name: smoke test the back-office
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --max-time 30 \
            https://admin.staging.kithena.com/sign-in >/dev/null

      - name: comment the url on the pr
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].number // empty')
          [ -z "$pr" ] && { echo "::notice::no pull request for ${SHA}"; exit 0; }
          body="<!-- staging -->
          ## 🧪 Staging

          \`${SHA:0:7}\` is on staging: https://staging.app.kithena.com

          Tenants resolve at \`<company>.staging.app.kithena.com\`.
          Test customers only — staging holds no real customer data.
          "
          existing=$(gh api "repos/${REPO}/issues/${pr}/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- staging -->")) | .id' | head -n 1)
          if [ -n "$existing" ]; then
            gh api "repos/${REPO}/issues/comments/${existing}" --method PATCH -f body="$body"
          else
            gh pr comment "$pr" --body "$body"
          fi
