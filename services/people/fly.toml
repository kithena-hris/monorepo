# The People service on Fly.io: a process, because it consumes Kafka, runs
# hourly jobs and drains on SIGTERM (`Dockerfile` has the reasons).
#
# No `app` line: the name is a repository variable (`FLY_APP_PEOPLE_STAGING`,
# `FLY_APP_PEOPLE_PRODUCTION`) passed as `--app`, because the apps are created
# by hand and this file has to be mergeable before they exist. Every setting
# People reads is a Fly secret; `docs/environments.md` lists them.

primary_region = "mad"          # Madrid, nearest the Neon region, as identity was

# `@kithena/telemetry` drains on SIGTERM and SIGINT alike (PEO-118); SIGTERM
# is named so the signal is the one the drain was tested with rather than
# Fly's default. The timeout is what matters: Fly's default is 5 s, inside
# `SHUTDOWN_DEADLINE_MS` (10 s), so a deploy would SIGKILL a drain halfway —
# a Kafka message in hand redelivered, an hourly job cut off mid-tenant.
kill_signal = "SIGTERM"
kill_timeout = 30

[http_service]
  internal_port = 4001
  force_https = true
  # Never scaled to zero. A stopped machine is a consumer group with no member
  # and an hourly job that does not run; Fly's proxy would wake it for a
  # request, but nothing wakes it for a Kafka message or the clock.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    # Yoga's own `/health`, which needs no database and no credential: a failing
    # check means the process is down, not that Postgres is.
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
