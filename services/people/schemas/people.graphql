  """
  Who a bulk hire would hire and who it would skip, and why; nothing is kept.
  """
  peopleBulkHirePreview(hires: [BulkHireInput!]!): BulkEditResult
  peopleChat: PeopleChat
  peopleClassificationAdvice(dataType: String!, description: String, label: String!, options: [String!]!, sectionKey: String!): ClassificationAdvice
  peopleCompleteness(after: ID): PeopleCompleteness
  peopleDirectory(
    after: ID
    conditions: [DirectoryConditionInput!]
    filter: String
    """Only people with a required detail missing; HR’s alone."""
    incomplete: Boolean
    """all (default) or any."""
    match: String
    search: String
    segment: ID
    """`key:asc` or `key:desc`; `name` sorts by name."""
    sort: String
  ): PeopleDirectory
  """
  What somebody typed in the directory, as its own filters and order (JSON). A name alone is a name search. The model, where there is one, sees the sentence and field names only.
