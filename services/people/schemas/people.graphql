  """The saved segments you see and could use somewhere (PEO-068)."""
  peopleSegments: [PeopleSegment!]
  peopleSettings: PeopleSettings
  peopleSetup: PeopleSetup
  """A summary sent to you, or by you, while it lasts (JSON)."""
