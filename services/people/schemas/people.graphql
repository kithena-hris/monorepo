type WebhookEndpoint {
  alertEmail: String
  allowlist: [String!]
  enabled: Boolean
  events: [String!]
  id: ID
  lastDelivery: String
  problem: String
  retrying: Int
  secretRotated: String
  url: String
}

type WebhookEndpointSecret {
  id: ID
  """Shown once. Null when a retry of the same key answers: rotate again."""
  secret: String
}

type WebhookReplay {
  deliveryId: ID
}

type WriteOutcome {
  ok: Boolean
}

scalar _Any

union _Entity = Person

type _Service {
  """
  The sdl representing the federated service capabilities. Includes federation directives, removes federation types, and includes rest of full schema after schema directives have been applied
  """
  sdl: String
}
