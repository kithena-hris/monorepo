    """
    remembered: String
    sentence: String!
  ): String
  """
  Suspected duplicates (PEO-074), and the pair a and b side by side; HR only.
  """
  peopleDuplicates(a: ID, b: ID): PeopleDuplicates
  """The requester’s own export, its links signed again."""
  peopleExport(id: ID!): PeopleExport
  peopleExportBuilder(
    """The directory’s conditions, offered as one more audience."""
    conditions: [DirectoryConditionInput!]
    """all (default) or any."""
    match: String
  ): PeopleExportBuilder
  """
  An export described in words, as the builder’s own choices and a drafted reason (JSON). Nothing is exported.
  """
  peopleExportPlan(sentence: String!): String
  """
  A finished export for its requester or recipient: where it went, what it holds, its About and its links (JSON).
  """
  peopleExportRecord(id: ID!): String
  """
  A request to send an export, for its requester, its recipient or a People administrator (JSON).
  """
  peopleExportShare(id: ID!): String
  """
  Whom an export would go to — picked, or read from the sentence by People, never by the model — what they could not read themselves, and who would approve it (JSON). Nothing is built.
  """
  peopleExportSharePreview(
    """JSON: choice, recipient, sentence"""
