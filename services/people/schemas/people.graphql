  """The summary as edited, on paper: a PDF, base64. Writes nothing."""
  peopleSummaryPdf(input: String!): String
  """
  Imports and exports, newest first, 50 at a time; HR and People administrators.
  """
  peopleTransferHistory(before: ID): PeopleTransferHistory
  """
  One endpoint’s delivery log, newest first, 50 at a time; people_admin only.
  """
  peopleWebhookDeliveries(after: ID, endpointId: ID!): WebhookDeliveries
  """
  A period’s changes as points, each with its figure and the records behind it, in People’s words (JSON). Nothing goes to a model.
  """
