  """People whose name matches, as this viewer may read them."""
  peoplePicker(after: ID, search: String): PeoplePicker
  """One person as the viewer may see them; no id is "my profile"."""
  peopleProfile(personId: ID): PeopleProfile
  """What publishing the draft would do, from requiredFrom; rolled back."""
  peoplePublishPreview(requiredFrom: String!): PublishPreview
  peopleRegistry: PeopleRegistry
  """One scheduled report’s last 50 runs, newest first."""
