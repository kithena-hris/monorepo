# Valkey, as a declared machine rather than one somebody ran once by hand.
#
# It holds WebAuthn challenges and nothing else: a challenge is a one-time
# number proving a signature is fresh, it lives about sixty seconds, and it is
# worthless afterwards. So both persistence mechanisms are off — `--save ""`
# and `--appendonly no`. There is no volume and losing this machine loses
# nothing but an in-flight login, which retries.
#
# It exists as a file because it did not, and that cost an enrolment. The
# machine was created with a one-off `fly machine run`, so the flags that keep
# it alive lived only in one terminal's history; when Fly stopped it, nothing
# in the repository said how to bring it back or why it was configured that
# way.

app = "kithena-valkey"
primary_region = "iad"

[build]
  image = "valkey/valkey:8-alpine"

[processes]
  # `--protected-mode no` because Valkey refuses to serve non-loopback clients
  # when it has neither a password nor an explicit bind, and this machine has
  # neither by design: it has no public IP and is reachable only on the
  # organisation's private network, so the password would be a second secret
  # protecting a door that is already inside the building.
  app = "valkey-server --save '' --appendonly no --protected-mode no --maxmemory 200mb --maxmemory-policy allkeys-lru"

# A service, purely so Fly stops idling the machine.
#
# `fly machine run --autostop=off` did not hold: the machine stopped anyway,
# twice, and the second time it took the passkey enrolment with it. Autostop is
# a property of a service, and a machine with no services declared has no
# service for the setting to attach to — so it was never being applied. This is
# an internal port with no handlers, exposed to nothing.
# No public IP is allocated for this app and none must be. The port below
# exists because Fly's validator rejects a service without one, not because
# anything outside the private network should reach 6379 — this Valkey has no
# password and protected mode off. `fly ips list` must stay empty for both
# valkey apps; if it ever shows an address, release it.
[[services]]
  internal_port = 6379
  protocol = "tcp"
  processes = ["app"]
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 6379

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
