version: '1'

listen_addr: '0.0.0.0:4000'
graph:
  sign_key: '${GRAPH_SIGN_KEY}'

# Persisted queries only in production. The client sends a hash, not a
# document, which kills query-depth abuse and gives per-operation cost
# accounting for free.
persisted_operations:
  disabled: false
  safelist:
    enabled: true
  # Self-hosted, no control plane: the safelist is the files under
  # `persisted/operations/<sha256>.json`, one `{ "version": 1, "body": … }`
  # per operation, generated from the tenant app's list
  # (`apps/web/src/lib/people-operations.ts` and `timeoff-operations.ts`,
  # `pnpm --filter @kithena/gateway persist`). Relative to the router's
  # working directory: `apps/gateway` for `pnpm dev`, `/` in the image, where
  # `persisted/` is mounted.
  storage:
    provider_id: operations
    object_prefix: operations

storage_providers:
  file_system:
    - id: operations
      path: persisted

# Who is asking, verified here and nowhere else (PEO-092).
#
# A token minted by identity (ES256, `docs/authentication.md` "Sessions") is
# checked against identity's published keys, and a request without one is
# refused before any subgraph sees it. The subgraphs never parse a JWT.
#
# The audience is checked too (PEO-113): identity issues the tenant app's
# server a five-minute access token for `AUTH_TOKEN_AUDIENCE` — the same value
# identity signs with — and a token minted for anything else is refused here.
#
# Key rotation is the JWKS's: identity publishes the next key before it signs
# with it and keeps the previous one until its tokens have expired
# (`AUTH_VERIFICATION_KEYS`). A `kid` the router has not seen makes it refetch
# the JWKS at once rather than wait for the five-minute refresh, rate-limited
# so a stream of forged `kid`s cannot turn it into a load generator.
authentication:
  jwt:
    jwks:
      - url: '${AUTH_JWKS_URL}'
        refresh_interval: 5m
        algorithms: ['ES256']
        audiences: ['${AUTH_TOKEN_AUDIENCE}']
        refresh_unknown_kid:
          enabled: true
          max_wait: 30s
          interval: 10s
          burst: 2
    header_name: Authorization
    header_value_prefix: Bearer

authorization:
  require_authentication: true

# What a subgraph is told, and the proof the router told it.
#
# People trusts `x-kithena-principal` only beside `x-internal-token`
# (`services/people/src/http/caller.ts`): the token says the router sent the
# request, and the principal says for whom. Both are `set`, never
# `propagate`, so a copy a client sent is overwritten rather than forwarded —
# a client that could choose its own principal could read anybody's record.
#
# `roles` is empty on purpose: tenant roles are OpenFGA tuples (PEO-092), not
# token claims. `entitlements` is the deployment's list, the default for a
# company the back office recorded none for (PEO-114), as a JSON array, e.g.
# `KITHENA_ENTITLEMENTS='["module.people"]'`. A company with a recorded list
# is judged by that list: People keeps a copy from
# `identity.tenant.entitlements_changed` and prefers it to anything forwarded.
headers:
  subgraphs:
    people:
      request:
        - op: 'set'
          name: 'x-kithena-principal'
          # Concatenated rather than `toJSON`, which this router's expression
          # language does not offer. Safe because `sub` and `tid` come from a
          # token identity signed, and are uuids; People re-validates both.
          #
          # `act` (RFC 8693) is the actor behind the subject, a uuid, and
          # identity sets it on two kinds of session only:
          #
          # - `impersonatedBy`: the operator behind a support session, whose
          #   `act` has no `kind`. People makes it a full administrator.
          # - `viewedBy`: the People administrator viewing as the subject,
          #   whose `act` says `kind: view_as`. People makes it the subject,
          #   read-only. Never forwarded as `impersonatedBy`, or it would be
          #   support.
          #
          # Each null otherwise, so a principal always says which.
          expression: >-
            '{"userId":"' + request.auth.claims.sub + '","tenantId":"' +
            request.auth.claims.tid + '","impersonatedBy":' +
            (request.auth.claims.act?.sub == nil || request.auth.claims.act?.kind == 'view_as' ? 'null' : '"' + request.auth.claims.act.sub + '"') +
            ',"viewedBy":' +
            (request.auth.claims.act?.sub != nil && request.auth.claims.act?.kind == 'view_as' ? '"' + request.auth.claims.act.sub + '"' : 'null') +
            ',"roles":[],"entitlements":${KITHENA_ENTITLEMENTS}}'
        - op: 'set'
          name: 'x-internal-token'
          value: '${PEOPLE_API_TOKEN}'
    # Time Off (`services/timeoff/src/http/caller.ts`): People's principal,
    # under Time Off's own secret, one per pair as for audit. The token names
    # an account and no person; Time Off finds the member that account signs
    # in as in its own projection. A support or view-as session is forwarded
    # as such, and Time Off refuses it rather than mistake it for the employee.
    timeoff:
      request:
        - op: 'set'
          name: 'x-kithena-principal'
          expression: >-
            '{"userId":"' + request.auth.claims.sub + '","tenantId":"' +
            request.auth.claims.tid + '","impersonatedBy":' +
            (request.auth.claims.act?.sub == nil || request.auth.claims.act?.kind == 'view_as' ? 'null' : '"' + request.auth.claims.act.sub + '"') +
            ',"viewedBy":' +
            (request.auth.claims.act?.sub != nil && request.auth.claims.act?.kind == 'view_as' ? '"' + request.auth.claims.act.sub + '"' : 'null') +
            ',"entitlements":${KITHENA_ENTITLEMENTS}}'
        - op: 'set'
          name: 'x-internal-token'
          value: '${TIMEOFF_API_TOKEN}'
    # The central activity log (`platform/audit`, `docs/audit.md`): the same
    # principal, less what only People reads, and its own secret — one per
    # pair of services, so a leak of People's does not open the log.
    audit:
      request:
        - op: 'set'
          name: 'x-kithena-principal'
          expression: >-
            '{"userId":"' + request.auth.claims.sub + '","tenantId":"' +
            request.auth.claims.tid + '","impersonatedBy":' +
            (request.auth.claims.act?.sub == nil || request.auth.claims.act?.kind == 'view_as' ? 'null' : '"' + request.auth.claims.act.sub + '"') +
            ',"viewedBy":' +
            (request.auth.claims.act?.sub != nil && request.auth.claims.act?.kind == 'view_as' ? '"' + request.auth.claims.act.sub + '"' : 'null') +
            '}'
        - op: 'set'
          name: 'x-internal-token'
          value: '${AUDIT_API_TOKEN}'
    # Time Off (`services/timeoff/src/http/caller.ts`): People's principal,
    # entitlements included (it refuses a company without `module.timeoff`),
    # and its own secret. `personId` is forwarded once identity's token
    # carries one; until then the caller is an account.
    timeoff:
      request:
        - op: 'set'
          name: 'x-kithena-principal'
          expression: >-
            '{"userId":"' + request.auth.claims.sub + '","tenantId":"' +
            request.auth.claims.tid + '","entitlements":${KITHENA_ENTITLEMENTS}}'
        - op: 'set'
          name: 'x-internal-token'
          value: '${TIMEOFF_API_TOKEN}'

# People's refusal reaches the caller as People gave it: its code (FORBIDDEN,
# LAST_ADMIN, IDEMPOTENCY_KEY_REUSED …), its message and the field it names
# (`toGraphQLError`), which is what the tenant app shows, and for a re-uploaded
# import the signed link to the report the first one stored (PEO-090). A
# People error carries nothing else — never a stack — and only those pass.
subgraph_error_propagation:
  mode: pass-through
  allowed_extension_fields: ['code', 'field', 'link']

# `complexity_limits`, not `complexity_calculation`: the router refuses to boot
# on the old key (schema validation), which went unnoticed until PEO-092 first
# started this file in a test.
security:
  complexity_limits:
    total_fields:
      enabled: true
      limit: 10000
    depth:
      enabled: true
      limit: 12
    root_fields:
      enabled: true
      limit: 20

# No file comes through the router. An import's file goes from the browser
# straight to object storage with a presigned PUT that People issues (PRD
# §14.2); the router carries only where to put it. Uploads are off, so a
# multipart request is refused here, before any subgraph sees it.
file_upload:
  enabled: false

# Every body is small JSON: the router's default ceiling stands.
traffic_shaping:
  all:
    request_timeout: 30s
  # Committing a 100 MB import writes every row in one transaction, which can
  # outlast the 30 seconds everything else is held to.
  subgraphs:
    people:
      request_timeout: 300s

# Event-driven federation: a Redpanda topic backs a GraphQL subscription
# declaratively, instead of per-module pub/sub plumbing.
events:
  providers:
    kafka:
      - id: kithena
        brokers:
          - localhost:19092

telemetry:
  tracing:
    enabled: true
    exporters:
      - endpoint: http://localhost:4318
