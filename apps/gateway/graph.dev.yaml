# Local dev: composed from the checked-in SDL, so the router does not race the
# subgraphs at start-up. The router runs in Docker, so it reaches the services
# on the host through host.docker.internal.
version: 1
subgraphs:
  - name: people
    routing_url: http://host.docker.internal:4001/graphql
    schema:
      file: ../../services/people/schemas/people.graphql
  - name: timeoff
    routing_url: http://host.docker.internal:4002/graphql
    schema:
      file: ../../services/timeoff/schemas/timeoff.graphql
  - name: documents
    routing_url: http://host.docker.internal:4003/graphql
    schema:
      file: ../../services/documents/schemas/documents.graphql
  - name: recruiting
    routing_url: http://host.docker.internal:4005/graphql
    schema:
      file: ../../services/recruiting/schemas/recruiting.graphql
  - name: onboarding
    routing_url: http://host.docker.internal:4006/graphql
    schema:
      file: ../../services/onboarding/schemas/onboarding.graphql
  - name: audit
    routing_url: http://host.docker.internal:4103/graphql
    schema:
      file: ../../platform/audit/schemas/audit.graphql
  - name: assistant
    routing_url: http://host.docker.internal:4104/graphql
    schema:
      file: ../../platform/assistant/schemas/assistant.graphql
