name: kithena

services:
  postgres:
    # `pgvector/pgvector:pg18`, not `postgres:18-alpine`.
    #
    # `tools/scripts/init-db.sql` asks for `CREATE EXTENSION vector`, which the
    # official image does not ship. The extension fails, and because it fails
    # inside an init script the entrypoint aborts the whole file and exits 3 —
    # so `just dev` brought up a database container that was not running, with
    # the reason twenty lines up in a log nobody reads on a good day. This image
    # is the same Postgres 18 with pgvector already built in.
    #
    # 18 keeps its cluster in `18/docker` under a volume mounted at
    # `/var/lib/postgresql` (and refuses one at `.../data`), and cannot open a
    # 17 data directory. So the volume is `pgdata18`, new: an old `pgdata` is
    # left alone rather than crashing this container, and `just dev` builds the
    # empty one from the migrations and the seed. What only lived in the old
    # one (the admin passkey enrolment) starts again from `just admin-seed`.
    # `docker volume rm kithena_pgdata` once nothing there is wanted.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: kithena
      POSTGRES_PASSWORD: kithena
      POSTGRES_DB: kithena
    ports: ['5432:5432']
    volumes:
      - pgdata18:/var/lib/postgresql
      - ./tools/scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kithena']
      interval: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports: ['19092:19092', '18081:18081']
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      retries: 20

  # The datastore's tables first, as the VM does: `run` on an empty database
  # answers every call with a 500 rather than creating them.
  openfga-migrate:
    image: openfga/openfga:latest
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://kithena:kithena@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  openfga:
    image: openfga/openfga:latest
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://kithena:kithena@postgres:5432/openfga?sslmode=disable
    ports: ['8080:8080', '8081:8081']
    depends_on:
      postgres: { condition: service_healthy }
      openfga-migrate: { condition: service_completed_successfully }

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: kithena
      POSTGRES_PWD: kithena
      POSTGRES_SEEDS: postgres
    ports: ['7233:7233']
    depends_on:
      postgres: { condition: service_healthy }

  temporal-ui:
    image: temporalio/ui:latest
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ['8233:8080']
    depends_on: [temporal]

  typesense:
    image: typesense/typesense:27.1
    command: --data-dir /data --api-key=dev-only-key --enable-cors
    ports: ['8108:8108']
    volumes: [typesense:/data]

  # The local S3: SeaweedFS in its single-process mode. Production is Amazon
  # S3; this stands in for it. MinIO was here until its
  # images stopped being publicly pullable. `docs/environments.md` has why this
  # one, and `packages/testing` starts the same image for the tests.
  #
  # `-bucket` creates the buckets `.env.example` names, so nothing else has to.
  # S3 on :9000, where `S3_ENDPOINT` points; the admin UI on :9001.
  object-store:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: mini -dir=/data -bucket=kithena-dev,people-exports
    environment:
      AWS_ACCESS_KEY_ID: kithena
      AWS_SECRET_ACCESS_KEY: kithena-dev-secret
    ports: ['9000:8333', '9001:23646']
    volumes: [object-store:/data]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8333/healthz']
      interval: 5s
      retries: 20

  # Valkey: identity's session cache and People's export queue (BullMQ). The
  # recipes have always pointed `VALKEY_URL` at localhost:6379; this is the
  # thing listening there. Same image the integration tests start.
  valkey:
    image: valkey/valkey:8-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata18:
  typesense:
  object-store:
