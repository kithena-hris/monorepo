# The outbox relay: Debezium Server tailing one database's outbox and
# publishing each row to Redpanda, unchanged.
#
# One instance per database, because Debezium Server runs one source:
# identity's outbox is on Neon and People's is on the VM. Everything that
# differs between them — where the database is, who connects, which table, the
# slot's name — comes from the environment (`DEBEZIUM_SOURCE_DATABASE_HOSTNAME`
# overrides `debezium.source.database.hostname`, and so on); everything here
# is the same for both. The publication and the role are made by
# `migrations/20260927230000_outbox_relay.sql`.

debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=redpanda:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Every row is published exactly once to the broker or the relay stops: no
# duplicates from a retried send reordering a tenant's events.
debezium.sink.kafka.producer.enable.idempotence=true
debezium.sink.kafka.producer.acks=all

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.publication.name=kithena_outbox
# The migration made it; the relay's role could not, and should not.
debezium.source.publication.autocreate.mode=disabled
debezium.source.database.port=5432
debezium.source.database.user=svc_debezium
debezium.source.topic.prefix=kithena-relay
# Where the relay has got to, on the container's volume. The slot on the
# database holds the rest: WAL is kept until the relay confirms it.
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
# The first start publishes every outbox row there already is, which is how the
# events written before the relay existed reach their consumers; after that,
# only new rows. `when_needed` takes the snapshot again if the slot has gone
# (a database restored, a slot dropped), rather than silently starting from
# now and losing whatever was written in between. Consumers are idempotent by
# event id, so a replay changes nothing twice.
debezium.source.snapshot.mode=when_needed
# Advances the slot while nothing is written, so an idle outbox does not hold
# back the WAL every other table writes.
debezium.source.heartbeat.interval.ms=60000

# Debezium's outbox router: the row's `envelope` is the message, its `topic`
# (generated from the event's name and version, exactly as the contract names
# it) is where it goes, and `partition_key` (tenant:aggregate) keeps each
# aggregate's events in order.
debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.table.field.event.id=event_id
debezium.transforms.outbox.table.field.event.key=partition_key
debezium.transforms.outbox.table.field.event.payload=envelope
debezium.transforms.outbox.route.by.field=topic
# The router's default regex captures the whole value; `$1` rather than its
# `${routedByValue}`, which Quarkus would take for a config expression.
debezium.transforms.outbox.route.topic.replacement=$1
debezium.transforms.outbox.table.expand.json.payload=false
# Outbox rows only: the heartbeat's own record has no `topic` to route by and
# goes to its topic as it is.
debezium.predicates=outboxes
debezium.predicates.outboxes.type=org.apache.kafka.connect.transforms.predicates.TopicNameMatches
debezium.predicates.outboxes.pattern=kithena-relay\\..+\\.outbox
debezium.transforms.outbox.predicate=outboxes

debezium.format.key=simplestring
debezium.format.value=simplestring

quarkus.log.level=INFO
