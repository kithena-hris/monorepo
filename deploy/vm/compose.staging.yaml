# Staging, opt-in: layered over `compose.yaml` as a second Compose project
# (`kithena-staging`) with its own volumes, network and tunnel. `deploy.sh
# staging …` adds this file.
#
# Nothing is overridden: production's limits are already the small profile, so
# staging runs at the same sizes. Both together need about 5.3 GB of limits,
# which a 4 GB VM does not have — staging stays off (`ROUTER_URL_STAGING`
# unset) until the VM is 8 GB or staging has a VM of its own.
# `docs/environments.md` "Hosting" has the sizes.
services: {}
